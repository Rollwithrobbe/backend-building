<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roll with Robbe — Ops V4</title>
<script>
  // Applied synchronously, before the stylesheet below ever paints — reading this after first
  // paint (e.g. from the main app script further down) would show a flash of the default
  // (Midnight Gold) theme before flipping to whatever's actually saved. 'midnight' itself needs
  // no attribute at all — it's what :root already defines with nothing overriding it.
  (function(){
    try{
      var t = localStorage.getItem('rwr-theme');
      if(t && t !== 'midnight') document.documentElement.setAttribute('data-theme', t);
    }catch(e){ /* localStorage unavailable — just stays on the default theme, harmless */ }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap');

  :root{
    --bg: #16151c;
    --bg-raised: #1c1b23;
    --surface: #221f29;
    --surface-2: #292631;
    --border: #34313e;
    --border-soft: #2a2833;
    --text: #f0eee8;
    --text-dim: #a8a4b3;
    --text-faint: #6f6c7c;
    --accent: #c9a15a;
    --accent-dim: #8a7042;
    --accent-text: #16151c;
    --danger: #b0554f;
    --danger-bg: #2c1f1e;
    --good: #6f8f6a;
    --good-bg: #1e241d;
    --warn: #b08b3f;
    --warn-bg: #2a2418;
    --low: #5b8ab0;
    --low-bg: #1a232c;
    --purple: #9a7ec2;
    --purple-bg: #221e2c;
    --orange: #c1834f;
    --orange-bg: #2a2018;
    --teal: #5aa89e;
    --teal-bg: #182726;
    --accent-bg: #2c2618;
    --fx-green-bg: #17281e;
    --fx-green: #4fae72;
    --fx-red: #e0574c;
    /* Platform tags (TikTok/Instagram/YouTube/Facebook) used to each get their own brand-ish hue
       here — dropped (2026-08-27) after feedback that distinct per-platform colors fought with
       the theme's own accent/brand colors and added visual noise the tag didn't need. Every
       platform now renders through one shared neutral chip — see .tag-tiktok etc. below, which
       no longer read a --platform variable at all, just a flat dark-gray/white pair. */
    --radius: 10px;
    --radius-sm: 6px;
    /* one elevation system for every floating surface (modal, popover, drawer) instead of
       each having its own one-off blur — a hairline to pin the edge crisply against the
       backdrop blur, a tight near-shadow for contact/depth, and a soft far-shadow for the
       actual lift. --shadow-elevated is symmetric (surfaces that appear centered/floating);
       --shadow-elevated-left is the directional variant for the AI drawer, which slides in
       from the right and should read as casting its shadow leftward onto the page behind it. */
    --shadow-elevated: 0 0 0 1px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.2), 0 16px 40px rgba(0,0,0,.4);
    --shadow-elevated-left: 0 0 0 1px rgba(0,0,0,.3), -2px 0 6px rgba(0,0,0,.2), -16px 0 40px rgba(0,0,0,.35);
    /* mobile nav drawer slides in from the LEFT edge, so its cast falls rightward onto the
       page it's covering — mirror of --shadow-elevated-left */
    --shadow-elevated-right: 0 0 0 1px rgba(0,0,0,.3), 2px 0 6px rgba(0,0,0,.2), 16px 0 40px rgba(0,0,0,.35);
    /* the RGB triplet behind every frosted-glass surface (sidebar, modals, popovers, mobile
       topbar) — split out from a flat rgba() so a theme can swap the base tone (dark charcoal vs
       white) while keeping each surface's own hand-tuned alpha/blur untouched. See THEME_KEY. */
    --glass-rgb: 28,27,35;
  }

  /* ---- Theme: Riptide ----
     Rebuilt (2026-08-27) on a second reference — a REFIRE hydrogen-electric brand shot, deep
     teal-black landscape with a rust/terracotta vehicle accent — replacing the original white/
     Storm-Green/Vivid-Cyan version entirely: the "too bright" feedback on the white base wasn't
     fixable with small tweaks, the whole premise needed to be dark instead. Same discipline as
     every other theme here: literal reference hexes anchor bg/surface/text/accent, everything
     else derived to stay in-family. Headings move to Poppins (rounded/smooth/"branded" per
     request, replacing Space Grotesk) — body/mono stay Inter/IBM Plex Mono. */
  [data-theme="riptide"]{
    --bg: #003135;
    --bg-raised: #073940;
    --surface: #024950;
    --surface-2: #0d5058;
    --border: #16636c;
    --border-soft: #0d4750;
    --text: #afdde5;
    --text-dim: #7fb8c0;
    --text-faint: #4f7a80;
    --accent: #0fa4af;
    --accent-dim: #964734;
    --accent-text: #003135;
    --danger: #b85a42;
    --danger-bg: #2a1712;
    --good: #5fbf8a;
    --good-bg: #0f2b1e;
    --warn: #d9a24e;
    --warn-bg: #2e2415;
    --low: #4f8fbf;
    --low-bg: #16232e;
    --purple: #8a7ec2;
    --purple-bg: #211f30;
    --orange: #c97a4f;
    --orange-bg: #2e2015;
    --teal: #0fa4af;
    --teal-bg: #0a2e30;
    --accent-bg: #0a2e30;
    --fx-green-bg: #0f2b1e;
    --fx-green: #5fbf8a;
    --fx-red: #b85a42;
    --glass-rgb: 0,49,53;
    --brand-gradient: linear-gradient(135deg, #024950 0%, #0fa4af 55%, #964734 100%);
  }
  /* h1-h4 covers real page/modal titles, but most of what actually *reads* as a heading in this
     app — card labels, table column headers, "Expiring soon"-style section titles — are plain
     divs/th with manual uppercase+bold styling, not semantic heading tags, so scoping to h1-h4
     alone left almost the entire dashboard looking untouched. Covering the shared classes/tags
     those all go through instead of chasing every one-off inline-styled label individually. */
  [data-theme="riptide"] h1,
  [data-theme="riptide"] h2,
  [data-theme="riptide"] h3,
  [data-theme="riptide"] h4,
  [data-theme="riptide"] th,
  [data-theme="riptide"] .card .label,
  [data-theme="riptide"] .section-title,
  [data-theme="riptide"] .tw-head,
  [data-theme="riptide"] .nav-btn,
  [data-theme="riptide"] .btn{ font-family:'Poppins',sans-serif; }
  /* the one flat-fill exception — everywhere else reads --accent through var(), this is the one
     deliberate spot the provided brand gradient actually shows up rather than sitting unused */
  [data-theme="riptide"] .btn-primary{ background:var(--brand-gradient); border-color:transparent; color:#003135; }

  /* ---- Theme: Afterglow ----
     Third theme, from a 6-stop indigo-to-gold sunset gradient reference — deep indigo-navy base
     (the darkest stop), the mid gradient (magenta/rose/gold) doing accent duty, same "literal
     provided hexes for the anchors, derive the rest in-family" approach as Riptide/Midnight Gold.
     No font change this time — no typography signal in the reference, unlike the Sirin Labs one —
     colors only, same as Riptide's current state. The palette has no green or blue at all (it's a
     warm indigo→gold spectrum), so --good/--low/--teal are the only genuinely invented hues here,
     picked just for enough hue-family contrast against the warm/purple palette to stay legible as
     "different from everything else," not lifted from the reference. */
  [data-theme="afterglow"]{
    --bg: #1b1931;
    --bg-raised: #221e3c;
    --surface: #2b2447;
    --surface-2: #372c56;
    --border: #453564;
    --border-soft: #362a4d;
    --text: #ede3ec;
    --text-dim: #a98fb0;
    --text-faint: #6e5a7a;
    --accent: #ed9e59;
    --accent-dim: #e98cb9;
    --accent-text: #1b1931;
    --danger: #c25468;
    --danger-bg: #35202a;
    --good: #6fbf8a;
    --good-bg: #1f3327;
    --warn: #d9a24e;
    --warn-bg: #332818;
    --low: #6e85bf;
    --low-bg: #1f2740;
    --purple: #b98ac7;
    --purple-bg: #2c1f38;
    --orange: #e9944a;
    --orange-bg: #332415;
    --teal: #5fada8;
    --teal-bg: #1a2e2c;
    --accent-bg: #332415;
    --fx-green-bg: #1f3327;
    --fx-green: #6fbf8a;
    --fx-red: #c25468;
    --glass-rgb: 27,25,49;
    --brand-gradient: linear-gradient(135deg, #662249 0%, #a34054 50%, #ed9e59 100%);
  }
  [data-theme="afterglow"] .btn-primary{ background:var(--brand-gradient); border-color:transparent; color:#1b1931; }

  /* ---- Theme: Espresso ----
     Fourth theme, from a "quiet luxury" brown palette (Almond/Cafe/Caramel/Espresso/Mahogany on a
     warm cream card) — a light theme like Riptide, not dark like Midnight Gold/Afterglow. The
     reference itself only gave one real hex (repeated across every swatch row, clearly a template
     placeholder, not five distinct values) — used that one value for Espresso's ink color, where
     it actually was a plausible match, and estimated the other four named tones by eye from the
     swatch bars themselves. No font change — no typography signal was actually asked for this
     time (the reference has a serif display headline, but that wasn't part of the request), same
     colors-only state as Riptide/Afterglow. */
  [data-theme="espresso"]{
    --bg: #f0ebe3;
    --bg-raised: #e7dfd1;
    --surface: #dfd0b8;
    --surface-2: #d0bc9c;
    --border: #c2ac86;
    --border-soft: #d0bc9c;
    --text: #35261e;
    --text-dim: #6b5645;
    --text-faint: #a08f76;
    --accent: #bd7f48;
    --accent-dim: #c79485;
    --accent-text: #35261e;
    --danger: #a8503e;
    --danger-bg: #f3e0da;
    --good: #7a8f5c;
    --good-bg: #e7ecdd;
    --warn: #a8763a;
    --warn-bg: #f0e4d0;
    --low: #6e7f94;
    --low-bg: #e2e7ec;
    --purple: #8a6b7a;
    --purple-bg: #ece1e5;
    --orange: #c17a3e;
    --orange-bg: #f2e2cc;
    --teal: #5f8079;
    --teal-bg: #e0e9e6;
    --accent-bg: #f2e2cc;
    --fx-green-bg: #e7ecdd;
    --fx-green: #7a8f5c;
    --fx-red: #a8503e;
    --glass-rgb: 240,235,227;
    --brand-gradient: linear-gradient(135deg, #4a2e1e 0%, #bd7f48 50%, #c79485 100%);
  }
  [data-theme="espresso"] .btn-primary{ background:var(--brand-gradient); border-color:transparent; color:#f0ebe3; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  #root{ display:flex; min-height:100vh; }
  ::selection{ background:var(--accent); color:var(--accent-text); }

  /* Work Sans replaced Archivo Expanded as the dashboard-wide heading/label face (2026-08-27,
     after comparing candidates against both a Dashboard mockup and a real Tracked Content row) —
     applied broadly here (not just h1-h4) for the same reason the per-theme font overrides
     already were: most of what actually *reads* as a heading in this app is a plain div/th with
     manual uppercase+bold styling, not a semantic heading tag, so scoping to h1-h4 alone would
     leave almost everything untouched. Riptide keeps its own separate Poppins override — that
     was a deliberate, more recent decision for that one theme specifically, unrelated to this. */
  h1,h2,h3,h4,
  .card .label,
  .section-title,
  .tw-head,
  th,
  .nav-btn,
  .btn{ font-family:'Work Sans',sans-serif; }
  h1,h2,h3,h4{ margin:0; }
  /* tracking is size-specific, not tag-specific — h2 (22px page titles) is the largest
     text on screen here despite the tag name, so it gets the tightest tracking */
  h2{ letter-spacing:-0.015em; }
  h1{ letter-spacing:-0.01em; } /* 17px sidebar wordmark */
  h3,h4{ letter-spacing:0; } /* 15-16px modal/drawer headers — small enough that negative tracking just looks cramped */
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; }
  a{ color:var(--accent); }

  /* ---- layout ---- */
  .sidebar{
    width:220px; flex-shrink:0; background:rgba(var(--glass-rgb),0.72);
    backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--border-soft);
    padding:20px 14px; display:flex; flex-direction:column; gap:16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand-mark{ padding:0 6px; }
  .brand-mark .eyebrow{ font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--text-faint); margin-bottom:4px; }
  .brand-mark h1{ font-size:17px; font-weight:800; color:var(--text); }
  .brand-mark h1 span{ color:var(--accent); }

  /* Desktop-only alerts bell — top-right of the whole dashboard, not tucked into the sidebar.
     Rendered as a top-level sibling in render() (not nested in .sidebar), so it's immune to the
     backdrop-filter containing-block clipping issue by construction, same reasoning as the
     popover itself. Hidden under the mobile breakpoint, where .mobile-topbar carries its own
     bell instance instead (see the max-width:820px block below). */
  .alerts-bell-desktop{ position:fixed; top:12px; right:24px; z-index:95; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-btn{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm);
    color:var(--text-dim); font-size:13.5px; font-weight:500; cursor:pointer; border:1px solid transparent;
    background:transparent; text-align:left; width:100%; transition:transform 100ms ease-out, background 100ms ease-out;
  }
  .nav-btn:hover{ background:var(--surface); color:var(--text); }
  .nav-btn:active{ transform:scale(0.97); }
  .nav-btn.active{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .nav-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .nav-btn.active .dot{ background:var(--accent); }

  .ai-toggle-btn{ width:100%; text-align:left; }

  .sidebar-foot{ margin-top:auto; font-size:11px; color:var(--text-faint); padding:0 6px; line-height:1.6; }

  /* ---- mobile top app bar + hamburger (hidden on desktop; the media query below turns
     it on and turns the sidebar into the drawer it opens) ---- */
  .mobile-topbar{ display:none; }
  .mobile-nav-toggle{
    flex-shrink:0; width:34px; height:34px; padding:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px; background:transparent; border:1px solid var(--border);
    border-radius:var(--radius-sm); cursor:pointer; transition:border-color 150ms ease, background 100ms ease-out;
  }
  .mobile-nav-toggle:active{ background:var(--surface); }
  .mobile-nav-toggle span{ display:block; width:16px; height:2px; border-radius:1px; background:var(--text); transition:transform 260ms cubic-bezier(.32,.72,0,1), opacity 200ms ease; }
  .mobile-nav-toggle.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .mobile-nav-toggle.open span:nth-child(2){ opacity:0; }
  .mobile-nav-toggle.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  /* always in the DOM (not conditionally rendered) so it's the *same* node across an
     open/close toggle — see setMobileNavOpen(), which flips .visible directly with
     classList instead of going through the innerHTML-replacing render() pipeline.
     Replacing the node on every toggle is exactly what made this "just pop" instead of
     fading: a freshly-created element has no prior frame to transition from. pointer-events
     is tied to the same class so the invisible scrim never eats clicks on the page below it. */
  .mobile-nav-scrim{
    position:fixed; inset:0; background:rgba(10,9,13,.6); z-index:95;
    opacity:0; pointer-events:none; transition:opacity 320ms cubic-bezier(.32,.72,0,1);
  }
  .mobile-nav-scrim.visible{ opacity:1; pointer-events:auto; }
  .storage-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--border-soft); padding:4px 8px; border-radius:20px; margin-top:8px;
  }
  .storage-pill .led{ width:6px; height:6px; border-radius:50%; background:var(--good); }
  .data-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .data-actions button{ flex:1 1 calc(50% - 3px); font-size:10.5px; padding:6px 4px; }
  .data-actions button.full{ flex:1 1 100%; }

  .main{ flex:1; min-width:0; padding:26px 32px 60px; max-width:1180px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-head h2{ font-size:22px; }
  .page-head .sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .head-actions{ display:flex; gap:8px; }

  /* ---- buttons ---- */
  .btn{
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
    transition:transform 100ms ease-out, border-color 150ms ease, background 150ms ease, filter 150ms ease;
  }
  .btn:hover{ border-color:var(--accent-dim); }
  .btn:active:not(:disabled){ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn-ghost:hover{ background:var(--surface); color:var(--text); }
  .btn-danger{ background:transparent; border-color:var(--border); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger-bg); border-color:var(--danger); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- cards / grid ---- */
  .grid{ display:grid; gap:14px; }
  .grid-cards{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px;
  }
  .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:8px; }
  .card .big{ font-size:24px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .card .foot{ font-size:12px; color:var(--text-dim); margin-top:6px; }

  .brand-card{ cursor:pointer; transition:transform 100ms ease-out, border-color 150ms ease; }
  .brand-card:hover{ border-color:var(--accent-dim); }
  .brand-card:active{ transform:scale(0.98); }
  .brand-card .row{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:12.5px; color:var(--text-dim); }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:7px; }

  /* ---- table ---- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); overflow:visible; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:11px 14px; border-bottom:1px solid var(--border-soft); background:var(--bg-raised); font-weight:600; }
  td{ padding:9px 14px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.row-click{ cursor:pointer; }
  tr.row-click td{ transition:background 100ms ease-out; }
  tr.row-click:hover td{ background:var(--surface-2); }
  tr.row-click:active td{ background:var(--border-soft); }

  /* Brief landing flash for a row jumped to from an alert (see applyRowHighlight) — fades from
     the accent color back to nothing so the row that was actually meant is unambiguous even in
     a long table, without needing a persistent marker left behind. */
  @keyframes rowFlash{ 0%{ background:rgba(201,161,90,0.32); } 100%{ background:transparent; } }
  tr.row-flash td{ animation:rowFlash 2.1s ease-out; }

  .tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:600; white-space:nowrap; }
  /* One shared neutral chip for every platform — not per-platform brand colors (that fought with
     the theme's own accent/palette) — deliberately a fixed dark-gray/white pair rather than
     theme-driven tokens, same look regardless of which theme is active. */
  .tag-tiktok, .tag-instagram, .tag-youtube, .tag-facebook{ background:#2b2a30; color:#f5f3ef; }
  .tag-good{ background:var(--good-bg); color:var(--good); }
  .tag-warn{ background:var(--warn-bg); color:var(--warn); }
  .tag-danger{ background:var(--danger-bg); color:var(--danger); }
  .tag-neutral{ background:var(--surface-2); color:var(--text-dim); }
  .tag-low{ background:var(--low-bg); color:var(--low); }

  select.status-select{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:5px;
    font-size:11.5px; font-weight:600; padding:5px 8px; font-family:inherit; cursor:pointer;
    transition:border-color 150ms ease, filter 100ms ease-out;
  }
  select.status-select:active{ filter:brightness(0.94); } /* transform:scale on a native <select> can render oddly while its dropdown opens, so a brightness dip instead */

  .empty{ padding:44px 20px; text-align:center; color:var(--text-faint); font-size:13px; }
  .empty b{ display:block; color:var(--text-dim); font-size:14px; margin-bottom:4px; }

  .filter-bar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input{
    background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
    padding:7px 10px; font-family:inherit; font-size:13px;
  }
  .filter-bar input{ min-width:200px; }

  .cell-input{ background:transparent; border:1px solid transparent; border-radius:5px; padding:5px 7px; color:var(--text); font-family:inherit; font-size:13px; width:100%; }
  .cell-input:hover{ border-color:var(--border-soft); }
  .cell-input:focus{ border-color:var(--accent-dim); background:var(--bg-raised); outline:none; box-shadow:0 0 0 2px var(--accent-dim); }

  .date-trigger{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:6px 10px; font-size:12px; font-family:'IBM Plex Mono',monospace; color:var(--text); cursor:pointer;
    transition:transform 100ms ease-out, border-color 150ms ease;
  }
  .date-trigger.empty{ color:var(--text-faint); font-family:'Inter',sans-serif; }
  .date-trigger:hover{ border-color:var(--accent-dim); }
  .date-trigger:active{ transform:scale(0.97); }

  .hint{ font-size:11.5px; color:var(--text-faint); margin-top:-6px; margin-bottom:12px; line-height:1.5; }

  /* ---- modal ---- */
  .overlay{ position:fixed; inset:0; background:rgba(10,9,13,.7); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .overlay.open{ display:flex; }
  .modal{
    background:rgba(var(--glass-rgb),0.86); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--border); border-top-color:rgba(255,255,255,0.06); border-radius:var(--radius); width:100%; max-width:560px; padding:22px; margin-bottom:5vh;
    box-shadow:var(--shadow-elevated);
  }
  /* materialize-in: plays once, the moment the modal/overlay node is created (openModal sets
     MODAL_ENTER only for that one render() call — see the JS comment by its declaration) */
  @keyframes overlayFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalPopIn{ from{ opacity:0; transform:scale(0.92) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .overlay-enter{ animation:overlayFadeIn 180ms ease both; }
  .modal-enter{ animation:modalPopIn 240ms cubic-bezier(0.34,1.15,0.64,1) both; transform-origin:top center; }
  .modal h3{ font-size:16px; margin-bottom:16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600; }
  .field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text);
    padding:8px 10px; font-family:inherit; font-size:13px;
  }
  .field input[type=color]{ width:64px; height:38px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:space-between; margin-top:18px; }
  .modal-actions .right{ display:flex; gap:8px; }

  .platform-block{ border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; background:var(--surface); }
  .platform-block .ph{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
  .platform-block .ph label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text); margin:0; }
  .platform-block .pf{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  /* the URL and Views inputs here were bare <input> tags with no class and no wrapping .field —
     fell through to unstyled browser-default white boxes, clashing hard with the dark theme */
  .platform-block .pf input{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    color:var(--text); padding:6px 8px; font-family:inherit; font-size:12.5px;
  }
  .platform-block .pf input:hover{ border-color:var(--border-soft); }
  .platform-block .pf input:focus{ border-color:var(--accent-dim); outline:none; box-shadow:0 0 0 2px var(--accent-dim); }
  /* accent-color alone left the *unchecked* box plain native white on iOS/mobile Safari — it
     only reliably restyles the checked state on that platform, so a fully custom checkbox
     (both states drawn by us) instead of relying on native rendering for either one. */
  .checkbox{
    appearance:none; -webkit-appearance:none; width:16px; height:16px; flex-shrink:0;
    border:1.5px solid var(--border); border-radius:4px; background:var(--surface-2);
    cursor:pointer; position:relative; transition:background 100ms ease-out, border-color 100ms ease-out;
  }
  .checkbox:checked{ background:var(--accent); border-color:var(--accent); }
  .checkbox:checked::after{
    content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid var(--accent-text); border-width:0 2px 2px 0; transform:rotate(45deg);
  }

  /* ---- alerts bell ---- */
  .alerts-bell-wrap{ position:relative; flex-shrink:0; }

  .alerts-popover{

    background:rgba(var(--glass-rgb),0.92); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);

  .alert-title{ font-size:12.5px; font-weight:600; color:var(--text); line-height:1.4; }

  .alert-hit .alert-title{ color:var(--fx-green); }
  .alert-run-error .alert-title{ color:var(--fx-red); }
  /* Already-seen notifications stay in the list (only Clear notifications removes them) but fade
     back so unread ones keep standing out — same dim treatment regardless of hit/stale type. */
  .alert-item.alert-read{ opacity:.45; }
  .alert-item.alert-read:hover{ opacity:.75; }
  .alert-item.alert-read.alert-hit .alert-title{ color:var(--text); }

  /* ---- date picker popover ---- */
  .dp-popover{
    position:fixed; z-index:200; background:rgba(var(--glass-rgb),0.88);
    backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);

  }

  .dp-day:hover{ background:var(--surface-2); }

    background:rgba(var(--glass-rgb),0.80); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
    border-left:1px solid var(--border); z-index:80;

  .ai-drawer-head h3{ font-size:15px; }

  .ai-msg{ max-width:88%; padding:9px 13px; border-radius:10px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; }

  .ai-suggest{ display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 12px; flex-shrink:0; }
  .ai-suggest button{ font-size:11px; }

  .section-title{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:26px 0 10px; }
  /* the header bar sitting inside a .table-wrap card (e.g. "Today's video quota") — same visual
     family as .section-title but padded+bordered like a card header instead of a standalone label */
  .tw-head{ padding:13px 16px; border-bottom:1px solid var(--border-soft); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); }
  .section-title:first-child{ margin-top:0; }

  /* Brand comparison — collapsible card + drag-to-reorder rows. Collapse/reorder both act
     directly on the existing DOM nodes (see setBrandComparisonCollapsed / the drag handlers)
     rather than going through render(), the same reason setMobileNavOpen bypasses it: render()
     replaces #root.innerHTML wholesale, so a class toggled on a node that's about to be thrown
     away and recreated never gets a "before" frame to transition from. */
  .tw-head-collapsible{ cursor:pointer; user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tw-head-collapsible:hover .brand-cmp-chevron{ background:var(--surface-2); }
  .brand-cmp-summary{
    font-weight:400; text-transform:none; letter-spacing:0; font-size:12px; color:var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transform:translateX(-6px);
    transition:opacity .38s cubic-bezier(.22,1,.36,1) .07s, transform .38s cubic-bezier(.22,1,.36,1) .07s;
  }
  .table-wrap.collapsed .brand-cmp-summary{ opacity:1; transform:translateX(0); }
  .brand-cmp-chevron{
    flex-shrink:0; color:var(--text-faint); display:flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px;
    transition:transform .38s cubic-bezier(.22,1,.36,1), background-color .2s ease;
  }
  .table-wrap.collapsed .brand-cmp-chevron{ transform:rotate(-90deg); }
  .brand-cmp-body{ display:grid; grid-template-rows:1fr; transition:grid-template-rows .42s cubic-bezier(.22,1,.36,1); }
  .table-wrap.collapsed .brand-cmp-body{ grid-template-rows:0fr; }
  .brand-cmp-body-inner{ overflow:hidden; transition:opacity .28s ease, filter .28s ease; }
  .table-wrap.collapsed .brand-cmp-body-inner{ opacity:0; filter:blur(1.5px); }

  .brand-cmp-grip-col{ width:26px; padding:0 0 0 10px !important; }
  td.brand-cmp-grip{ width:26px; padding:9px 0 9px 10px; cursor:grab; color:var(--text-faint); }
  td.brand-cmp-grip:active{ cursor:grabbing; }
  td.brand-cmp-grip svg{ display:block; opacity:.45; transition:opacity .2s ease; }
  tr:hover td.brand-cmp-grip svg{ opacity:.9; }
  #brandCmpTbody tr{ transition:opacity .2s ease, transform .2s ease, box-shadow .2s ease; }
  #brandCmpTbody tr.row-dragging{ opacity:.32; }
  #brandCmpTbody tr.row-drop-before{ box-shadow:inset 0 2px 0 0 var(--accent); }
  #brandCmpTbody tr.row-drop-after{ box-shadow:inset 0 -2px 0 0 var(--accent); }

  .fx-green{ color:var(--fx-green) !important; }
  .fx-red{ color:var(--fx-red) !important; }
  .delta{ font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px; }

  .range-pills{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .range-pill{ font-size:12px; font-weight:600; padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; font-family:inherit; transition:transform 100ms ease-out, border-color 150ms ease; }
  .range-pill:hover{ border-color:var(--accent-dim); }
  .range-pill:active{ transform:scale(0.95); }
  .range-pill.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  .chart-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:22px; }
  .chart-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .chart-toggle{ display:flex; gap:4px; }
  .chart-toggle button{ font-size:11px; padding:5px 11px; }

  .brand-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .brand-bar-row:last-child{ margin-bottom:0; }
  .brand-bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .brand-bar-fill{ height:100%; border-radius:4px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:26px; align-items:start; }
  .mini-task-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); }
  .mini-task-row:last-of-type{ border-bottom:none; margin-bottom:2px; }
  .mini-task-info{ display:flex; align-items:center; gap:8px; min-width:0; }
  .mini-task-title{ font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .timer-display{ font-size:13px; font-weight:600; }

  .platform-badges{ display:flex; flex-wrap:wrap; gap:4px; }
  .pf-badge{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:5px; border:1px solid transparent; cursor:pointer; font-family:inherit; transition:transform 100ms ease-out; }
  .pf-badge:active{ transform:scale(0.92); }
  .pf-badge-off{ background:transparent; border:1px dashed var(--border); color:var(--text-faint); }
  .pf-badge-off:hover{ border-color:var(--accent-dim); color:var(--text-dim); }

  .timer-done-icon{ font-size:42px; margin-bottom:10px; }
  @keyframes timerPop{ 0%{ transform:scale(.85); opacity:0; } 60%{ transform:scale(1.04); opacity:1; } 100%{ transform:scale(1); } }
  .timer-done-modal{ animation: timerPop .25s ease-out; border-color: var(--accent) !important; }

  .chart-tooltip{
    position:fixed; z-index:250; pointer-events:none; opacity:0; transition:opacity .1s ease;
    background:rgba(var(--glass-rgb),0.90); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:12px; line-height:1.6; box-shadow:0 10px 26px rgba(0,0,0,.4); max-width:230px;
  }
  .chart-tooltip.show{ opacity:1; }
  .chart-tooltip .ct-total{ font-weight:700; color:var(--text); margin-bottom:3px; white-space:nowrap; }
  .chart-tooltip .ct-row{ display:flex; justify-content:space-between; gap:14px; color:var(--text-dim); font-size:11.5px; white-space:nowrap; }
  .chart-tooltip .ct-row .ct-amt{ font-family:'IBM Plex Mono',monospace; color:var(--text); }

  /* ---- earnings line chart: materialize-in + hover crosshair ----
     Base rules below are the AT-REST state (fully drawn, fully visible, no offset) — the
     no-preference media query is what layers the enter animation on top, so a
     prefers-reduced-motion user (or the base rule before the @media block loads) simply sees
     the finished chart with no motion at all, never an invisible one waiting on an animation
     that isn't going to run. Only elements built with the .chart-enter class actually got the
     stagger delays baked into their markup (see renderLineChartSvg) — a plain re-render (no
     class) is inert, so switching a task's priority elsewhere on the page doesn't make the
     dashboard chart redraw itself for no reason. */
  .chart-line-path{ stroke-dashoffset:0; }
  .chart-area-path{ opacity:1; transform:none; transform-origin:bottom; }
  .chart-pt{ opacity:1; transform:scale(1); transform-box:fill-box; transform-origin:center; transition:transform 150ms cubic-bezier(.22,1,.36,1); }
  @media (prefers-reduced-motion: no-preference){
    .chart-enter .chart-line-path{ animation:chartDraw 900ms cubic-bezier(.16,1,.3,1) both; }
    .chart-enter .chart-area-path{ animation:chartAreaIn 700ms cubic-bezier(.16,1,.3,1) 220ms both; }
    .chart-enter .chart-pt{ animation:chartPtIn 420ms cubic-bezier(.34,1.4,.64,1) both; }
  }
  @keyframes chartDraw{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:0; } }
  @keyframes chartAreaIn{ from{ opacity:0; transform:scaleY(.85); } to{ opacity:1; transform:scaleY(1); } }
  @keyframes chartPtIn{ from{ opacity:0; transform:scale(0); } to{ opacity:1; transform:scale(1); } }

  /* one persistent group instead of per-point elements — moving it (transform, x) and the
     circle's own cy is what makes hovering from one point to the next read as the guide
     *sliding* to the new position rather than teleporting; x is shared (group transform) since
     the vertical line's ends don't need independent y movement, only the dot riding the curve does */
  .chart-hover-guide{ opacity:0; pointer-events:none; transition:opacity 140ms ease, transform 150ms cubic-bezier(.22,1,.36,1); }
  .chart-hover-guide.show{ opacity:1; }
  .chart-hover-guide line{ stroke:var(--border); stroke-width:1; }
  .chart-hover-guide circle{ fill:var(--fx-green); stroke:var(--surface); stroke-width:2; transition:cy 150ms cubic-bezier(.22,1,.36,1); }
  .chart-pt-hit:hover + .chart-pt{ transform:scale(1.35); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; z-index:100; opacity:0; transform:translateY(6px); transition:.2s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 820px){
    #root{ flex-direction:column; }

    /* Replaces the old horizontally-scrolled nav row (functional, but "a little bit
       tedious" one-handed) with the pattern most apps use on small screens: a slim top
       bar carrying just a hamburger + the current screen name, which opens the *same*
       sidebar used on desktop — brand mark, full nav list, Ask AI, footer actions — as a
       slide-in drawer over a dimmed scrim. Nothing about .sidebar's own internal layout
       needs overriding for this: its default (desktop) vertical flex styling is exactly
       what a drawer wants, so only position/transform/z-index change here. */
    .mobile-topbar{
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:110;
      background:rgba(var(--glass-rgb),0.92); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
      border-bottom:1px solid var(--border-soft); padding:12px 16px;
    }
    .mobile-topbar h1{ font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .mobile-topbar h1 span{ color:var(--accent); }

    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:270px; max-width:82vw; z-index:100;
      transform:translateX(-100%); will-change:transform;
      /* iOS sheet/drawer curve — fast off the mark, gentle settle at the end, no bounce.
         Matched by the scrim's own opacity transition (same duration+curve) above so the
         dim and the slide always finish together instead of one lagging the other. */
      transition:transform 320ms cubic-bezier(.32,.72,0,1);
      border-right:1px solid var(--border-soft); border-bottom:none;
    }
    .sidebar.mobile-open{ transform:translateX(0); box-shadow:var(--shadow-elevated-right); }

    /* auto-backup toggle only, by id — not the whole .full class, which also matches (and
       would hide) the "Move my data to the cloud" button since it happens to share the same
       width:100% styling class. File System Access API isn't available on mobile browsers
       anyway, so these three never have anything to do here. */
    #btnEnableBackup, #btnBackupStatus, #btnBackupReconnect{ display:none; }
    .alerts-bell-desktop{ display:none; }
    .main{ padding:18px; }
    .ai-drawer{ width:100vw; max-width:100vw; }
    .two-col{ grid-template-columns:1fr; }

  @media (prefers-reduced-transparency: reduce){

<script>
/* ============================================================
   ROLL WITH ROBBE — OPS V4
   Self-contained artifact. No external network calls except the
   built-in Claude-in-artifact endpoint for the AI panel.
   Storage: window.storage (personal, private to this user).
   ============================================================ */

const STORAGE_KEY = 'rwr-ops-v4';
const AI_SETTINGS_KEY = 'rwr-ai-settings-v1'; // separate from STORAGE_KEY on purpose — never touched by Export/Import
// Once true, the manual pipeline (Brands/Content/Tasks/Payments) is read from and written to
// Supabase instead of window.storage/localStorage — same tables the automated scouting jobs
// already use, so the whole dashboard is one cloud-backed system instead of two separate ones.
// Local storage keeps getting written too (as a redundant cache/backup), it just stops being
// the primary source once this flips on. See migrateToCloud() for the one-time switch-over.
const CLOUD_MODE_KEY = 'rwr-cloud-mode-v1';
let CLOUD_MODE = (typeof localStorage !== 'undefined' && localStorage.getItem(CLOUD_MODE_KEY) === '1');
// Per-device display preference (not synced to Supabase — nothing about which colors you're
// looking at needs to follow you across devices) — see the inline <script> at the very top of
// <head> for how this gets applied before first paint, and renderSettings()'s Theme tab for the
// picker UI. 'midnight' needs no data-theme attribute at all; it's what :root already is.
const THEME_KEY = 'rwr-theme';
const THEMES = [
  { id:'midnight', name:'Midnight Gold', desc:'The original look — dark charcoal with a warm gold accent.', swatches:['#16151c','#1c1b23','#c9a15a','#f0eee8'] },
  { id:'riptide', name:'Riptide', desc:'Deep teal-black base with a rust-terracotta accent, headings in a rounded, smooth, more branded-feeling face (Poppins).', swatches:['#003135','#024950','#0fa4af','#964734'] },
  { id:'afterglow', name:'Afterglow', desc:'A deep indigo-night base with a sunset gradient — magenta into rose into gold — carrying the accent. Colors only for now, same as Riptide.', swatches:['#1b1931','#662249','#a34054','#ed9e59'] },
  { id:'espresso', name:'Espresso', desc:'Quiet-luxury browns — warm cream base, espresso ink, caramel accent. Colors only for now, same as Riptide.', swatches:['#f0ebe3','#35261e','#bd7f48','#c79485'] },
];
let CURRENT_THEME = 'midnight';
try{ CURRENT_THEME = localStorage.getItem(THEME_KEY) || 'midnight'; }catch(e){ /* localStorage unavailable — just stays on the default */ }
function setTheme(themeId){
  CURRENT_THEME = themeId;
  try{ localStorage.setItem(THEME_KEY, themeId); }catch(e){}
  if(themeId === 'midnight') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', themeId);
  render();
}
const AI_MODELS = [
  { id:'claude-sonnet-5', label:'Claude Sonnet 5 (recommended)' },
  { id:'claude-opus-4-8', label:'Claude Opus 4.8 (more capable, slower/pricier)' },
  { id:'claude-haiku-4-5-20251001', label:'Claude Haiku 4.5 (fastest, cheapest)' },
];
// works two ways: window.storage when running inside a Claude conversation (personal, private,
// synced by Claude), or plain localStorage when running standalone (e.g. deployed on Vercel) —
// same calling code either way, so nothing else in the app needs to know which one it's using
const HAS_ARTIFACT_STORAGE = typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
async function storageGet(key, shared){
  if(HAS_ARTIFACT_STORAGE){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? { key, value: raw, shared: !!shared } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(HAS_ARTIFACT_STORAGE){
    return await window.storage.set(key, value, shared);
  }
  localStorage.setItem(key, value);
  return { key, value, shared: !!shared };
}

/* ---------------- optional local auto-backup file (Chrome/Edge only, via File System Access API) ----------------
   Lets the person pick one file on their own machine; every successful save also mirrors DATA to
   that file in the background. Purely local — nothing here ever leaves the browser except the
   normal write to the chosen file. The handle itself can't go in localStorage (not serializable),
   so it's kept in IndexedDB instead, and permission is re-checked (never silently re-prompted)
   each time the page loads.
------------------------------------------------------------------------------------------------- */
const HAS_FS_ACCESS = typeof window !== 'undefined' && 'showSaveFilePicker' in window;
let BACKUP_HANDLE = null;
let BACKUP_FILENAME = '';
let BACKUP_PERMISSION_OK = false;
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rwr-fs-access', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function restoreAutoBackupHandle(){
  if(!HAS_FS_ACCESS) return;
  try{
    const handle = await idbGet('backupHandle');
    if(handle){
      BACKUP_HANDLE = handle;
      BACKUP_FILENAME = handle.name;
      BACKUP_PERMISSION_OK = (await handle.queryPermission({mode:'readwrite'})) === 'granted';
    }
  }catch(e){ /* stored handle no longer valid (e.g. the file was moved or deleted) */ }
}
async function enableAutoBackup(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'rwr-ops-backup.json',
      types: [{ description: 'JSON backup', accept: {'application/json': ['.json']} }]
    });
    BACKUP_HANDLE = handle;
    BACKUP_FILENAME = handle.name;
    BACKUP_PERMISSION_OK = true;
    await idbSet('backupHandle', handle);
    await writeBackupFile();
    showToast('Auto-backup enabled — saving to ' + handle.name);
    render();
  }catch(e){
    if(e.name !== 'AbortError') console.error('Enable auto-backup failed', e);
  }
}
async function reconnectAutoBackup(){
  if(!BACKUP_HANDLE) return;
  try{
    const perm = await BACKUP_HANDLE.requestPermission({mode:'readwrite'});
    BACKUP_PERMISSION_OK = perm === 'granted';
    if(BACKUP_PERMISSION_OK){ await writeBackupFile(); showToast('Auto-backup reconnected'); }
    else showToast('Permission not granted');
    render();
  }catch(e){ console.error('Reconnect auto-backup failed', e); }
}
async function disableAutoBackup(){
  BACKUP_HANDLE = null;
  BACKUP_FILENAME = '';
  BACKUP_PERMISSION_OK = false;
  await idbDelete('backupHandle');
  showToast('Auto-backup turned off — the file itself is untouched');
  render();
}
async function writeBackupFile(){
  if(!BACKUP_HANDLE) return;
  try{
    // never re-prompt mid-save if permission was revoked — just skip silently and let the
    // sidebar's "Reconnect" state (checked on load) surface it instead
    const perm = await BACKUP_HANDLE.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const writable = await BACKUP_HANDLE.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
  }catch(e){ console.error('Auto-backup write failed', e); }
}
const PLATFORMS = [
  { id:'tiktok', label:'TikTok', short:'TT', tagClass:'tag-tiktok' },
  { id:'instagram', label:'Instagram Reels', short:'IG', tagClass:'tag-instagram' },
  { id:'youtube', label:'YouTube Shorts', short:'YT', tagClass:'tag-youtube' },
  { id:'facebook', label:'Facebook', short:'FB', tagClass:'tag-facebook' },
];
const STATUSES = ['idea','scripting','filming','editing','ready','submitted','revision','approved','scheduled','published'];
const STATUS_LABEL = { idea:'Idea', scripting:'Scripting', filming:'Filming', editing:'Editing', ready:'Ready to submit', submitted:'Waiting on brand', revision:'Revision requested', approved:'Approved', scheduled:'Scheduled', published:'Published' };
const SWATCHES = ['#c9a15a','#8a9a7a','#9c6a4e','#7a8a9c','#a3865a','#6f8f6a'];
const DOW = ['S','M','T','W','T','F','S'];
const RANGES = [
  {id:'week', label:'Week'},
  {id:'month', label:'Month'},
  {id:'3m', label:'3 months'},
  {id:'6m', label:'6 months'},
  {id:'12m', label:'12 months'},
  {id:'all', label:'All time'},
];
const PRIORITIES = [
  {id:'high', label:'High priority', cls:'tag-danger'},
  {id:'medium', label:'Medium priority', cls:'tag-warn'},
  {id:'low', label:'Low priority', cls:'tag-low'},
];
const PRIORITY_ORDER = { high:0, medium:1, low:2 };
function priorityInlineStyle(priorityId){
  const map = { high: ['var(--danger-bg)','var(--danger)'], medium: ['var(--warn-bg)','var(--warn)'], low: ['var(--low-bg)','var(--low)'] };
  const [bg, fg] = map[priorityId] || ['var(--surface-2)','var(--text-dim)'];
  return `background:${bg}; color:${fg}; border-color:${fg}; font-weight:600;`;
}
// content pipeline status colors: a warming gray->blue->purple->orange->teal progression for
// "getting it made", amber/red for "someone else's move" (waiting vs. sent back), and
// green->gold->bright-green for the three good outcomes, escalating toward "actually paid"
function statusInlineStyle(status){
  const map = {
    idea: ['var(--surface-2)','var(--text-dim)'],
    scripting: ['var(--low-bg)','var(--low)'],
    filming: ['var(--purple-bg)','var(--purple)'],
    editing: ['var(--orange-bg)','var(--orange)'],
    ready: ['var(--teal-bg)','var(--teal)'],
    submitted: ['var(--warn-bg)','var(--warn)'],
    revision: ['var(--danger-bg)','var(--danger)'],
    approved: ['var(--good-bg)','var(--good)'],
    scheduled: ['var(--accent-bg)','var(--accent)'],
    published: ['var(--fx-green-bg)','var(--fx-green)'],
  };
  const [bg, fg] = map[status] || ['var(--surface-2)','var(--text-dim)'];
  return `background:${bg}; color:${fg}; border-color:${fg}; font-weight:600;`;
}
const TASK_TIMER_SECONDS = 600; // 10 minutes

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
// Real UUID (matches Supabase's brands.id column type) — used for brand ids specifically so a
// brand created in the dashboard can be synced straight to the same table the automated
// scouting jobs write to. Falls back to a manual v4 implementation on the rare browser without
// crypto.randomUUID.
function newUuid(){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function todayISO(){
  // use LOCAL date components, not toISOString() (which is UTC) — otherwise anyone ahead of UTC
  // (e.g. Bali, UTC+8) sees "today" flip over hours late, and daily tasks stay stuck on "done"
  // from the previous day even after midnight has already passed locally
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(d){ if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function money(n){ n = Number(n)||0; return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function escapeHtml(s){ return (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- state ---------------- */
let DATA = { brands: [], content: [], payments: [], tasks: [] };
let SAVE_TIMER = null;
let VIEW = 'dashboard';
let MOBILE_NAV_OPEN = false; // mobile only — the hamburger button toggles the sidebar into a slide-in drawer instead of the old horizontal-scroll nav row
let ALERTS_OPEN = false;
// When "newly hit" alerts stop showing again — per-browser, not synced, same as CLOUD_MODE.
// null (never opened the bell before) defaults to a 7-day lookback so the very first open isn't
// an empty screen, but also isn't your entire lifetime of hits either.
let ALERTS_LAST_SEEN = (typeof localStorage !== 'undefined' && localStorage.getItem('rwr-alerts-last-seen')) || null;
let AI_LOG = [];
let AI_SETTINGS = { apiKey:'', model:'claude-sonnet-5' };
let AI_SETTINGS_OPEN = false;
let AI_BUSY = false;
let AI_OPEN = false;
let ACTIVE_BRAND_FILTER = null;
let CONTENT_FILTER = { datePreset:'all', customStart:'', customEnd:'', status:'', dateField:'created' };
let PAYMENTS_FILTER = { brandId:'' };
let DP = null; // { key, month: Date }
let DASH_RANGE = 'month';
let BRAND_TABLE_SORT = { key:'earned', dir:'desc' };
// Manual drag order for the Brand Comparison table — an array of row keys (see brandCmpRowKey),
// or null when no custom order has been set (falls back to BRAND_TABLE_SORT). Set the moment a
// row is dragged; clicking a column header clears it and returns to sorting by that column.
let BRAND_ROW_ORDER = JSON.parse(localStorage.getItem('rwr-brand-order') || 'null');
const BRAND_CMP_COLLAPSED_KEY = 'rwr-brand-cmp-collapsed';
// mirrors MODAL_ENTER's pattern (see openModal): true only for the one render() call that
// should play the chart's materialize-in animation — first mount, a range switch, or the
// moment tracked-content data first lands. Every other render() (checking a task, editing a
// payment, the mobile drawer, etc.) leaves it false so the chart doesn't visibly redraw itself
// on unrelated interactions, which read as gimmicky rather than intentional.
let CHART_ENTER = false;
function renderWithChartEnter(){ CHART_ENTER = true; render(); CHART_ENTER = false; }
let TASK_TIMERS = {}; // taskId -> { remaining, intervalId }
let TIMER_DONE_POPUP = null; // { taskTitle }
let TIMER_ENTER = false;

function normalizePlatforms(existing){
  return PLATFORMS.map(p => {
    const found = (existing||[]).find(x => x.id === p.id);
    return found
      ? { id:p.id, active: !!found.active, status: found.status || 'idea', postDate: found.postDate || '', url: found.url || '', views: found.views ?? '' }
      : { id:p.id, active:false, status:'idea', postDate:'', url:'', views:'' };
  });
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY, false);
    if(res && res.value){ DATA = JSON.parse(res.value); }
  }catch(e){ /* first run — no key yet */ }
  if(!DATA.brands) DATA.brands = [];
  if(!DATA.content) DATA.content = [];
  if(!DATA.payments) DATA.payments = [];
  if(!DATA.tasks) DATA.tasks = [];
  if(CLOUD_MODE){
    // once migrated, Supabase is the source of truth — overwrite whatever the local cache had
    // with the live cloud copy, so the dashboard shows the same data on every device
    try{ await loadFromSupabase(); }
    catch(e){ console.warn('Cloud load failed, showing the last local cache instead:', e); }
  }
  // migrate any content saved by an earlier build that dropped inactive platform slots
  DATA.content.forEach(c => {
    c.platforms = normalizePlatforms(c.platforms);
    if(c.viewRequirement === undefined) c.viewRequirement = null;
    if(c.viewRequirementMet === undefined) c.viewRequirementMet = false;
    if(c.scheduledDate === undefined) c.scheduledDate = null;
    // repair content stranded with zero active platforms (a past AI-assistant bug could create these) —
    // a video with no active platforms can never earn or show up anywhere, so activate all 3 rather than
    // leaving it silently dead.
    if(!c.platforms.some(p=>p.active)){
      c.platforms.forEach(p => { p.active = true; });
    }
    // repair content marked published with no post date (another past AI-assistant bug) — it counts
    // correctly toward lifetime totals but is invisible to every time-scoped view (week/month/chart)
    // without a date to bucket it by.
    c.platforms.forEach(p => {
      if(p.active && p.status==='published' && !p.postDate) p.postDate = (c.createdAt ? c.createdAt.slice(0,10) : todayISO());
    });
  });
  DATA.brands.forEach(b => {
    if(b.brief && b.brief.kind === undefined) b.brief.kind = 'recurring'; // existing briefs predate the trial/recurring split
  });
  DATA.tasks.forEach(t => {
    if(t.priority === undefined) t.priority = 'medium';
    if(t.daily === undefined) t.daily = false;
    if(t.requiresTimer === undefined) t.requiresTimer = false;
    if(t.timerMinutes === undefined) t.timerMinutes = 10;
    if(t.dailyDone === undefined) t.dailyDone = {};
    if(t.completed === undefined) t.completed = false;
  });
  DATA.payments.forEach(p => {
    // older payments logged before createdAt existed — backfill from their date-received field so
    // same-date payments still sort in a sane order instead of an undefined one
    if(!p.createdAt) p.createdAt = p.date ? p.date+'T00:00:00.000Z' : new Date(0).toISOString();
  });
  saveData();
  await loadAISettings();
  await restoreAutoBackupHandle();
  renderWithChartEnter();
  loadTrackedContent(); // fire-and-forget — dashboard totals update on their own once this resolves
}
async function loadAISettings(){
  try{
    const res = await storageGet(AI_SETTINGS_KEY, false);
    if(res && res.value){ AI_SETTINGS = { ...AI_SETTINGS, ...JSON.parse(res.value) }; }
  }catch(e){ /* no key saved yet */ }
}
async function saveAISettings(){
  try{ await storageSet(AI_SETTINGS_KEY, JSON.stringify(AI_SETTINGS), false); }
  catch(e){ console.error('Failed to save AI settings', e); }
}

let SAVE_RETRY_TIMER = null;
let SAVE_STATE = 'idle'; // 'idle' | 'saving' | 'error'
let SAVE_PENDING_AFTER_INFLIGHT = false; // an edit arrived while a save was already in flight

function saveData(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => triggerSave(0), 600);
}

function triggerSave(retryCount){
  if(SAVE_STATE === 'saving'){
    // don't fire a second write on top of one still in flight — the in-flight
    // save will pick up this latest state itself, so just flag it
    SAVE_PENDING_AFTER_INFLIGHT = true;
    return;
  }
  attemptSave(retryCount);
}

async function attemptSave(retryCount){
  clearTimeout(SAVE_RETRY_TIMER);
  SAVE_STATE = 'saving';
  try{
    const result = await storageSet(STORAGE_KEY, JSON.stringify(DATA), false);
    if(!result) throw new Error('Storage set returned no result');
    SAVE_STATE = 'idle';
    updateStoragePill();
    showToast('Saved');
    writeBackupFile(); // mirror to the local backup file too, if one's connected — fire-and-forget
    if(CLOUD_MODE) syncToSupabase(); // mirror brands/content/tasks/payments to Supabase too — fire-and-forget
  }catch(e){
    // expected + handled — retried automatically, so this isn't a real error, just noisy if logged as one
    console.warn('Save attempt failed, retrying:', e);
    SAVE_STATE = 'error';
    updateStoragePill();
    if(retryCount === 0) showToast('Save hiccup — retrying…');
    const backoff = [800, 2000, 5000][Math.min(retryCount, 2)];
    SAVE_RETRY_TIMER = setTimeout(() => attemptSave(retryCount + 1), backoff);
    if(retryCount >= 3) showToast('Still trying to save — your changes are kept, just not synced yet');
    return;
  }
  SAVE_STATE = 'idle';
  if(SAVE_PENDING_AFTER_INFLIGHT){
    SAVE_PENDING_AFTER_INFLIGHT = false;
    attemptSave(0); // a newer edit arrived mid-save — persist the latest state now
  }
}

function updateStoragePill(){
  const pill = document.querySelector('.storage-pill');
  if(!pill) return;
  if(SAVE_STATE === 'error'){
    pill.innerHTML = '<span class="led" style="background:var(--fx-red);"></span>Save issue — retrying…';
  } else {
    pill.innerHTML = `<span class="led"></span>${CLOUD_MODE ? '☁ Synced to cloud' : (HAS_ARTIFACT_STORAGE ? 'Stored in Claude' : 'Stored in this browser')}`;
  }
}

/* ---------------- cloud sync (Supabase) ----------------
   Mirrors DATA.brands/content/tasks/payments to the same Supabase project the automated
   scouting jobs use, once CLOUD_MODE is on (see migrateToCloud()). Brands are upserted with
   only the manual-pipeline-owned columns (name/status/color/notes/brief) so the automated-
   tracking columns on that same row (base_pay, youtube_channel_handle, etc.) are never
   touched by this. Content/tasks/payments are fully owned by the manual pipeline, so they're
   synced with upsert-then-prune (anything deleted locally gets deleted in Supabase too).
------------------------------------------------------------------------------------------- */
function isUuid(s){ return typeof s === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s); }
function brandToSupabaseRow(b){
  return { id: b.id, name: b.name, status: b.status || 'active', color: b.color || null, notes: b.notes || '', brief: b.brief || null };
}
function contentToSupabaseRow(c){
  return {
    id: c.id, brand_id: c.brandId || null, title: c.title || '', base_pay: Number(c.basePay)||0, cpm_bonus: Number(c.cpmBonus)||0,
    created_at: c.createdAt || new Date().toISOString(), view_requirement: c.viewRequirement || null,
    view_requirement_met: !!c.viewRequirementMet, view_requirement_window_days: c.viewRequirementWindowDays || null,
    scheduled_date: c.scheduledDate || null, platforms: c.platforms || [],
  };
}
function taskToSupabaseRow(t){
  return {
    id: t.id, title: t.title || '', brand_id: t.brandId || null, priority: t.priority || 'medium',
    daily: !!t.daily, requires_timer: !!t.requiresTimer, timer_minutes: t.timerMinutes || 10,
    completed: !!t.completed, daily_done: t.dailyDone || {},
    created_at: t.createdAt ? (t.createdAt.length===10 ? t.createdAt+'T00:00:00.000Z' : t.createdAt) : new Date().toISOString(),
  };
}
function paymentToSupabaseRow(p){
  return { id: p.id, brand_id: p.brandId || null, amount: Number(p.amount)||0, cpm_bonus: Number(p.cpmBonus)||0, date: p.date || null, note: p.note || '', created_at: p.createdAt || new Date().toISOString() };
}
async function upsertRows(table, rows, onConflict){
  if(rows.length === 0) return;
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify(rows),
  });
}
async function pruneDeletedRows(table, currentIds){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=id`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  const existing = await res.json();
  const toDelete = (Array.isArray(existing) ? existing : []).map(r=>r.id).filter(id => !currentIds.has(id));
  if(toDelete.length === 0) return;
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=in.(${toDelete.map(id=>`"${id}"`).join(',')})`, {
    method: 'DELETE',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
  });
}
let SYNC_IN_FLIGHT = false;
async function syncToSupabase(){
  if(SYNC_IN_FLIGHT) return; // a save that lands mid-sync gets its own call right after this one finishes, via the normal debounce
  SYNC_IN_FLIGHT = true;
  try{
    await upsertRows('brands', DATA.brands.map(brandToSupabaseRow), 'id');
    await upsertRows('manual_content', DATA.content.map(contentToSupabaseRow), 'id');
    await upsertRows('manual_tasks', DATA.tasks.map(taskToSupabaseRow), 'id');
    await upsertRows('manual_payments', DATA.payments.map(paymentToSupabaseRow), 'id');
    await pruneDeletedRows('manual_content', new Set(DATA.content.map(c=>c.id)));
    await pruneDeletedRows('manual_tasks', new Set(DATA.tasks.map(t=>t.id)));
    await pruneDeletedRows('manual_payments', new Set(DATA.payments.map(p=>p.id)));
    // brands are deliberately never pruned here — a brand removed from the manual list may still
    // have real automated-tracking history (tracked_videos) tied to it in Supabase; deleting the
    // row would orphan or destroy that. Removing a brand locally just leaves its backend row behind, harmlessly.
  }catch(e){
    console.warn('Cloud sync failed (will retry on next save):', e);
  }
  SYNC_IN_FLIGHT = false;
}
async function loadFromSupabase(){
  const [brandsRes, contentRes, tasksRes, paymentsRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/brands?select=id,name,status,color,notes,brief`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }),
    fetch(`${SUPABASE_URL}/rest/v1/manual_content?select=*`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }),
    fetch(`${SUPABASE_URL}/rest/v1/manual_tasks?select=*`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }),
    fetch(`${SUPABASE_URL}/rest/v1/manual_payments?select=*`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }),
  ]);
  const [brandsRows, contentRows, tasksRows, paymentsRows] = await Promise.all([brandsRes.json(), contentRes.json(), tasksRes.json(), paymentsRes.json()]);
  // a brand's own id IS its Supabase id once in cloud mode — supabaseBrandId is set equal to it
  // so the "Connected accounts" section (renderBrandConnections) treats it as already linked
  DATA.brands = (brandsRows||[]).map(b => ({ id: b.id, name: b.name, status: b.status || 'active', color: b.color || SWATCHES[0], notes: b.notes || '', brief: b.brief || null, supabaseBrandId: b.id }));
  DATA.content = (contentRows||[]).map(c => ({
    id: c.id, brandId: c.brand_id, title: c.title, basePay: Number(c.base_pay)||0, cpmBonus: Number(c.cpm_bonus)||0,
    createdAt: c.created_at, viewRequirement: c.view_requirement, viewRequirementMet: !!c.view_requirement_met,
    viewRequirementWindowDays: c.view_requirement_window_days, scheduledDate: c.scheduled_date, platforms: c.platforms || [],
  }));
  DATA.tasks = (tasksRows||[]).map(t => ({
    id: t.id, title: t.title, brandId: t.brand_id, priority: t.priority, daily: !!t.daily, requiresTimer: !!t.requires_timer,
    timerMinutes: t.timer_minutes, completed: !!t.completed, dailyDone: t.daily_done || {}, createdAt: t.created_at,
  }));
  DATA.payments = (paymentsRows||[]).map(p => ({
    id: p.id, brandId: p.brand_id, amount: Number(p.amount)||0, cpmBonus: Number(p.cpm_bonus)||0, date: p.date, note: p.note || '', createdAt: p.created_at,
  }));
}
// One-time switch-over: uploads whatever's in this browser's local storage to Supabase and
// flips CLOUD_MODE on. Any brand id that predates this feature (the short uid() format, not a
// real UUID) gets a fresh UUID here, with every content/task/payment that referenced it
// remapped along the way — Supabase's brands.id column needs a real UUID. Nothing about this
// runs automatically; it only fires when the button below is clicked.
//
// Deliberately upserts directly instead of calling the normal syncToSupabase() — that function
// also prunes (deletes) any cloud content/task/payment row whose id isn't in the local set,
// which is exactly right once a device is already fully cloud-synced, but wrong here: this is
// very often run on a *second* device (or a browser that lost its local storage) whose local
// DATA is empty or partial while Supabase already holds the real data from an earlier
// migration. Pruning against an empty/partial local set would read that as "everything else
// was deleted" and wipe it from the cloud. So migration only ever adds (upsert, never delete),
// then immediately pulls the merged cloud state back down — the safe order is push-then-pull,
// never push-with-prune.
async function migrateToCloud(){
  if(CLOUD_MODE) return;
  const btn = document.getElementById('btnMigrateCloud');
  if(btn){ btn.disabled = true; btn.textContent = 'Moving to cloud…'; }
  try{
    const idMap = {};
    DATA.brands.forEach(b => {
      if(!isUuid(b.id)){
        const newId = newUuid();
        idMap[b.id] = newId;
        b.id = newId;
      }
    });
    if(Object.keys(idMap).length){
      DATA.content.forEach(c => { if(c.brandId && idMap[c.brandId]) c.brandId = idMap[c.brandId]; });
      DATA.tasks.forEach(t => { if(t.brandId && idMap[t.brandId]) t.brandId = idMap[t.brandId]; });
      DATA.payments.forEach(p => { if(p.brandId && idMap[p.brandId]) p.brandId = idMap[p.brandId]; });
    }
    DATA.brands.forEach(b => { b.supabaseBrandId = b.id; });
    await upsertRows('brands', DATA.brands.map(brandToSupabaseRow), 'id');
    await upsertRows('manual_content', DATA.content.map(contentToSupabaseRow), 'id');
    await upsertRows('manual_tasks', DATA.tasks.map(taskToSupabaseRow), 'id');
    await upsertRows('manual_payments', DATA.payments.map(paymentToSupabaseRow), 'id');
    CLOUD_MODE = true;
    localStorage.setItem(CLOUD_MODE_KEY, '1');
    await loadFromSupabase(); // pull the merged truth back down so cloud-only rows (e.g. brands added from another device) show up here too, not just what this device happened to push
    saveData();
    showToast('Moved to the cloud ☁');
    render();
  }catch(e){
    alert('Could not move to the cloud — ' + e.message + '. Your data is untouched — try again.');
    if(btn){ btn.disabled = false; btn.textContent = '☁ Move my data to the cloud'; }
  }
}

}

/* ---------------- data management: export / import / clear / demo ---------------- */
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}
function dateMonthsAgo(monthsAgo, day){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-monthsAgo, day);
  return d.toISOString().slice(0,10);
}

function exportData(){
  const payload = JSON.stringify(DATA, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rwr-ops-export-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Exported');
}

function normalizeImportedData(parsed){
  const clean = {
    brands: Array.isArray(parsed.brands) ? parsed.brands : [],
    content: Array.isArray(parsed.content) ? parsed.content : [],
    payments: Array.isArray(parsed.payments) ? parsed.payments : [],
    tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
  };
  clean.content.forEach(c => {
    c.platforms = normalizePlatforms(c.platforms);
    if(c.viewRequirement === undefined) c.viewRequirement = null;
    if(c.viewRequirementMet === undefined) c.viewRequirementMet = false;
    if(c.scheduledDate === undefined) c.scheduledDate = null;
  });
  clean.brands.forEach(b => {
    if(b.brief && b.brief.kind === undefined) b.brief.kind = 'recurring';
  });
  clean.tasks.forEach(t => {
    if(t.priority === undefined) t.priority = 'medium';
    if(t.daily === undefined) t.daily = false;
    if(t.requiresTimer === undefined) t.requiresTimer = false;
    if(t.timerMinutes === undefined) t.timerMinutes = 10;
    if(t.dailyDone === undefined) t.dailyDone = {};
    if(t.completed === undefined) t.completed = false;
  });
  return clean;
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast('That file is not valid export JSON'); console.error(err); return; }
    askConfirm('Import this file? It will replace everything currently stored here — export first if you want a backup of what you have now.', () => {
      DATA = normalizeImportedData(parsed);
      saveData();
      showToast('Imported');
      render();
    });
  };
  reader.readAsText(file);
}
