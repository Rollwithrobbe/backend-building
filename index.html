<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roll with Robbe — Ops V4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #16151c;
    --bg-raised: #1c1b23;
    --surface: #221f29;
    --surface-2: #292631;
    --border: #34313e;
    --border-soft: #2a2833;
    --text: #f0eee8;
    --text-dim: #a8a4b3;
    --text-faint: #6f6c7c;
    --accent: #c9a15a;
    --accent-dim: #8a7042;
    --accent-text: #16151c;
    --danger: #b0554f;
    --danger-bg: #2c1f1e;
    --good: #6f8f6a;
    --good-bg: #1e241d;
    --warn: #b08b3f;
    --warn-bg: #2a2418;
    --low: #5b8ab0;
    --low-bg: #1a232c;
    --purple: #9a7ec2;
    --purple-bg: #221e2c;
    --orange: #c1834f;
    --orange-bg: #2a2018;
    --teal: #5aa89e;
    --teal-bg: #182726;
    --accent-bg: #2c2618;
    --fx-green-bg: #17281e;
    --fx-green: #4fae72;
    --fx-red: #e0574c;
    --tiktok: #57626b;
    --tiktok-bg: #1e2226;
    --instagram: #9c6a4e;
    --instagram-bg: #271f1b;
    --youtube: #8a6d3a;
    --youtube-bg: #241f16;
    --facebook: #7391ac;
    --facebook-bg: #1b232b;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  #root{ display:flex; min-height:100vh; }
  ::selection{ background:var(--accent); color:var(--accent-text); }

  h1,h2,h3,h4{ font-family:'Archivo Expanded',sans-serif; margin:0; }
  /* tracking is size-specific, not tag-specific — h2 (22px page titles) is the largest
     text on screen here despite the tag name, so it gets the tightest tracking */
  h2{ letter-spacing:-0.015em; }
  h1{ letter-spacing:-0.01em; } /* 17px sidebar wordmark */
  h3,h4{ letter-spacing:0; } /* 15-16px modal/drawer headers — small enough that negative tracking just looks cramped */
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; }
  a{ color:var(--accent); }

  /* ---- layout ---- */
  .sidebar{
    width:220px; flex-shrink:0; background:rgba(28,27,35,0.72);
    backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--border-soft);
    padding:20px 14px; display:flex; flex-direction:column; gap:16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand-mark{ padding:0 6px; }
  .brand-mark .eyebrow{ font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--text-faint); margin-bottom:4px; }
  .brand-mark h1{ font-size:17px; font-weight:800; color:var(--text); }
  .brand-mark h1 span{ color:var(--accent); }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-btn{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm);
    color:var(--text-dim); font-size:13.5px; font-weight:500; cursor:pointer; border:1px solid transparent;
    background:transparent; text-align:left; width:100%; transition:transform 100ms ease-out, background 100ms ease-out;
  }
  .nav-btn:hover{ background:var(--surface); color:var(--text); }
  .nav-btn:active{ transform:scale(0.97); }
  .nav-btn.active{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .nav-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .nav-btn.active .dot{ background:var(--accent); }

  .ai-toggle-btn{ width:100%; text-align:left; }

  .sidebar-foot{ margin-top:auto; font-size:11px; color:var(--text-faint); padding:0 6px; line-height:1.6; }
  .storage-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--border-soft); padding:4px 8px; border-radius:20px; margin-top:8px;
  }
  .storage-pill .led{ width:6px; height:6px; border-radius:50%; background:var(--good); }
  .data-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .data-actions button{ flex:1 1 calc(50% - 3px); font-size:10.5px; padding:6px 4px; }
  .data-actions button.full{ flex:1 1 100%; }

  .main{ flex:1; min-width:0; padding:26px 32px 60px; max-width:1180px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-head h2{ font-size:22px; }
  .page-head .sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .head-actions{ display:flex; gap:8px; }

  /* ---- buttons ---- */
  .btn{
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
    transition:transform 100ms ease-out, border-color 150ms ease, background 150ms ease, filter 150ms ease;
  }
  .btn:hover{ border-color:var(--accent-dim); }
  .btn:active:not(:disabled){ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn-ghost:hover{ background:var(--surface); color:var(--text); }
  .btn-danger{ background:transparent; border-color:var(--border); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger-bg); border-color:var(--danger); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- cards / grid ---- */
  .grid{ display:grid; gap:14px; }
  .grid-cards{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px;
  }
  .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:8px; }
  .card .big{ font-size:24px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .card .foot{ font-size:12px; color:var(--text-dim); margin-top:6px; }

  .brand-card{ cursor:pointer; transition:transform 100ms ease-out, border-color 150ms ease; }
  .brand-card:hover{ border-color:var(--accent-dim); }
  .brand-card:active{ transform:scale(0.98); }
  .brand-card .row{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:12.5px; color:var(--text-dim); }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:7px; }

  /* ---- table ---- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); overflow:visible; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:11px 14px; border-bottom:1px solid var(--border-soft); background:var(--bg-raised); font-weight:600; }
  td{ padding:9px 14px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.row-click{ cursor:pointer; }
  tr.row-click td{ transition:background 100ms ease-out; }
  tr.row-click:hover td{ background:var(--surface-2); }
  tr.row-click:active td{ background:var(--border-soft); }

  .tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:600; white-space:nowrap; }
  .tag-tiktok{ background:var(--tiktok-bg); color:var(--tiktok); }
  .tag-instagram{ background:var(--instagram-bg); color:var(--instagram); }
  .tag-youtube{ background:var(--youtube-bg); color:var(--youtube); }
  .tag-facebook{ background:var(--facebook-bg); color:var(--facebook); }
  .tag-good{ background:var(--good-bg); color:var(--good); }
  .tag-warn{ background:var(--warn-bg); color:var(--warn); }
  .tag-danger{ background:var(--danger-bg); color:var(--danger); }
  .tag-neutral{ background:var(--surface-2); color:var(--text-dim); }
  .tag-low{ background:var(--low-bg); color:var(--low); }

  select.status-select{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:5px;
    font-size:11.5px; font-weight:600; padding:5px 8px; font-family:inherit; cursor:pointer;
    transition:border-color 150ms ease, filter 100ms ease-out;
  }
  select.status-select:active{ filter:brightness(0.94); } /* transform:scale on a native <select> can render oddly while its dropdown opens, so a brightness dip instead */

  .empty{ padding:44px 20px; text-align:center; color:var(--text-faint); font-size:13px; }
  .empty b{ display:block; color:var(--text-dim); font-size:14px; margin-bottom:4px; }

  .filter-bar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input{
    background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
    padding:7px 10px; font-family:inherit; font-size:13px;
  }
  .filter-bar input{ min-width:200px; }

  .cell-input{ background:transparent; border:1px solid transparent; border-radius:5px; padding:5px 7px; color:var(--text); font-family:inherit; font-size:13px; width:100%; }
  .cell-input:hover{ border-color:var(--border-soft); }
  .cell-input:focus{ border-color:var(--accent-dim); background:var(--bg-raised); outline:none; box-shadow:0 0 0 2px var(--accent-dim); }

  .date-trigger{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:6px 10px; font-size:12px; font-family:'IBM Plex Mono',monospace; color:var(--text); cursor:pointer;
    transition:transform 100ms ease-out, border-color 150ms ease;
  }
  .date-trigger.empty{ color:var(--text-faint); font-family:'Inter',sans-serif; }
  .date-trigger:hover{ border-color:var(--accent-dim); }
  .date-trigger:active{ transform:scale(0.97); }

  .hint{ font-size:11.5px; color:var(--text-faint); margin-top:-6px; margin-bottom:12px; line-height:1.5; }

  /* ---- modal ---- */
  .overlay{ position:fixed; inset:0; background:rgba(10,9,13,.7); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .overlay.open{ display:flex; }
  .modal{
    background:rgba(28,27,35,0.86); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--border); border-top-color:rgba(255,255,255,0.06); border-radius:var(--radius); width:100%; max-width:560px; padding:22px; margin-bottom:5vh;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  /* materialize-in: plays once, the moment the modal/overlay node is created (openModal sets
     MODAL_ENTER only for that one render() call — see the JS comment by its declaration) */
  @keyframes overlayFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalPopIn{ from{ opacity:0; transform:scale(0.92) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .overlay-enter{ animation:overlayFadeIn 180ms ease both; }
  .modal-enter{ animation:modalPopIn 240ms cubic-bezier(0.34,1.15,0.64,1) both; transform-origin:top center; }
  .modal h3{ font-size:16px; margin-bottom:16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600; }
  .field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text);
    padding:8px 10px; font-family:inherit; font-size:13px;
  }
  .field input[type=color]{ width:64px; height:38px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:space-between; margin-top:18px; }
  .modal-actions .right{ display:flex; gap:8px; }

  .platform-block{ border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; background:var(--surface); }
  .platform-block .ph{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
  .platform-block .ph label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text); margin:0; }
  .platform-block .pf{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .checkbox{ width:15px; height:15px; accent-color:var(--accent); }

  /* ---- date picker popover ---- */
  .dp-popover{
    position:fixed; z-index:200; background:rgba(28,27,35,0.88);
    backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid var(--border); border-radius:var(--radius); padding:10px; width:232px; box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .dp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dp-head button{ background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; padding:2px 8px; border-radius:5px; transition:transform 100ms ease-out; }
  .dp-head button:hover{ background:var(--surface); color:var(--text); }
  .dp-head button:active{ transform:scale(0.9); }
  .dp-title{ font-size:12.5px; font-weight:700; }
  .dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .dp-dow{ font-size:9.5px; color:var(--text-faint); text-align:center; padding:2px 0; }
  .dp-day{ font-size:12px; text-align:center; padding:6px 0; border-radius:5px; cursor:pointer; color:var(--text); background:transparent; border:none; font-family:inherit; transition:transform 100ms ease-out; }
  .dp-day:hover{ background:var(--surface-2); }
  .dp-day:active{ transform:scale(0.9); }
  .dp-day.selected{ background:var(--accent); color:var(--accent-text); font-weight:700; }
  .dp-day.today:not(.selected){ box-shadow:inset 0 0 0 1px var(--accent-dim); }
  .dp-foot{ display:flex; justify-content:space-between; margin-top:8px; border-top:1px solid var(--border-soft); padding-top:8px; }

  /* ---- AI drawer ---- */
  .ai-drawer{
    position:fixed; top:0; right:0; width:400px; max-width:92vw; height:100vh;
    background:rgba(28,27,35,0.80); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
    border-left:1px solid var(--border); z-index:80;
    display:flex; flex-direction:column; box-shadow:-10px 0 34px rgba(0,0,0,.4);
    transform:translateX(100%); will-change:transform;
  }
  .ai-drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
  .ai-drawer-head h3{ font-size:15px; }
  .ai-log{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .ai-msg{ max-width:88%; padding:9px 13px; border-radius:10px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; }
  .ai-msg.user{ align-self:flex-end; background:var(--accent); color:var(--accent-text); }
  .ai-msg.assistant{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border-soft); }
  .ai-msg.system{ align-self:center; color:var(--text-faint); font-size:12px; text-align:center; }
  .ai-input-bar{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--border-soft); flex-shrink:0; }
  .ai-input-bar input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:10px 12px; font-family:inherit; font-size:13.5px; }
  .ai-suggest{ display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 12px; flex-shrink:0; }
  .ai-suggest button{ font-size:11px; }

  .section-title{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:26px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .fx-green{ color:var(--fx-green) !important; }
  .fx-red{ color:var(--fx-red) !important; }
  .delta{ font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px; }

  .range-pills{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .range-pill{ font-size:12px; font-weight:600; padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; font-family:inherit; transition:transform 100ms ease-out, border-color 150ms ease; }
  .range-pill:hover{ border-color:var(--accent-dim); }
  .range-pill:active{ transform:scale(0.95); }
  .range-pill.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  .chart-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:22px; }
  .chart-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .chart-toggle{ display:flex; gap:4px; }
  .chart-toggle button{ font-size:11px; padding:5px 11px; }

  .brand-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .brand-bar-row:last-child{ margin-bottom:0; }
  .brand-bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .brand-bar-fill{ height:100%; border-radius:4px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:26px; align-items:start; }
  .mini-task-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); }
  .mini-task-row:last-of-type{ border-bottom:none; margin-bottom:2px; }
  .mini-task-info{ display:flex; align-items:center; gap:8px; min-width:0; }
  .mini-task-title{ font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .timer-display{ font-size:13px; font-weight:600; }

  .platform-badges{ display:flex; flex-wrap:wrap; gap:4px; }
  .pf-badge{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:5px; border:1px solid transparent; cursor:pointer; font-family:inherit; transition:transform 100ms ease-out; }
  .pf-badge:active{ transform:scale(0.92); }
  .pf-badge-off{ background:transparent; border:1px dashed var(--border); color:var(--text-faint); }
  .pf-badge-off:hover{ border-color:var(--accent-dim); color:var(--text-dim); }

  .timer-done-icon{ font-size:42px; margin-bottom:10px; }
  @keyframes timerPop{ 0%{ transform:scale(.85); opacity:0; } 60%{ transform:scale(1.04); opacity:1; } 100%{ transform:scale(1); } }
  .timer-done-modal{ animation: timerPop .25s ease-out; border-color: var(--accent) !important; }

  .chart-tooltip{
    position:fixed; z-index:250; pointer-events:none; opacity:0; transition:opacity .1s ease;
    background:rgba(28,27,35,0.90); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:12px; line-height:1.6; box-shadow:0 10px 26px rgba(0,0,0,.4); max-width:230px;
  }
  .chart-tooltip.show{ opacity:1; }
  .chart-tooltip .ct-total{ font-weight:700; color:var(--text); margin-bottom:3px; white-space:nowrap; }
  .chart-tooltip .ct-row{ display:flex; justify-content:space-between; gap:14px; color:var(--text-dim); font-size:11.5px; white-space:nowrap; }
  .chart-tooltip .ct-row .ct-amt{ font-family:'IBM Plex Mono',monospace; color:var(--text); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; z-index:100; opacity:0; transform:translateY(6px); transition:.2s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 820px){
    #root{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; flex-direction:row; align-items:center; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border-soft); z-index:40; }
    .brand-mark{ flex-shrink:0; padding:0 4px; }
    .brand-mark .eyebrow{ display:none; } /* secondary label — redundant once page content is visible, and mobile width is tight */
    .brand-mark h1{ font-size:15px; white-space:nowrap; }
    .ai-toggle-btn{ width:auto; flex-shrink:0; }
    .nav{ flex-direction:row; }
    /* was display:none — Export/Import/Demo/Clear data were completely unreachable on mobile.

<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="chart-tooltip" id="chartTooltip"></div>

<script>
/* ============================================================
   ROLL WITH ROBBE — OPS V4
   Self-contained artifact. No external network calls except the
   built-in Claude-in-artifact endpoint for the AI panel.
   Storage: window.storage (personal, private to this user).
   ============================================================ */

const STORAGE_KEY = 'rwr-ops-v4';
const AI_SETTINGS_KEY = 'rwr-ai-settings-v1'; // separate from STORAGE_KEY on purpose — never touched by Export/Import
const AI_MODELS = [
  { id:'claude-sonnet-5', label:'Claude Sonnet 5 (recommended)' },
  { id:'claude-opus-4-8', label:'Claude Opus 4.8 (more capable, slower/pricier)' },
  { id:'claude-haiku-4-5-20251001', label:'Claude Haiku 4.5 (fastest, cheapest)' },
];
// works two ways: window.storage when running inside a Claude conversation (personal, private,
// synced by Claude), or plain localStorage when running standalone (e.g. deployed on Vercel) —
// same calling code either way, so nothing else in the app needs to know which one it's using
const HAS_ARTIFACT_STORAGE = typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
async function storageGet(key, shared){
  if(HAS_ARTIFACT_STORAGE){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? { key, value: raw, shared: !!shared } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(HAS_ARTIFACT_STORAGE){
    return await window.storage.set(key, value, shared);
  }
  localStorage.setItem(key, value);
  return { key, value, shared: !!shared };
}

/* ---------------- optional local auto-backup file (Chrome/Edge only, via File System Access API) ----------------
   Lets the person pick one file on their own machine; every successful save also mirrors DATA to
   that file in the background. Purely local — nothing here ever leaves the browser except the
   normal write to the chosen file. The handle itself can't go in localStorage (not serializable),
   so it's kept in IndexedDB instead, and permission is re-checked (never silently re-prompted)
   each time the page loads.
------------------------------------------------------------------------------------------------- */
const HAS_FS_ACCESS = typeof window !== 'undefined' && 'showSaveFilePicker' in window;
let BACKUP_HANDLE = null;
let BACKUP_FILENAME = '';
let BACKUP_PERMISSION_OK = false;
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rwr-fs-access', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function restoreAutoBackupHandle(){
  if(!HAS_FS_ACCESS) return;
  try{
    const handle = await idbGet('backupHandle');
    if(handle){
      BACKUP_HANDLE = handle;
      BACKUP_FILENAME = handle.name;
      BACKUP_PERMISSION_OK = (await handle.queryPermission({mode:'readwrite'})) === 'granted';
    }
  }catch(e){ /* stored handle no longer valid (e.g. the file was moved or deleted) */ }
}
async function enableAutoBackup(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'rwr-ops-backup.json',
      types: [{ description: 'JSON backup', accept: {'application/json': ['.json']} }]
    });
    BACKUP_HANDLE = handle;
    BACKUP_FILENAME = handle.name;
    BACKUP_PERMISSION_OK = true;
    await idbSet('backupHandle', handle);
    await writeBackupFile();
    showToast('Auto-backup enabled — saving to ' + handle.name);
    render();
  }catch(e){
    if(e.name !== 'AbortError') console.error('Enable auto-backup failed', e);
  }
}
async function reconnectAutoBackup(){
  if(!BACKUP_HANDLE) return;
  try{
    const perm = await BACKUP_HANDLE.requestPermission({mode:'readwrite'});
    BACKUP_PERMISSION_OK = perm === 'granted';
    if(BACKUP_PERMISSION_OK){ await writeBackupFile(); showToast('Auto-backup reconnected'); }
    else showToast('Permission not granted');
    render();
  }catch(e){ console.error('Reconnect auto-backup failed', e); }
}
async function disableAutoBackup(){
  BACKUP_HANDLE = null;
  BACKUP_FILENAME = '';
  BACKUP_PERMISSION_OK = false;
  await idbDelete('backupHandle');
  showToast('Auto-backup turned off — the file itself is untouched');
  render();
}
async function writeBackupFile(){
  if(!BACKUP_HANDLE) return;
  try{
    // never re-prompt mid-save if permission was revoked — just skip silently and let the
    // sidebar's "Reconnect" state (checked on load) surface it instead
    const perm = await BACKUP_HANDLE.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const writable = await BACKUP_HANDLE.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
  }catch(e){ console.error('Auto-backup write failed', e); }
}
const PLATFORMS = [
  { id:'tiktok', label:'TikTok', short:'TT', tagClass:'tag-tiktok' },
  { id:'instagram', label:'Instagram Reels', short:'IG', tagClass:'tag-instagram' },
  { id:'youtube', label:'YouTube Shorts', short:'YT', tagClass:'tag-youtube' },
  { id:'facebook', label:'Facebook', short:'FB', tagClass:'tag-facebook' },
];
const STATUSES = ['idea','scripting','filming','editing','ready','submitted','revision','approved','scheduled','published'];
const STATUS_LABEL = { idea:'Idea', scripting:'Scripting', filming:'Filming', editing:'Editing', ready:'Ready to submit', submitted:'Waiting on brand', revision:'Revision requested', approved:'Approved', scheduled:'Scheduled', published:'Published' };
const SWATCHES = ['#c9a15a','#8a9a7a','#9c6a4e','#7a8a9c','#a3865a','#6f8f6a'];
const DOW = ['S','M','T','W','T','F','S'];
const RANGES = [
  {id:'week', label:'Week'},

  {id:'3m', label:'3 months'},

  {id:'12m', label:'12 months'},

const PRIORITIES = [

const PRIORITY_ORDER = { high:0, medium:1, low:2 };
function priorityInlineStyle(priorityId){

}
// content pipeline status colors: a warming gray->blue->purple->orange->teal progression for
// "getting it made", amber/red for "someone else's move" (waiting vs. sent back), and
// green->gold->bright-green for the three good outcomes, escalating toward "actually paid"
function statusInlineStyle(status){
  const map = {
    idea: ['var(--surface-2)','var(--text-dim)'],
    scripting: ['var(--low-bg)','var(--low)'],
    filming: ['var(--purple-bg)','var(--purple)'],
    editing: ['var(--orange-bg)','var(--orange)'],
    ready: ['var(--teal-bg)','var(--teal)'],
    submitted: ['var(--warn-bg)','var(--warn)'],
    revision: ['var(--danger-bg)','var(--danger)'],
    approved: ['var(--good-bg)','var(--good)'],
    scheduled: ['var(--accent-bg)','var(--accent)'],
    published: ['var(--fx-green-bg)','var(--fx-green)'],
  };
  const [bg, fg] = map[status] || ['var(--surface-2)','var(--text-dim)'];
  return `background:${bg}; color:${fg}; border-color:${fg}; font-weight:600;`;
}
const TASK_TIMER_SECONDS = 600; // 10 minutes

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function todayISO(){
  // use LOCAL date components, not toISOString() (which is UTC) — otherwise anyone ahead of UTC
  // (e.g. Bali, UTC+8) sees "today" flip over hours late, and daily tasks stay stuck on "done"
  // from the previous day even after midnight has already passed locally
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(d){ if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function money(n){ n = Number(n)||0; return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function escapeHtml(s){ return (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- state ---------------- */
let DATA = { brands: [], content: [], payments: [], tasks: [] };
let SAVE_TIMER = null;
let VIEW = 'dashboard';
let AI_LOG = [];
let AI_SETTINGS = { apiKey:'', model:'claude-sonnet-5' };
let AI_SETTINGS_OPEN = false;
let AI_BUSY = false;
let AI_OPEN = false;
let ACTIVE_BRAND_FILTER = null;
let PUB_FILTER = { brandId:'', platform:'', q:'', datePreset:'all', customStart:'', customEnd:'', viewReq:'all' };
let CONTENT_FILTER = { datePreset:'all', customStart:'', customEnd:'', status:'', dateField:'created' };
let PAYMENTS_FILTER = { brandId:'' };
let DP = null; // { key, month: Date }
let DASH_RANGE = 'month';
let TASK_TIMERS = {}; // taskId -> { remaining, intervalId }
let TIMER_DONE_POPUP = null; // { taskTitle }
let TIMER_ENTER = false;

function normalizePlatforms(existing){
  return PLATFORMS.map(p => {
    const found = (existing||[]).find(x => x.id === p.id);
    return found
      ? { id:p.id, active: !!found.active, status: found.status || 'idea', postDate: found.postDate || '', url: found.url || '', views: found.views ?? '' }
      : { id:p.id, active:false, status:'idea', postDate:'', url:'', views:'' };
  });
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY, false);
    if(res && res.value){ DATA = JSON.parse(res.value); }
  }catch(e){ /* first run — no key yet */ }
  if(!DATA.brands) DATA.brands = [];
  if(!DATA.content) DATA.content = [];
  if(!DATA.payments) DATA.payments = [];
  if(!DATA.tasks) DATA.tasks = [];
  // migrate any content saved by an earlier build that dropped inactive platform slots
  DATA.content.forEach(c => {
    c.platforms = normalizePlatforms(c.platforms);
    if(c.viewRequirement === undefined) c.viewRequirement = null;
    if(c.viewRequirementMet === undefined) c.viewRequirementMet = false;
    if(c.scheduledDate === undefined) c.scheduledDate = null;
    // repair content stranded with zero active platforms (a past AI-assistant bug could create these) —
    // a video with no active platforms can never earn or show up anywhere, so activate all 3 rather than
    // leaving it silently dead.
    if(!c.platforms.some(p=>p.active)){
      c.platforms.forEach(p => { p.active = true; });
    }
    // repair content marked published with no post date (another past AI-assistant bug) — it counts
    // correctly toward lifetime totals but is invisible to every time-scoped view (week/month/chart)
    // without a date to bucket it by.
    c.platforms.forEach(p => {
      if(p.active && p.status==='published' && !p.postDate) p.postDate = (c.createdAt ? c.createdAt.slice(0,10) : todayISO());
    });
  });
  DATA.brands.forEach(b => {
    if(b.brief && b.brief.kind === undefined) b.brief.kind = 'recurring'; // existing briefs predate the trial/recurring split
  });
  DATA.tasks.forEach(t => {
    if(t.priority === undefined) t.priority = 'medium';
    if(t.daily === undefined) t.daily = false;
    if(t.requiresTimer === undefined) t.requiresTimer = false;
    if(t.timerMinutes === undefined) t.timerMinutes = 10;
    if(t.dailyDone === undefined) t.dailyDone = {};
    if(t.completed === undefined) t.completed = false;
  });
  DATA.payments.forEach(p => {
    // older payments logged before createdAt existed — backfill from their date-received field so
    // same-date payments still sort in a sane order instead of an undefined one
    if(!p.createdAt) p.createdAt = p.date ? p.date+'T00:00:00.000Z' : new Date(0).toISOString();
  });
  saveData();
  await loadAISettings();
  await restoreAutoBackupHandle();
  render();
}
async function loadAISettings(){
  try{
    const res = await storageGet(AI_SETTINGS_KEY, false);
    if(res && res.value){ AI_SETTINGS = { ...AI_SETTINGS, ...JSON.parse(res.value) }; }
  }catch(e){ /* no key saved yet */ }
}
async function saveAISettings(){
  try{ await storageSet(AI_SETTINGS_KEY, JSON.stringify(AI_SETTINGS), false); }
  catch(e){ console.error('Failed to save AI settings', e); }
}

let SAVE_RETRY_TIMER = null;
let SAVE_STATE = 'idle'; // 'idle' | 'saving' | 'error'
let SAVE_PENDING_AFTER_INFLIGHT = false; // an edit arrived while a save was already in flight

function saveData(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => triggerSave(0), 600);
}

function triggerSave(retryCount){
  if(SAVE_STATE === 'saving'){
    // don't fire a second write on top of one still in flight — the in-flight
    // save will pick up this latest state itself, so just flag it
    SAVE_PENDING_AFTER_INFLIGHT = true;
    return;
  }
  attemptSave(retryCount);
}

async function attemptSave(retryCount){
  clearTimeout(SAVE_RETRY_TIMER);
  SAVE_STATE = 'saving';
  try{
    const result = await storageSet(STORAGE_KEY, JSON.stringify(DATA), false);
    if(!result) throw new Error('Storage set returned no result');
    SAVE_STATE = 'idle';
    updateStoragePill();
    showToast('Saved');
    writeBackupFile(); // mirror to the local backup file too, if one's connected — fire-and-forget
  }catch(e){
    // expected + handled — retried automatically, so this isn't a real error, just noisy if logged as one
    console.warn('Save attempt failed, retrying:', e);
    SAVE_STATE = 'error';
    updateStoragePill();
    if(retryCount === 0) showToast('Save hiccup — retrying…');
    const backoff = [800, 2000, 5000][Math.min(retryCount, 2)];
    SAVE_RETRY_TIMER = setTimeout(() => attemptSave(retryCount + 1), backoff);
    if(retryCount >= 3) showToast('Still trying to save — your changes are kept, just not synced yet');
    return;
  }
  SAVE_STATE = 'idle';
  if(SAVE_PENDING_AFTER_INFLIGHT){
    SAVE_PENDING_AFTER_INFLIGHT = false;
    attemptSave(0); // a newer edit arrived mid-save — persist the latest state now
  }
}

function updateStoragePill(){
  const pill = document.querySelector('.storage-pill');
  if(!pill) return;
  if(SAVE_STATE === 'error'){
    pill.innerHTML = '<span class="led" style="background:var(--fx-red);"></span>Save issue — retrying…';
  } else {
    pill.innerHTML = '<span class="led"></span>Stored in Claude';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ---------------- data management: export / import / clear / demo ---------------- */
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}
function dateMonthsAgo(monthsAgo, day){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-monthsAgo, day);
  return d.toISOString().slice(0,10);
}

function exportData(){
  const payload = JSON.stringify(DATA, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rwr-ops-export-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Exported');
}

function normalizeImportedData(parsed){
  const clean = {
    brands: Array.isArray(parsed.brands) ? parsed.brands : [],
    content: Array.isArray(parsed.content) ? parsed.content : [],
    payments: Array.isArray(parsed.payments) ? parsed.payments : [],
    tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
  };
  clean.content.forEach(c => {
    c.platforms = normalizePlatforms(c.platforms);
    if(c.viewRequirement === undefined) c.viewRequirement = null;
    if(c.viewRequirementMet === undefined) c.viewRequirementMet = false;
    if(c.scheduledDate === undefined) c.scheduledDate = null;
  });
  clean.brands.forEach(b => {
    if(b.brief && b.brief.kind === undefined) b.brief.kind = 'recurring';
  });
  clean.tasks.forEach(t => {
    if(t.priority === undefined) t.priority = 'medium';
    if(t.daily === undefined) t.daily = false;
    if(t.requiresTimer === undefined) t.requiresTimer = false;
    if(t.timerMinutes === undefined) t.timerMinutes = 10;
    if(t.dailyDone === undefined) t.dailyDone = {};
    if(t.completed === undefined) t.completed = false;
  });
  return clean;
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast('That file is not valid export JSON'); console.error(err); return; }
    askConfirm('Import this file? It will replace everything currently stored here — export first if you want a backup of what you have now.', () => {
      DATA = normalizeImportedData(parsed);
      saveData();
      showToast('Imported');
      render();
    });
  };
  reader.readAsText(file);
}

    DATA = { brands: [], content: [], payments: [], tasks: [] };

}

    { id:uid('tk_'), title:'Reply to Amboras brief email', brandId:brands[2].id, priority:'high', daily:false, requiresTimer:false, completed:false, dailyDone:{}, createdAt: todayISO() }

/* ---------------- earnings ----------------
   Base pay + CPM bonus are manual figures. They only count toward
   "earned" once a platform copy is marked Published — and, if a view
   requirement is set on the deliverable, only once you've manually
   confirmed you checked the view count and it's been hit.
------------------------------------------------------------------ */
function isEarning(c){
  const anyPublished = (c.platforms||[]).some(p => p.active && p.status === 'published');
  if(!anyPublished) return false;
  if(c.viewRequirement){ return !!c.viewRequirementMet; }
  return true;
}
function isViewRequirementExpired(c){
  // a view requirement with a window that's passed, still unmet — it's not realistically ever
  // going to qualify (most views happen soon after posting), so it should stop being "pending"
  if(!c.viewRequirement || c.viewRequirementMet || !c.viewRequirementWindowDays) return false;
  const dated = (c.platforms||[]).filter(p=>p.active && p.status==='published' && p.postDate).map(p=>p.postDate).sort();
  if(dated.length===0) return false;
  const deadline = new Date(dated[0]+'T00:00:00');
  deadline.setDate(deadline.getDate() + Number(c.viewRequirementWindowDays));
  return new Date() > deadline;
}
function contentEarnings(c){
  const base = Number(c.basePay)||0;
  const bonus = Number(c.cpmBonus)||0;
  const earning = isEarning(c);
  const expired = isViewRequirementExpired(c);
  return { base, bonus, total: earning ? base+bonus : 0, pendingTotal: (earning || expired) ? 0 : base+bonus, earning, expired };
}
function cpmBonusInRange(start, end, brandId){
  return DATA.payments.filter(p => {
    if(brandId && p.brandId !== brandId) return false;
    if(!p.cpmBonus) return false;
    if(!p.date) return false;
    const d = new Date(p.date+'T12:00:00');
    if(start && d < start) return false;
    if(end && d > end) return false;
    return true;
  }).reduce((s,p) => s + (Number(p.cpmBonus)||0), 0);
}
function brandTotals(brandId){
  const items = DATA.content.filter(c => c.brandId === brandId);
  let contentEarned = 0, pending = 0;
  items.forEach(c => { const e = contentEarnings(c); contentEarned += e.total; if(!e.earning) pending += e.pendingTotal; });
  const brandPayments = DATA.payments.filter(p => p.brandId === brandId);
  const received = brandPayments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const receivedCpm = brandPayments.reduce((s,p)=>s+(Number(p.cpmBonus)||0),0);
  const receivedBase = received - receivedCpm;
  // a CPM bonus is realized the moment it's paid — you don't know the amount until the brand tells
  // you, so unlike base pay it never sits "pending" against a video; it counts straight to Earned
  const totalEarned = contentEarned + receivedCpm;
  return { count: items.length, contentEarned, totalEarned, pending, received, receivedBase, receivedCpm, outstanding: totalEarned - received };
}
function allTotals(){
  let totalEarned=0, received=0, pending=0;
  DATA.brands.forEach(b => { const t = brandTotals(b.id); totalEarned += t.totalEarned; received += t.received; pending += t.pending; });
  return { totalEarned, received, pending, outstanding: totalEarned - received, contentCount: DATA.content.length, brandCount: DATA.brands.length };
}
function brandById(id){ return DATA.brands.find(b=>b.id===id); }

/* ---------------- recurring briefs ----------------
   A brief lives on a brand: a cadence (per day/week/month), a rate,
   and default platforms. Today's quota is computed live — never
   stored — by converting the cadence to a weekly equivalent and
   spreading it evenly across the 7 days of the week (so 5/week
   lands on 5 non-clustered days rather than 5-on-2-off, and
   fractional cadences like 20/week distribute as evenly as possible
   rather than drifting).
------------------------------------------------------------------ */
function briefWeeklyEquivalent(brief){
  if(brief.cadenceType==='perDay') return (Number(brief.cadenceCount)||0) * 7;
  if(brief.cadenceType==='perWeek') return Number(brief.cadenceCount)||0;
  return (Number(brief.cadenceCount)||0) * 7/30; // perMonth, approximated
}
function briefDayQuota(brief, dow){
  const weekly = briefWeeklyEquivalent(brief);
  const cum = i => Math.round((i+1) * weekly / 7);
  return cum(dow) - cum(dow-1);
}
function activeBriefBrands(){
  return DATA.brands.filter(b => b.brief && b.brief.status==='active');
}
function briefTodayInfo(brand){
  const brief = brand.brief;
  const quota = briefDayQuota(brief, new Date().getDay());
  const progress = (brief.progress && brief.progress[todayISO()]) || 0;
  return { quota, progress, remaining: Math.max(0, quota - progress) };
}
function briefTrialInfo(brief){
  // trial briefs run for a fixed window (e.g. a 30-day trial) rather than indefinitely — this
  // just computes where they stand; it never auto-changes status, that stays a manual decision
  if(!brief || brief.kind !== 'trial' || !brief.trialStartDate || !brief.trialDurationDays) return null;
  const start = new Date(brief.trialStartDate+'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + Number(brief.trialDurationDays));
  const today = new Date(todayISO()+'T00:00:00');
  const daysRemaining = Math.ceil((end - today) / (1000*60*60*24));
  return { endDate: end.toISOString().slice(0,10), daysRemaining, expired: daysRemaining < 0 };
}
function briefVideoTitle(brandName, dateStr, count){
  // e.g. "Amboras-20-August" for the day's first, "Amboras-20-August-02" for the second, etc.
  const d = new Date(dateStr+'T00:00:00');
  const base = `${brandName}-${d.getDate()}-${d.toLocaleDateString('en-US',{month:'long'})}`;
  return count > 1 ? `${base}-${String(count).padStart(2,'0')}` : base;
}
function makeBriefVideo(brandId){
  const brand = DATA.brands.find(b=>b.id===brandId);
  if(!brand || !brand.brief || brand.brief.status!=='active') return;
  const brief = brand.brief;
  const info = briefTodayInfo(brand);
  if(info.remaining <= 0) return;
  const dateStr = todayISO();
  const countToday = (brief.progress[dateStr]||0) + 1;
  const platforms = normalizePlatforms([]).map(p => (brief.platforms||[]).includes(p.id) ? { ...p, active:true, status:'idea', postDate:'' } : p);
  DATA.content.push({
    id:uid('ct_'), brandId:brand.id, title: briefVideoTitle(brand.name, dateStr, countToday),
    basePay:Number(brief.basePay)||0, cpmBonus:Number(brief.cpmBonus)||0, createdAt: new Date().toISOString(),
    viewRequirement: brief.viewRequirement || null, viewRequirementMet:false,
    viewRequirementWindowDays: brief.viewRequirementWindowDays || null, platforms
  });
  brief.progress = brief.progress || {};
  brief.progress[dateStr] = countToday;
  saveData();
  showToast(`Added video ${countToday}/${info.quota} for ${brand.name} today`);
  render();
}
function undoBriefVideo(brandId){
  // manual counter correction — e.g. after deleting a video from Content that was created via +1
  // Made. This never touches the content list itself, only today's progress count, since matching
  // a deleted item back to "was it actually counted today" reliably isn't worth the fragility.
  const brand = DATA.brands.find(b=>b.id===brandId);
  if(!brand || !brand.brief) return;
  const brief = brand.brief;
  brief.progress = brief.progress || {};
  const dateStr = todayISO();
  const current = brief.progress[dateStr] || 0;
  if(current <= 0) return;
  brief.progress[dateStr] = current - 1;
  saveData();
  showToast(`Corrected ${brand.name}'s count to ${current - 1} today`);
  render();
}
function applyBriefDefaultsToDraft(draft, brandId){
  // fills a NEW content draft from the brand's brief (rate, CPM, view requirement + window, platforms) —
  // still fully editable afterward, this just saves re-typing the same numbers every time
  const brand = brandById(brandId);
  if(!brand || !brand.brief) return;
  const brief = brand.brief;
  draft.basePay = Number(brief.basePay)||0;
  draft.cpmBonus = Number(brief.cpmBonus)||0;
  draft.viewRequirement = brief.viewRequirement || null;
  draft.viewRequirementWindowDays = brief.viewRequirementWindowDays || null;
  const activeIds = brief.platforms || [];
  draft.platforms = normalizePlatforms(draft.platforms).map(p => activeIds.includes(p.id) ? { ...p, active:true } : { ...p, active:false });
}
function bumpBriefProgressForContentCreation(brandId){
  // a real single video just got logged for this brand (manual add, or the AI adding one) — count it
  // toward today's brief quota even though it didn't come through the "+1 Made" button specifically.
  // bulk/scheduling batches deliberately don't call this — they're planning ahead, not "made today".
  const brand = brandById(brandId);
  if(!brand || !brand.brief || brand.brief.status !== 'active') return;
  const d = todayISO();
  brand.brief.progress = brand.brief.progress || {};
  brand.brief.progress[d] = (brand.brief.progress[d]||0) + 1;
}
function renderBriefQuotas(){
  const briefs = activeBriefBrands();
  if(briefs.length===0) return '';
  return `<div class="table-wrap" style="margin-bottom:22px;">
    <div style="padding:13px 16px; border-bottom:1px solid var(--border-soft); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);">Today's video quota</div>
    ${briefs.map(b => {
      const info = briefTodayInfo(b);

      const trialBadge = trial

        : '';
      return `<div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border-soft);">
        <div style="display:flex; align-items:center; gap:10px;">

          <button class="btn btn-ghost btn-sm" data-undo-brief="${b.id}" type="button" title="Correct today's count down by 1 (e.g. after deleting a video)" ${info.progress<=0?'disabled':''}>−1</button>
          <button class="btn btn-sm ${done?'btn-primary':'btn-ghost'}" data-make-brief="${b.id}" type="button" ${done?'disabled':''}>${done?'Done ✓':'+1 Made'}</button>
        </div>

    }).join('')}
  </div>`;
}

/* ---------------- automatic paid allocation (waterfall: oldest earned content gets settled first) ---------------- */
let PAID_ALLOCATION_CACHE = {};
function brandPaymentCoverage(brandId){
  if(PAID_ALLOCATION_CACHE[brandId]) return PAID_ALLOCATION_CACHE[brandId];
  const items = DATA.content
    .filter(c => c.brandId === brandId && isEarning(c))
    .map(c => ({ c, amt: contentEarnings(c).total, sortKey: (earnedDate(c) || '') + '|' + (c.createdAt || '') }))
    .sort((a,b) => a.sortKey.localeCompare(b.sortKey));
  const totalReceived = DATA.payments.filter(p => p.brandId === brandId).reduce((s,p)=>s+(Number(p.amount)||0), 0);
  let cumulative = 0;
  const map = {};
  items.forEach(({c, amt}) => {
    cumulative += amt;
    map[c.id] = cumulative <= totalReceived + 0.005;
  });
  PAID_ALLOCATION_CACHE[brandId] = map;
  return map;
}
function isContentPaid(c){
  if(!isEarning(c)) return false;
  return !!brandPaymentCoverage(c.brandId)[c.id];
}

/* ---------------- time-series helpers (for dashboard chart + range deltas) ---------------- */
function earnedDate(c){
  const dates = (c.platforms||[]).filter(p => p.active && p.status==='published' && p.postDate).map(p=>p.postDate);
  if(!dates.length) return null;
  return dates.sort().slice(-1)[0];
}
function buildBuckets(range){
  const now = new Date();
  let bucketType, count;
  if(range==='week'){ bucketType='day'; count=7; }
  else if(range==='month'){ bucketType='day'; count = now.getDate(); } // calendar month to date, like Week is calendar-week to date
  else if(range==='3m'){ bucketType='month'; count=3; }
  else if(range==='6m'){ bucketType='month'; count=6; }
  else if(range==='12m'){ bucketType='month'; count=12; }
  else {
    bucketType='month';
    const earned = DATA.content.map(earnedDate).filter(Boolean).sort();
    count = 12;
    if(earned.length){
      const first = new Date(earned[0]+'T00:00:00');
      count = Math.max(1, Math.min(36, (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth()) + 1));
    }
  }
  const buckets = [];
  if(bucketType==='day'){
    for(let i=count-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
      buckets.push({ start:d, end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59), label: d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) });
    }
  } else if(bucketType==='week'){
    for(let i=count-1;i>=0;i--){
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i*7);
      const start = new Date(end.getFullYear(), end.getMonth(), end.getDate()-6);
      buckets.push({ start, end:new Date(end.getFullYear(),end.getMonth(),end.getDate(),23,59,59), label: start.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) });
    }
  } else {
    for(let i=count-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      buckets.push({ start:d, end:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59), label: d.toLocaleDateString('en-US',{month:'short'}) });
    }
  }
  return buckets;
}
function rangeBounds(range){
  const buckets = buildBuckets(range);
  return { start: buckets[0].start, end: buckets[buckets.length-1].end };
}
function previousRangeBounds(range){
  const { start, end } = rangeBounds(range);
  const span = end.getTime() - start.getTime();
  const prevEnd = new Date(start.getTime() - 1);
  const prevStart = new Date(prevEnd.getTime() - span);
  return { start: prevStart, end: prevEnd };
}
function sumEarnedBetween(start, end){
  let sum = 0;
  DATA.content.forEach(c => {
    if(!isEarning(c)) return;
    const ed = earnedDate(c); if(!ed) return;
    const d = new Date(ed+'T00:00:00');
    if(d>=start && d<=end) sum += contentEarnings(c).total;
  });
  sum += cpmBonusInRange(start, end); // CPM bonuses count as earned the moment they're paid
  return sum;
}
function sumReceivedBetween(start, end){
  return DATA.payments.filter(p => {
    if(!p.date) return false;
    const d = new Date(p.date+'T00:00:00');
    return d>=start && d<=end;
  }).reduce((s,p)=>s+(Number(p.amount)||0), 0);
}
function buildSeries(range){
  return buildBuckets(range).map(b => {
    let total = 0;
    const byBrand = {};
    DATA.content.forEach(c => {
      if(!isEarning(c)) return;
      const ed = earnedDate(c); if(!ed) return;
      const d = new Date(ed+'T00:00:00');
      if(d<b.start || d>b.end) return;
      const amt = contentEarnings(c).total;
      total += amt;
      const brand = brandById(c.brandId);
      const key = brand ? brand.name : 'Unassigned';
      byBrand[key] = (byBrand[key]||0) + amt;
    });
    // CPM bonuses count as earned the moment they're paid, attributed to whichever brand paid them
    DATA.brands.forEach(brand => {
      const cpm = cpmBonusInRange(b.start, b.end, brand.id);
      if(cpm){
        total += cpm;
        byBrand[brand.name] = (byBrand[brand.name]||0) + cpm;
      }
    });
    const breakdown = Object.entries(byBrand).sort((a,b)=>b[1]-a[1]).map(([name,sum])=>({name,sum}));
    return { label: b.label, value: total, breakdown };
  });
}
function chartLabelStep(n){ return n<=12 ? 1 : Math.ceil(n/8); }
function compactMoney(n){
  n = Number(n)||0;
  if(Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(n%1000===0 ? 0 : 1) + 'k';
  return money(n);
}
let LAST_CHART_SERIES = [];
function showChartTooltip(index, clientX, clientY){
  const s = LAST_CHART_SERIES[index];
  if(!s) return;
  const tip = document.getElementById('chartTooltip');
  if(!tip) return;
  let html = `<div class="ct-total">${escapeHtml(s.label)}: ${money(s.value)}</div>`;
  if(s.breakdown && s.breakdown.length){
    html += s.breakdown.map(b => `<div class="ct-row"><span>${escapeHtml(b.name)}</span><span class="ct-amt">${money(b.sum)}</span></div>`).join('');
  }
  tip.innerHTML = html;
  tip.classList.add('show');
  positionChartTooltip(clientX, clientY);
}
function positionChartTooltip(clientX, clientY){
  const tip = document.getElementById('chartTooltip');
  if(!tip || !tip.classList.contains('show')) return;
  const offset = 14;
  const rect = tip.getBoundingClientRect();
  let left = clientX + offset;
  let top = clientY + offset;
  if(left + rect.width > window.innerWidth - 8) left = clientX - rect.width - offset;
  if(top + rect.height > window.innerHeight - 8) top = clientY - rect.height - offset;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideChartTooltip(){
  const tip = document.getElementById('chartTooltip');
  if(tip) tip.classList.remove('show');
}
function renderDelta(pct){
  if(pct===null || pct===undefined) return '';
  const up = pct >= 0;
  const cls = up ? 'fx-green' : 'fx-red';
  const arrow = up ? '↑' : '↓';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs last period</span>`;
}
function smoothPath(pts){
  if(pts.length===0) return '';
  if(pts.length===1) return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const cp1x = p1.x + (p2.x-p0.x)/6;
    const cp1y = p1.y + (p2.y-p0.y)/6;
    const cp2x = p2.x - (p3.x-p1.x)/6;
    const cp2y = p2.y - (p3.y-p1.y)/6;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function renderLineChartSvg(series){
  LAST_CHART_SERIES = series;
  const W=760,H=190,pad=10,topPad=16;
  const max = Math.max(...series.map(s=>s.value), 1);
  const n = series.length;
  const stepX = n>1 ? (W-2*pad)/(n-1) : 0;
  const pts = series.map((s,i) => ({ x: pad+i*stepX, y: topPad+(H-pad-topPad)*(1-s.value/max) }));
  const linePath = smoothPath(pts);
  const areaPath = n>1 ? `${linePath} L${pts[n-1].x.toFixed(1)},${(H-pad).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-pad).toFixed(1)} Z` : '';
  const labelStep = chartLabelStep(n);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block; overflow:visible;">
      <defs>
        <linearGradient id="chartFillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--fx-green)" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="var(--fx-green)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${areaPath ? `<path d="${areaPath}" fill="url(#chartFillGrad)" stroke="none"/>` : ''}
      <path d="${linePath}" fill="none" stroke="var(--fx-green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i) => {
        const isLast = i===n-1;
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="transparent" style="cursor:pointer; pointer-events:all;" data-chart-point="${i}"></circle><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?3.6:2.2}" fill="var(--fx-green)" style="pointer-events:none;" opacity="${isLast?1:0.7}"/>`;
      }).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; margin-top:6px;">
      ${series.map((s,i)=> `<span style="font-size:10px;color:var(--text-faint);">${i%labelStep===0 ? escapeHtml(s.label) : ''}</span>`).join('')}
    </div>`;
}
function renderChart(series){
  if(!series.some(s=>s.value>0)) return `<div class="empty" style="padding:34px 10px;">No published, counted earnings in this period yet.</div>`;
  return renderLineChartSvg(series);
}
function renderBrandBreakdown(bounds){
  if(DATA.brands.length===0) return emptyState('No brands yet','Add a brand to see the breakdown.');
  const rows = DATA.brands.map(b => {
    let sum = 0;

      if(d>=bounds.start && d<=bounds.end) sum += contentEarnings(c).total;

    return { brand:b, sum };
  }).filter(r=>r.sum>0).sort((a,b)=>b.sum-a.sum);
  if(rows.length===0) return `<div class="table-wrap"><div class="empty" style="padding:24px 10px;">Nothing earned in this period yet.</div></div>`;
  const max = Math.max(...rows.map(r=>r.sum), 1);

      <div class="brand-bar-track"><div class="brand-bar-fill" style="width:${(r.sum/max*100).toFixed(0)}%; background:${r.brand.color};"></div></div>

    </div>`).join('')}</div>`;

  }
}

  return `<button class="btn btn-sm btn-ghost" data-toggle-req="${c.id}" ${attrs}>Need ${Number(c.viewRequirement).toLocaleString()}</button>`;
}
function isContentPublished(c){
  return (c.platforms||[]).some(p => p.active && p.status==='published');

    if(isContentPublished(c)) return false; // published content lives only in the Published tab now

    if(CONTENT_FILTER.status){
      const active = (c.platforms||[]).filter(p=>p.active);
      if(!active.some(p=>p.status===CONTENT_FILTER.status)) return false;
    }
    if(range && (range.start || range.end)){
      const raw = dateField==='scheduled' ? c.scheduledDate : c.createdAt;

      const d = dateField==='scheduled' ? new Date(raw+'T12:00:00') : new Date(raw);

      if(range.end && d > range.end) return false;
    }
    return true;
  });
  // scheduled items float to the top, soonest-due first (so 21st always sits above 28th); anything
  // without a scheduled date falls below that, most-recently-created first
  const sorted = [...filtered].sort((a,b) => {

/* ---------------- published ---------------- */
function presetDateRange(preset, customStart, customEnd){
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59);
  if(preset==='today') return { start:startOfDay(now), end:endOfDay(now) };
  if(preset==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return { start:startOfDay(y), end:endOfDay(y) }; }
  if(preset==='thisWeek'){ const start=new Date(now); start.setDate(now.getDate()-now.getDay()); return { start:startOfDay(start), end:endOfDay(now) }; }
  if(preset==='lastWeek'){ const thisStart=new Date(now); thisStart.setDate(now.getDate()-now.getDay()); const start=new Date(thisStart); start.setDate(start.getDate()-7); const end=new Date(thisStart); end.setDate(end.getDate()-1); return { start:startOfDay(start), end:endOfDay(end) }; }
  if(preset==='thisMonth'){ const start=new Date(now.getFullYear(), now.getMonth(), 1); return { start:startOfDay(start), end:endOfDay(now) }; }
  if(preset==='custom'){
    return {
      start: customStart ? new Date(customStart+'T00:00:00') : null,
      end: customEnd ? new Date(customEnd+'T23:59:59') : null
    };
  }
  return null; // 'all'
}
function publishedRows(){
  const range = presetDateRange(PUB_FILTER.datePreset, PUB_FILTER.customStart, PUB_FILTER.customEnd);
  return DATA.content.filter(c => {
    const publishedPlatforms = (c.platforms||[]).filter(p => p.active && p.status==='published');
    if(publishedPlatforms.length===0) return false;
    if(PUB_FILTER.brandId && c.brandId !== PUB_FILTER.brandId) return false;
    if(PUB_FILTER.platform && !publishedPlatforms.some(p=>p.id===PUB_FILTER.platform)) return false;
    if(PUB_FILTER.q && !(c.title||'').toLowerCase().includes(PUB_FILTER.q.toLowerCase())) return false;
    if(PUB_FILTER.viewReq==='needsCheck' && !(c.viewRequirement && !c.viewRequirementMet)) return false;
    if(PUB_FILTER.viewReq==='hit' && !(c.viewRequirement && c.viewRequirementMet)) return false;
    if(PUB_FILTER.viewReq==='none' && c.viewRequirement) return false;
    if(range && (range.start || range.end)){
      const inRange = publishedPlatforms.some(p => {
        if(!p.postDate) return false;
        const d = new Date(p.postDate+'T12:00:00');
        if(range.start && d < range.start) return false;
        if(range.end && d > range.end) return false;
        return true;
      });
      if(!inRange) return false;
    }
    return true;
  }).sort((a,b) => {
    const latest = c => (c.platforms||[]).filter(p=>p.active&&p.postDate).map(p=>p.postDate).sort().slice(-1)[0] || '';
    const dateCompare = latest(b).localeCompare(latest(a));
    if(dateCompare !== 0) return dateCompare;
    // same post date — break the tie by which was actually added to the dashboard most recently
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
}

/* ---------------- tasks ---------------- */
function isTaskDoneToday(task){
  return task.daily ? !!(task.dailyDone && task.dailyDone[todayISO()]) : !!task.completed;
}
function sortedTasks(){
  return [...DATA.tasks].sort((a,b) => {
    const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if(p !== 0) return p;
    if(a.daily !== b.daily) return a.daily ? -1 : 1;
    return (a.createdAt||'').localeCompare(b.createdAt||'');
  });
}
function completeTask(taskId, viaTimer){
  const task = DATA.tasks.find(x=>x.id===taskId);
  if(!task) return;
  if(task.daily){ task.dailyDone = task.dailyDone || {}; task.dailyDone[todayISO()] = true; }
  else { task.completed = true; }
  saveData();
  if(viaTimer){
    TIMER_DONE_POPUP = { taskTitle: task.title };
    TIMER_ENTER = true;
    playTimerDoneSound();
    tryBrowserNotification(task.title);
  } else {
    showToast('Marked done');
  }
  render();
  TIMER_ENTER = false;
}
function toggleTaskDone(taskId){
  const task = DATA.tasks.find(x=>x.id===taskId);
  if(!task) return;
  if(task.daily){ task.dailyDone = task.dailyDone || {}; const d = todayISO(); task.dailyDone[d] = !task.dailyDone[d]; }
  else { task.completed = !task.completed; }
  saveData(); render();
}
function startTaskTimer(taskId){
  if(TASK_TIMERS[taskId]) return;
  const task = DATA.tasks.find(t=>t.id===taskId);
  const seconds = Math.max(60, (Number(task && task.timerMinutes) || 10) * 60);
  TASK_TIMERS[taskId] = { remaining: seconds };
  TASK_TIMERS[taskId].intervalId = setInterval(() => {
    const t = TASK_TIMERS[taskId];
    if(!t) return;
    t.remaining--;
    updateTimerDisplay(taskId);
    if(t.remaining <= 0){
      clearInterval(t.intervalId);
      delete TASK_TIMERS[taskId];
      completeTask(taskId, true);
    }
  }, 1000);
  render();
}
function cancelTaskTimer(taskId){
  const t = TASK_TIMERS[taskId];
  if(t){ clearInterval(t.intervalId); delete TASK_TIMERS[taskId]; render(); }
}
function updateTimerDisplay(taskId){
  const el = document.querySelector(`[data-timer-display="${taskId}"]`);
  const t = TASK_TIMERS[taskId];
  if(el && t){
    const m = Math.floor(t.remaining/60), s = t.remaining%60;
    el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
}
function renderTaskAction(task){
  const done = isTaskDoneToday(task);
  if(done){
    return `<button class="btn btn-sm btn-primary" data-toggle-task="${task.id}" type="button">Done ✓</button>`;
  }
  if(task.requiresTimer){
    const timer = TASK_TIMERS[task.id];
    const timerMinutes = Number(task.timerMinutes) || 10;
    if(timer){
      const m = Math.floor(timer.remaining/60), s = timer.remaining%60;
      return `<div style="display:flex; align-items:center; gap:8px;">
        <span class="mono timer-display" data-timer-display="${task.id}">${m}:${String(s).padStart(2,'0')}</span>
        <button class="btn btn-ghost btn-sm" data-cancel-timer="${task.id}" type="button">Cancel</button>
      </div>`;
    }
    return `<button class="btn btn-sm btn-ghost" data-start-timer="${task.id}" type="button">Start ${timerMinutes}:00</button>`;
  }
  return `<button class="btn btn-sm btn-ghost" data-toggle-task="${task.id}" type="button">Mark done</button>`;
}
function renderTasks(){
  const tasks = sortedTasks();
  return `
    <div class="page-head">
