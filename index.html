/* ---------------- earnings ----------------
   Base pay + CPM bonus are manual figures. They only count toward
   "earned" once a platform copy is marked Published — and, if a view
   requirement is set on the deliverable, only once you've manually
   confirmed you checked the view count and it's been hit.
------------------------------------------------------------------ */
function isEarning(c){
  const anyPublished = (c.platforms||[]).some(p => p.active && p.status === 'published');
  if(!anyPublished) return false;
  if(c.viewRequirement){ return !!c.viewRequirementMet; }
  return true;
}
function isViewRequirementExpired(c){
  // a view requirement with a window that's passed, still unmet — it's not realistically ever
  // going to qualify (most views happen soon after posting), so it should stop being "pending"
  if(!c.viewRequirement || c.viewRequirementMet || !c.viewRequirementWindowDays) return false;
  const dated = (c.platforms||[]).filter(p=>p.active && p.status==='published' && p.postDate).map(p=>p.postDate).sort();
  if(dated.length===0) return false;
  const deadline = new Date(dated[0]+'T00:00:00');
  deadline.setDate(deadline.getDate() + Number(c.viewRequirementWindowDays));
  return new Date() > deadline;
}
function contentEarnings(c){
  const base = Number(c.basePay)||0;
  const bonus = Number(c.cpmBonus)||0;
  const earning = isEarning(c);
  const expired = isViewRequirementExpired(c);
  return { base, bonus, total: earning ? base+bonus : 0, pendingTotal: (earning || expired) ? 0 : base+bonus, earning, expired };
}
function cpmBonusInRange(start, end, brandId){
  return DATA.payments.filter(p => {
    if(brandId && p.brandId !== brandId) return false;
    if(!p.cpmBonus) return false;
    if(!p.date) return false;
    const d = new Date(p.date+'T12:00:00');
    if(start && d < start) return false;
    if(end && d > end) return false;
    return true;
  }).reduce((s,p) => s + (Number(p.cpmBonus)||0), 0);
}
// Content/Published are pure production-status info now — Earned comes exclusively from the
// automated tracker (see getDeliverables()). This is that brand's own slice of it, found by
// matching the brand's linked Supabase id (brand.supabaseBrandId) against each tracked video's
// brand_id — zero if the brand isn't linked to a backend record yet (see the brand modal's
// "Connected accounts" section).
function brandTotals(brandId){
  const brand = brandById(brandId);
  let contentEarned = 0, pending = 0, count = 0;
  if(brand && brand.supabaseBrandId && TRACKED_CONTENT_DATA){
    const items = getDeliverables().filter(dv => !dv.excluded && dv.rows[0].brand_id === brand.supabaseBrandId);
    contentEarned = items.filter(dv=>dv.status==='hit').reduce((s,dv)=>s+dv.payAmount,0);
    pending = items.filter(dv=>dv.status==='tracking').reduce((s,dv)=>s+dv.payAmount,0);
    count = items.length;
  }
  const brandPayments = DATA.payments.filter(p => p.brandId === brandId);
  const received = brandPayments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const receivedCpm = brandPayments.reduce((s,p)=>s+(Number(p.cpmBonus)||0),0);
  const receivedBase = received - receivedCpm;
  // a CPM bonus is realized the moment it's paid — you don't know the amount until the brand tells
  // you, so unlike base pay it never sits "pending" against a video; it counts straight to Earned
  const totalEarned = contentEarned + receivedCpm;
  return { count, contentEarned, totalEarned, pending, received, receivedBase, receivedCpm, outstanding: totalEarned - received };
}
// A tracked video's payout is whatever was snapshotted onto it when the scouting job first
// discovered it (r.pay_amount = that brand's base_pay at the time) — not a live join to the
// brand's current rate. That's deliberate: if a brand's deal changes later (e.g. a warm-up
// brief ending and a new rate starting), older videos keep the rate that applied when they
// were found, and only newly-discovered videos pick up the new one. It can also be edited by
// hand per-video (see the Edit button in the Tracked Content table) for one-off exceptions —
// a differently-priced video, or one that shouldn't count/be tracked at all (r.excluded).
function tcAmount(r){ return Number(r.pay_amount ?? r.brands?.base_pay ?? 0); }
// Rows sharing a group_id are the same piece of content crossposted to multiple platforms
// (set manually — see the Merge picker in the Tracked Content tab) and must be paid ONCE, not
// once per platform. This is the single place that turns raw tracked_videos rows into "deliverable"
// units — every dollar total in the app reads from here instead of the raw rows directly, so the
// pay-once-whichever-platform-hits-first rule can't get out of sync between different totals.
function getDeliverables(){
  if(!TRACKED_CONTENT_DATA) return [];
  const byGroup = {};
  const standalone = [];
  TRACKED_CONTENT_DATA.forEach(r => {
    if(r.group_id){ (byGroup[r.group_id] = byGroup[r.group_id] || []).push(r); }
    else standalone.push(r);
  });
  const deliverables = standalone.map(r => ({
    key: r.id, rows: [r], grouped: false,
    brand: r.brands, brandName: r.brands?.name || 'Unassigned (automated)',
    excluded: !!r.excluded, status: r.status,
    payAmount: tcAmount(r), earnedAt: r.status==='hit' ? r.posted_at : null,
    postedAt: r.posted_at, title: r.title, thumbnail: r.thumbnail_url,
  }));
  Object.entries(byGroup).forEach(([gid, rows]) => {
    const active = rows.filter(r=>!r.excluded);
    const allExcluded = active.length === 0;
    const consider = allExcluded ? rows : active;
    const hitRow = consider.find(r=>r.status==='hit');
    const anyTracking = consider.some(r=>r.status==='tracking');
    const anyMissing = consider.some(r=>r.status==='missing');
    const status = hitRow ? 'hit' : anyTracking ? 'tracking' : anyMissing ? 'missing' : 'expired';
    const rep = hitRow || consider[0];
    // earliest of the group's post times — when this piece of content first went out, before
    // it was crossposted elsewhere (matches clusterForCompare's anchor convention)
    const postedAt = rows.map(r=>r.posted_at).filter(Boolean).sort()[0] || null;
    // Prefer the representative row's own thumbnail (keeps today's behavior in the normal case),
    // but fall back to any other platform in the group that has one. Without this, a merged
    // deliverable went completely blank whenever rep happened to be the one platform currently
    // missing its thumbnail (e.g. Instagram mid-API-block) — even though TikTok or YouTube's
    // thumbnail for the same piece of content was sitting right there in the same group.
    const thumbnail = rep.thumbnail_url || rows.map(r=>r.thumbnail_url).find(Boolean) || null;
    deliverables.push({
      key: gid, rows, grouped: true,
      brand: rep.brands, brandName: rep.brands?.name || 'Unassigned (automated)',
      excluded: allExcluded, status,
      payAmount: tcAmount(rep), earnedAt: hitRow ? hitRow.posted_at : null,
      postedAt, title: rep.title, thumbnail,
    });
  });
  return deliverables;
}
// ---- Alerts (bell icon) ----
// Two kinds, both derived purely from data already loaded — no new table, no new scouting-job
// writes:
// 1. "Hits" — one persisted entry per deliverable, created the first time it's noticed to have
//    hit its requirement. Permanent once created (a hit is a fact that never un-happens) — the
//    only way it leaves the list is the user pressing Clear notifications. No stored "detected at"
//    timestamp per video exists (only posted_at, which can be long before it actually crossed the
//    requirement), so ts is "first noticed by this browser", not the true hit moment.
// 2. "Stale coverage" — still-'tracking' rows whose last_checked_at is more than ~1 daily-cron-
//    cycle-plus-buffer old. The scouting job is supposed to touch every video in its window on
//    every run; one that hasn't updated in 40+ hours either had a run fail, got cut short by the
//    rate-limit guard, or fell outside the pagination page cap at high posting volume — any of
//    which is worth a look. Unlike hits, this is a *live* condition, not a fact — the entry is
//    removed the moment the row is actually checked again, regardless of read state; an old
//    warning about a since-resolved problem isn't useful history to keep around.
//
// Both kinds live in one persisted log (localStorage, per-browser, not synced — same as
// CLOUD_MODE) so a notification survives closing the panel instead of vanishing the instant it's
// seen: it dims (read:true) the next time the panel opens, but stays visible until the user
// explicitly clears it. This is what makes "N notifications, some grayed out, some not" possible.
function getAlertsLog(){
  try{ return JSON.parse(localStorage.getItem('rwr-alerts-log') || '[]'); }
  catch(e){ return []; }
}
function saveAlertsLog(log){
  try{ localStorage.setItem('rwr-alerts-log', JSON.stringify(log)); }
  catch(e){ /* localStorage unavailable — alerts just won't persist; harmless, same graceful fallback as before */ }
}
function markAllAlertsRead(){
  const log = getAlertsLog();
  let changed = false;
  log.forEach(e => { if(!e.read){ e.read = true; changed = true; } });
  if(changed) saveAlertsLog(log);
}
// Marks every current entry cleared+read rather than deleting them outright. A real delete would
// work for stale entries (they're re-derived from a live "is it still stale" check, so losing the
// record just means it can resurface if still true) but NOT for hits — those are re-derived from
// "is this deliverable's status still 'hit'", which stays true forever, so an emptied array would
// just get every hit rediscovered as brand-new and unread on the very next render. The cleared
// flag is what syncAlertsLog checks (via byId, built from the full stored array) to know "already
// notified about this, don't do it again" — permanently, for as long as the record exists.
function clearAlertsLog(){
  const log = getAlertsLog();
  log.forEach(e => { e.cleared = true; e.read = true; });
  saveAlertsLog(log);
}
// Same tiered schedule the scout jobs actually run on (added 2026-08-26, alongside tracking
// windows extending up to 180 days — see isDueForCheck() in the scout-*.js files) — daily for
// the first 30 days, weekly to day 90, monthly after. A video legitimately due weekly can go
// 7 days between checks and monthly up to 30; flagging every one of those on the old flat
// 40-hour rule would just be constant noise once a brief's window goes past 30 days.
function expectedCheckIntervalDays(daysSincePosted){
  if(daysSincePosted <= 30) return 1;
  if(daysSincePosted <= 90) return 7;
  return 30;
}
// Reconciles the persisted log against current data — adds newly-noticed hits/stale rows, drops
// stale entries whose underlying row got checked again, then returns the (possibly unchanged)
// log sorted newest first. Cheap to call on every render (renderAlertsBell already did the
// equivalent full-rescan every render before this), and only actually writes to localStorage when
// something changed.
function syncAlertsLog(){
  if(!TRACKED_CONTENT_DATA) return [];
  const now = Date.now();
  const log = getAlertsLog();
  const byId = new Map(log.map(e => [e.id, e]));
  let changed = false;

  getDeliverables().forEach(dv => {
    if(dv.excluded || dv.status !== 'hit') return;
    const id = 'hit-' + dv.key;
    if(byId.has(id)) return;
    const entry = {
      id, type:'hit', ts:now, read:false, cleared:false, videoId: dv.rows[0].id,
      title: (dv.title || 'Untitled').slice(0,60),
      detail: `+${money(dv.payAmount)} earned · ${dv.brandName}`,
    };
    log.push(entry); byId.set(id, entry); changed = true;
  });

  const currentStaleIds = new Set();
  TRACKED_CONTENT_DATA.forEach(r => {
    if(r.excluded || r.status!=='tracking' || !r.last_checked_at || !r.posted_at) return;
    const checkedAt = new Date(r.last_checked_at).getTime();
    const daysSincePosted = (now - new Date(r.posted_at).getTime()) / 86400000;
    const expectedDays = expectedCheckIntervalDays(daysSincePosted);
    if(now - checkedAt < (expectedDays + 1) * 86400000) return; // +1 day buffer for normal cron timing variance
    const id = 'stale-' + r.id;
    currentStaleIds.add(id);
    if(byId.has(id)) return;
    const daysStale = Math.floor((now-checkedAt)/86400000);
    const entry = {
      id, type:'stale', ts:checkedAt, read:false, cleared:false, videoId: r.id,
      title: `Hasn't been checked in ${daysStale}d`,
      detail: `${r.brands?.name||'Unassigned'} · ${(r.platform||'').toUpperCase()} · ${(r.title||'Untitled').slice(0,50)}`,
    };
    log.push(entry); byId.set(id, entry); changed = true;
  });
  for(let i=log.length-1; i>=0; i--){
    if(log[i].type==='stale' && !currentStaleIds.has(log[i].id)){ log.splice(i,1); changed = true; }
  }

  // System health — did each platform's scan actually run, and did it succeed when it did. This
  // is different from "stale" above (one video not being re-checked) — this is about the scout
  // job itself: silently never firing at all, or firing but getting rejected outright (blocked
  // API, expired token, etc.). Both are invisible from tracked_videos alone — a fully-blocked run
  // leaves last_checked_at untouched, identical to the cron simply never firing.
  if(SCOUT_RUNS_DATA){
    const currentMissingIds = new Set();
    const PLATFORM_LABELS = { instagram:'Instagram', tiktok:'TikTok', youtube:'YouTube' };
    ['instagram','tiktok','youtube'].forEach(platform => {
      const runs = SCOUT_RUNS_DATA.filter(r => r.platform===platform).sort((a,b) => new Date(b.started_at)-new Date(a.started_at));
      const latest = runs[0];
      const label = PLATFORM_LABELS[platform];
      // Missed run — nothing recorded for this platform in the last 26h (a day plus the same
      // buffer used for stale-coverage above). A live condition, not a fixed fact — self-resolving,
      // removed the moment a run actually shows up, same as stale-coverage.
      const missingId = 'run-missing-' + platform;
      const hasRecentRun = latest && (now - new Date(latest.started_at).getTime()) < 26*3600000;
      if(!hasRecentRun){
        currentMissingIds.add(missingId);
        if(!byId.has(missingId)){
          const hoursAgo = latest ? Math.floor((now - new Date(latest.started_at).getTime())/3600000) : null;
          const entry = {
            id: missingId, type:'run-missing', ts:now, read:false, cleared:false, videoId:null,
            title: `${label} scan hasn't run in over a day`,
            detail: hoursAgo!=null ? `Last run ${hoursAgo}h ago` : 'No run recorded yet',
          };
          log.push(entry); byId.set(missingId, entry); changed = true;
        }
      }
      // Run error — the most recent run for this platform failed outright, or a brand it scanned
      // hit an API error (rate limit, blocked access, missing/expired token, etc.). Tied to that
      // specific run's own id — a run that's still failing doesn't re-notify every sync, but a
      // fresh failure (a new run id) always does, same as a hit above.
      if(latest && (!latest.ok || (latest.brand_errors && latest.brand_errors.length))){
        const id = 'run-error-' + latest.id;
        if(!byId.has(id)){
          const msgs = !latest.ok ? [latest.top_error || 'Unknown error'] : latest.brand_errors.map(e => `${e.brand}: ${e.error}`);
          const entry = {
            id, type:'run-error', ts:new Date(latest.started_at).getTime(), read:false, cleared:false, videoId:null,
            title: `${label} scan hit an error`,
            detail: msgs.join(' · ').slice(0,200),
          };
          log.push(entry); byId.set(id, entry); changed = true;
        }
      }
    });
    for(let i=log.length-1; i>=0; i--){
      if(log[i].type==='run-missing' && !currentMissingIds.has(log[i].id)){ log.splice(i,1); changed = true; }
    }
  }

  // No cap here on purpose — this runs on every render (see renderAlertsBell), and truncating
  // would drop entries out of byId, which would then look "un-logged" on the very next sync and
  // get re-added as unread, forever churning. Hit entries are a small, meaningful, permanent
  // record (money earned) a user wouldn't want silently discarded anyway; Clear notifications is
  // the one intended way this list ever shrinks.
  log.sort((a,b) => b.ts - a.ts);
  if(changed) saveAlertsLog(log);
  return log;
}
// Frozen the moment the panel opens (see openAlertsPanel) so the list doesn't shift out from
// under you mid-read as "read" state updates — the bell's badge count, computed fresh from
// syncAlertsLog() on every render, is what actually reflects live state. Captured *before*
// markAllAlertsRead runs, so anything brand-new still renders un-dimmed on this one opening —
// it only shows up gray starting the *next* time the panel is opened.
let ALERTS_SNAPSHOT = null;
// The bell renders inside a narrow 220px sidebar — a CSS-anchored dropdown (position:absolute,
// right:0) had nowhere near enough room to lay its 300px width out and clipped off the left edge
// of the screen. Same fix as the date picker popover: capture the actual clicked bell's
// on-screen rect at open time and render the popover position:fixed, with its coordinates
// clamped to the viewport in renderAlertsPanel() — works regardless of which container it's
// nested in or how narrow that container is.
let ALERTS_ANCHOR_RECT = null;
function openAlertsPanel(anchorEl){
  ALERTS_ANCHOR_RECT = anchorEl.getBoundingClientRect();
  ALERTS_SNAPSHOT = syncAlertsLog().filter(a => !a.cleared);
  markAllAlertsRead();
  ALERTS_OPEN = true;
  render();
}
function closeAlertsPanel(){
  ALERTS_OPEN = false;
  ALERTS_SNAPSHOT = null;
  ALERTS_ANCHOR_RECT = null;
  render();
}
// Renders only the button — the popover itself is rendered separately, at the top level of
// render()'s template (see the ALERTS_OPEN line there), specifically so it's never a *descendant*
// of .sidebar/.mobile-topbar. Both of those have backdrop-filter, which — like the date picker
// popover already had to work around — creates a new containing block for position:fixed
// descendants in most browsers, so a fixed popover nested inside one gets trapped and clipped by
// that ancestor's own bounds/scroll instead of floating freely over the real viewport.
function renderAlertsBell(){
  // Badge is unread count only — a read (grayed, but not yet cleared) notification stays in the
  // list but stops demanding attention, same as any other app's bell.
  const count = syncAlertsLog().filter(a => !a.read && !a.cleared).length;
  return `
  <div class="alerts-bell-wrap">
    <button class="alerts-bell" data-alerts-bell type="button" aria-label="Alerts" title="Alerts">
      🔔${count>0 ? `<span class="alerts-badge">${count>9?'9+':count}</span>` : ''}
    </button>
  </div>`;
}
function renderAlertsPanel(){
  const alerts = ALERTS_SNAPSHOT || [];
  const rect = ALERTS_ANCHOR_RECT;
  const width = 300;
  const top = Math.max(8, Math.min(rect.bottom + 8, window.innerHeight - 120));
  const left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8));
  return `<div class="alerts-popover" style="top:${top}px; left:${left}px;">
    <div class="alerts-head">
      <span>Alerts</span>
      ${alerts.length ? `<button type="button" data-clear-alerts class="alerts-clear-btn">Clear notifications</button>` : ''}
    </div>
    ${alerts.length===0 ? `<div class="empty" style="padding:20px 10px;">All caught up — nothing needs your attention.</div>` : `
    <div class="alerts-list">
      ${alerts.map(a => `
        <div class="alert-item alert-${a.type} ${a.read?'alert-read':''}" ${a.videoId?`data-alert-goto-video="${a.videoId}"`:''}>
          <div class="alert-icon">${a.type==='hit' ? '🎉' : a.type==='run-error' ? '🔴' : a.type==='run-missing' ? '⏱️' : '⚠️'}</div>
          <div class="alert-body">
            <div class="alert-title">${escapeHtml(a.title)}</div>
            <div class="alert-detail">${escapeHtml(a.detail)}</div>
          </div>
        </div>`).join('')}
    </div>`}
  </div>`;
}

function trackedContentTotals(){
  // automated-pipeline earnings (Supabase, fed by the scouting job) — folded into the main
  // dashboard totals below. Returns zeros until the first load resolves (see loadTrackedContent),
  // so the dashboard just shows the manual-only numbers for a moment on first paint, then updates.
  if(!TRACKED_CONTENT_DATA) return { earned: 0, pending: 0 };
  const items = getDeliverables().filter(d=>!d.excluded);
  const earned = items.filter(d=>d.status==='hit').reduce((s,d)=> s + d.payAmount, 0);
  const pending = items.filter(d=>d.status==='tracking').reduce((s,d)=> s + d.payAmount, 0);
  return { earned, pending };
}
function allTotals(){
  // Earned/Pending come from the automated tracker globally (trackedContentTotals — every
  // tracked video regardless of whether its brand has a manual profile linked yet), NOT summed
  // per-brand here — brandTotals(id).totalEarned is that one brand's own slice of this same
  // total, so adding both would double-count every linked brand. Received is unaffected (it's
  // Payments, which were never part of the automated total) and does need summing per brand.
  let received = 0;
  DATA.brands.forEach(b => { received += brandTotals(b.id).received; });
  const tc = trackedContentTotals();
  const totalEarned = tc.earned;
  const pending = tc.pending;
  return { totalEarned, received, pending, outstanding: totalEarned - received, contentCount: DATA.content.length, brandCount: DATA.brands.length };
}
function brandById(id){ return DATA.brands.find(b=>b.id===id); }

/* ---------------- recurring briefs ----------------
   A brief lives on a brand: a cadence (per day/week/month), a rate,
   and default platforms. Today's quota is computed live — never
   stored — by converting the cadence to a weekly equivalent and
   spreading it evenly across the 7 days of the week (so 5/week
   lands on 5 non-clustered days rather than 5-on-2-off, and
   fractional cadences like 20/week distribute as evenly as possible
   rather than drifting).
------------------------------------------------------------------ */
function briefWeeklyEquivalent(brief){
  if(brief.cadenceType==='perDay') return (Number(brief.cadenceCount)||0) * 7;
  if(brief.cadenceType==='perWeek') return Number(brief.cadenceCount)||0;
  return (Number(brief.cadenceCount)||0) * 7/30; // perMonth, approximated
}
function briefDayQuota(brief, dow){
  const weekly = briefWeeklyEquivalent(brief);
  const cum = i => Math.round((i+1) * weekly / 7);
  return cum(dow) - cum(dow-1);
}
function activeBriefBrands(){
  return DATA.brands.filter(b => b.brief && b.brief.status==='active');
}
function briefTodayInfo(brand){
  const brief = brand.brief;
  const quota = briefDayQuota(brief, new Date().getDay());
  const progress = (brief.progress && brief.progress[todayISO()]) || 0;
  return { quota, progress, remaining: Math.max(0, quota - progress) };
}
function briefTrialInfo(brief){
  // trial briefs run for a fixed window (e.g. a 30-day trial) rather than indefinitely — this
  // just computes where they stand; it never auto-changes status, that stays a manual decision
  if(!brief || brief.kind !== 'trial' || !brief.trialStartDate || !brief.trialDurationDays) return null;
  const start = new Date(brief.trialStartDate+'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + Number(brief.trialDurationDays));
  const today = new Date(todayISO()+'T00:00:00');
  const daysRemaining = Math.ceil((end - today) / (1000*60*60*24));
  return { endDate: end.toISOString().slice(0,10), daysRemaining, expired: daysRemaining < 0 };
}
function briefVideoTitle(brandName, dateStr, count){
  // e.g. "Amboras-20-August" for the day's first, "Amboras-20-August-02" for the second, etc.
  const d = new Date(dateStr+'T00:00:00');
  const base = `${brandName}-${d.getDate()}-${d.toLocaleDateString('en-US',{month:'long'})}`;
  return count > 1 ? `${base}-${String(count).padStart(2,'0')}` : base;
}
function makeBriefVideo(brandId){
  const brand = DATA.brands.find(b=>b.id===brandId);
  if(!brand || !brand.brief || brand.brief.status!=='active') return;
  const brief = brand.brief;
  const info = briefTodayInfo(brand);
  if(info.remaining <= 0) return;
  const dateStr = todayISO();
  const countToday = (brief.progress[dateStr]||0) + 1;
  const platforms = normalizePlatforms([]).map(p => (brief.platforms||[]).includes(p.id) ? { ...p, active:true, status:'idea', postDate:'' } : p);
  DATA.content.push({
    id:uid('ct_'), brandId:brand.id, title: briefVideoTitle(brand.name, dateStr, countToday),
    basePay:Number(brief.basePay)||0, cpmBonus:Number(brief.cpmBonus)||0, createdAt: new Date().toISOString(),
    viewRequirement: brief.viewRequirement || null, viewRequirementMet:false,
    viewRequirementWindowDays: brief.viewRequirementWindowDays || null, platforms
  });
  brief.progress = brief.progress || {};
  brief.progress[dateStr] = countToday;
  saveData();
  showToast(`Added video ${countToday}/${info.quota} for ${brand.name} today`);
  render();
}
function undoBriefVideo(brandId){
  // manual counter correction — e.g. after deleting a video from Content that was created via +1
  // Made. This never touches the content list itself, only today's progress count, since matching
  // a deleted item back to "was it actually counted today" reliably isn't worth the fragility.
  const brand = DATA.brands.find(b=>b.id===brandId);
  if(!brand || !brand.brief) return;
  const brief = brand.brief;
  brief.progress = brief.progress || {};
  const dateStr = todayISO();
  const current = brief.progress[dateStr] || 0;
  if(current <= 0) return;
  brief.progress[dateStr] = current - 1;
  saveData();
  showToast(`Corrected ${brand.name}'s count to ${current - 1} today`);
  render();
}
function applyBriefDefaultsToDraft(draft, brandId){
  // fills a NEW content draft from the brand's brief (rate, CPM, view requirement + window, platforms) —
  // still fully editable afterward, this just saves re-typing the same numbers every time
  const brand = brandById(brandId);
  if(!brand || !brand.brief) return;
  const brief = brand.brief;
  draft.basePay = Number(brief.basePay)||0;
  draft.cpmBonus = Number(brief.cpmBonus)||0;
  draft.viewRequirement = brief.viewRequirement || null;
  draft.viewRequirementWindowDays = brief.viewRequirementWindowDays || null;
  const activeIds = brief.platforms || [];
  draft.platforms = normalizePlatforms(draft.platforms).map(p => activeIds.includes(p.id) ? { ...p, active:true } : { ...p, active:false });
}
function bumpBriefProgressForContentCreation(brandId){
  // a real single video just got logged for this brand (manual add, or the AI adding one) — count it
  // toward today's brief quota even though it didn't come through the "+1 Made" button specifically.
  // bulk/scheduling batches deliberately don't call this — they're planning ahead, not "made today".
  const brand = brandById(brandId);
  if(!brand || !brand.brief || brand.brief.status !== 'active') return;
  const d = todayISO();
  brand.brief.progress = brand.brief.progress || {};
  brand.brief.progress[d] = (brand.brief.progress[d]||0) + 1;
}
function renderBriefQuotas(){
  const briefs = activeBriefBrands();
  if(briefs.length===0) return '';
  return `<div class="table-wrap" style="margin-bottom:22px;">
    <div class="tw-head">Today's video quota</div>
    ${briefs.map(b => {
      const info = briefTodayInfo(b);
      const done = info.remaining<=0;
      const trial = briefTrialInfo(b.brief);
      const trialBadge = trial
        ? `<span class="tag ${trial.expired ? 'tag-danger' : 'tag-warn'}" style="font-size:9.5px;">${trial.expired ? `Trial ended ${Math.abs(trial.daysRemaining)}d ago` : `Trial — ${trial.daysRemaining}d left`}</span>`
        : '';
      // The actual videos this brand's count refers to today (created via "+1 Made", or any other
      // way) — shown as clickable chips so "2/3 today" isn't just an abstract number: you can see
      // exactly which titles it means and jump straight into editing one (film/edit/schedule it)
      // without leaving the dashboard. Each disappears from here on its own once published — it's
      // reading straight off DATA.content, the same list In Progress shows.
      const madeToday = DATA.content.filter(c => c.brandId===b.id && (c.createdAt||'').slice(0,10)===todayISO());
      return `<div style="padding:12px 16px; border-bottom:1px solid var(--border-soft);">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="swatch" style="background:${b.color}"></span>
            <span style="font-size:13.5px;">${escapeHtml(b.name)}</span>
            ${trialBadge}
            <span class="mono" style="font-size:12px; color:var(--text-dim);">${info.progress}/${info.quota} today</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="btn btn-ghost btn-sm" data-undo-brief="${b.id}" type="button" title="Correct today's count down by 1 (e.g. after deleting a video)" ${info.progress<=0?'disabled':''}>−1</button>
            <button class="btn btn-sm ${done?'btn-primary':'btn-ghost'}" data-make-brief="${b.id}" type="button" ${done?'disabled':''}>${done?'Done ✓':'+1 Made'}</button>
          </div>
        </div>
        ${madeToday.length ? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding-left:24px;">
          ${madeToday.map(c => `<button type="button" class="tag tag-neutral" data-open-content="${c.id}" style="cursor:pointer; border:none; font-family:inherit;" title="Edit this video">${escapeHtml(c.title)}</button>`).join('')}
        </div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------- automatic paid allocation (waterfall: oldest earned content gets settled first) ---------------- */
let PAID_ALLOCATION_CACHE = {};
function brandPaymentCoverage(brandId){
  if(PAID_ALLOCATION_CACHE[brandId]) return PAID_ALLOCATION_CACHE[brandId];
  const items = DATA.content
    .filter(c => c.brandId === brandId && isEarning(c))
    .map(c => ({ c, amt: contentEarnings(c).total, sortKey: (earnedDate(c) || '') + '|' + (c.createdAt || '') }))
    .sort((a,b) => a.sortKey.localeCompare(b.sortKey));
  const totalReceived = DATA.payments.filter(p => p.brandId === brandId).reduce((s,p)=>s+(Number(p.amount)||0), 0);
  let cumulative = 0;
  const map = {};
  items.forEach(({c, amt}) => {
    cumulative += amt;
    map[c.id] = cumulative <= totalReceived + 0.005;
  });
  PAID_ALLOCATION_CACHE[brandId] = map;
  return map;
}
function isContentPaid(c){
  if(!isEarning(c)) return false;
  return !!brandPaymentCoverage(c.brandId)[c.id];
}

/* ---------------- time-series helpers (for dashboard chart + range deltas) ---------------- */
function earnedDate(c){
  const dates = (c.platforms||[]).filter(p => p.active && p.status==='published' && p.postDate).map(p=>p.postDate);
  if(!dates.length) return null;
  return dates.sort().slice(-1)[0];
}
function buildBuckets(range){
  const now = new Date();
  let bucketType, count;
  if(range==='week'){ bucketType='day'; count=7; }
  else if(range==='month'){ bucketType='day'; count = now.getDate(); } // calendar month to date, like Week is calendar-week to date
  else if(range==='3m'){ bucketType='month'; count=3; }
  else if(range==='6m'){ bucketType='month'; count=6; }
  else if(range==='12m'){ bucketType='month'; count=12; }
  else {
    bucketType='month';
    const earned = DATA.content.map(earnedDate).filter(Boolean).sort();
    count = 12;
    if(earned.length){
      const first = new Date(earned[0]+'T00:00:00');
      count = Math.max(1, Math.min(36, (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth()) + 1));
    }
  }
  const buckets = [];
  if(bucketType==='day'){
    for(let i=count-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
      buckets.push({ start:d, end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59), label: d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) });
    }
  } else if(bucketType==='week'){

function rangeBounds(range){

// when given (used by the by-brand breakdown), or sums across everything when omitted.
function trackedContentEarnedBetween(start, end, brandName){
  if(!TRACKED_CONTENT_DATA) return 0;
  return getDeliverables().filter(d => {
    if(d.excluded || d.status!=='hit' || !d.earnedAt) return false;
    if(brandName && d.brandName !== brandName) return false;
    const dt = new Date(d.earnedAt);
    return dt>=start && dt<=end;
  }).reduce((s,d)=> s + d.payAmount, 0);
}
function sumEarnedBetween(start, end){
  // Earned is the automated tracker (plus CPM bonuses, which are logged on Payments — a money
  // fact, not a Content one) — Content/Published no longer contribute anything here.
  let sum = cpmBonusInRange(start, end);
  sum += trackedContentEarnedBetween(start, end);

}
function sumReceivedBetween(start, end){
  return DATA.payments.filter(p => {
    if(!p.date) return false;
    const d = new Date(p.date+'T00:00:00');
    return d>=start && d<=end;
  }).reduce((s,p)=>s+(Number(p.amount)||0), 0);

function buildSeries(range){
  return buildBuckets(range).map(b => {
    let total = 0;
    const byBrand = {};
    // Content/Published no longer contribute here — Earned is the automated tracker plus CPM
    // bonuses (a Payments fact), same split as sumEarnedBetween().
    // CPM bonuses count as earned the moment they're paid, attributed to whichever brand paid them
    DATA.brands.forEach(brand => {
      const cpm = cpmBonusInRange(b.start, b.end, brand.id);
      if(cpm){
        total += cpm;
        byBrand[brand.name] = (byBrand[brand.name]||0) + cpm;
      }
    });
    // automated Tracked Content earnings, grouped by whichever brand's channel it came from
    // (each crossposted deliverable counts once — see getDeliverables())
    if(TRACKED_CONTENT_DATA){
      getDeliverables().forEach(dv => {
        if(dv.excluded || dv.status!=='hit' || !dv.earnedAt) return;
        const d = new Date(dv.earnedAt);
        if(d<b.start || d>b.end) return;

        byBrand[dv.brandName] = (byBrand[dv.brandName]||0) + dv.payAmount;

function smoothPath(pts){
  if(pts.length===0) return '';
  if(pts.length===1) return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const cp1x = p1.x + (p2.x-p0.x)/6;
    const cp1y = p1.y + (p2.y-p0.y)/6;
    const cp2x = p2.x - (p3.x-p1.x)/6;
    const cp2y = p2.y - (p3.y-p1.y)/6;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function renderLineChartSvg(series){

  const pts = series.map((s,i) => ({ x: pad+i*stepX, y: topPad+(H-pad-topPad)*(1-s.value/max) }));
  const linePath = smoothPath(pts);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block; overflow:visible;" class="${CHART_ENTER?'chart-enter':''}">
      <defs>

        </linearGradient>
      </defs>
      ${areaPath ? `<path class="chart-area-path" d="${areaPath}" fill="url(#chartFillGrad)" stroke="none"/>` : ''}
      <path class="chart-line-path" pathLength="1" d="${linePath}" fill="none" stroke="var(--fx-green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1"/>
      ${pts.map((p,i) => {
        const isLast = i===n-1;
        const delay = CHART_ENTER ? `style="animation-delay:${520+i*28}ms"` : '';
        return `<circle class="chart-pt-hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="transparent" style="cursor:pointer; pointer-events:all;" data-chart-point="${i}"></circle><circle class="chart-pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?3.6:2.2}" fill="var(--fx-green)" ${delay} opacity="${isLast?1:0.7}"/>`;
      }).join('')}
      <g class="chart-hover-guide" id="chartHoverGuide">
        <line x1="0" y1="${topPad}" x2="0" y2="${H-pad}"/>
        <circle cx="0" cy="0" r="4.5"/>
      </g>
    </svg>
    <div style="display:flex; justify-content:space-between; margin-top:6px;">
      ${series.map((s,i)=> `<span style="font-size:10px;color:var(--text-faint);">${i%labelStep===0 ? escapeHtml(s.label) : ''}</span>`).join('')}
    </div>`;

function renderBrandBreakdown(bounds){

  // just CPM bonuses (a Payments fact), before the automated tracker folds in below.
  let rows = DATA.brands.map(b => {
    const sum = cpmBonusInRange(bounds.start, bounds.end, b.id);
    return { brand:b, sum };
  });
  // ...then fold in automated Tracked Content earnings by brand name. Supabase brands (PureFi,
  // etc.) are a separate table from DATA.brands, so a name match adds onto an existing row;
  // no match creates a synthetic row (fallback color, since Supabase brands don't have one)
  // so brands that only exist in the automated system still show up here.
  const FALLBACK_COLORS = ['#9a7ec2','#5aa89e','#c1834f','#5b8ab0','#6f8f6a'];
  let fallbackIdx = 0;
  if(TRACKED_CONTENT_DATA){
    getDeliverables().forEach(dv => {

      const d = new Date(dv.earnedAt);

      const existing = rows.find(row => row.brand.name === name);
      if(existing){ existing.sum += amt; }

// Drag-to-reorder for the Brand Comparison table. Runs entirely outside render() while a drag
// is in progress — moving the real <tr> nodes in place with a FLIP animation for whichever rows
// get displaced, then only writing to localStorage on drop. No re-render is needed: the DOM
// already shows the final order, and row order doesn't affect the footer totals.
function bindBrandComparisonDnD(){
  const tbody = document.getElementById('brandCmpTbody');
  if(!tbody) return;
  let dragEl = null;

  function captureRects(){
    const map = new Map();
    tbody.querySelectorAll('tr').forEach(r => map.set(r.dataset.rowKey, r.getBoundingClientRect()));
    return map;
  }
  function playFlip(before){
    tbody.querySelectorAll('tr').forEach(row => {
      if(row === dragEl) return; // the dragged row already follows the cursor via native drag
      const prev = before.get(row.dataset.rowKey);
      if(!prev) return;
      const next = row.getBoundingClientRect();
      const deltaY = prev.top - next.top;
      if(Math.abs(deltaY) < 0.5) return;
      row.style.transition = 'none';
      row.style.transform = `translateY(${deltaY}px)`;
      requestAnimationFrame(() => {
        row.style.transition = 'transform .28s cubic-bezier(.22,1,.36,1)';
        row.style.transform = '';
      });
    });
  }

  tbody.querySelectorAll('tr').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragEl = row;
      // deferred a frame so the browser's native drag-ghost snapshot still captures full opacity
      requestAnimationFrame(() => row.classList.add('row-dragging'));
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.rowKey);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('row-dragging');
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('row-drop-before','row-drop-after'));
      BRAND_ROW_ORDER = [...tbody.querySelectorAll('tr')].map(r => r.dataset.rowKey);
      localStorage.setItem('rwr-brand-order', JSON.stringify(BRAND_ROW_ORDER));
      dragEl = null;
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      if(!dragEl || dragEl === row) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('row-drop-before','row-drop-after'));
      row.classList.add(before ? 'row-drop-before' : 'row-drop-after');

      const target = before ? row : row.nextSibling;
      if(target === dragEl || dragEl.nextSibling === target) return; // already in place

      const rectsBefore = captureRects();
      tbody.insertBefore(dragEl, target);
      playFlip(rectsBefore);
    });
  });
}

// Same 30-day rolling window as the "Views — 30d" column this opens from — the breakdown exists
// to answer "what actually makes up that number", so it has to read off the exact same window
// or the two would silently disagree the moment a video ages past 30 days between renders.
function brandViewsBreakdownData(brandId, brandName, topN=5){
  if(!TRACKED_CONTENT_DATA) return { platformTotals: [], topVideos: [], totalViews: 0 };
  const cutoff = Date.now() - 30*86400000;
  const rows = TRACKED_CONTENT_DATA.filter(r => {
    if(r.excluded) return false;
    if(!r.posted_at || new Date(r.posted_at).getTime() < cutoff) return false;
    return brandId ? r.brand_id === brandId : r.brands?.name === brandName;
  });
  const byPlatform = {};
  rows.forEach(r => { byPlatform[r.platform] = (byPlatform[r.platform]||0) + (Number(r.view_count)||0); });
  const platformTotals = Object.entries(byPlatform).map(([platform,views]) => ({platform, views})).sort((a,b)=>b.views-a.views);
  const topVideos = [...rows].sort((a,b)=>(Number(b.view_count)||0)-(Number(a.view_count)||0)).slice(0, topN);
  return { platformTotals, topVideos, totalViews: rows.reduce((s,r)=>s+(Number(r.view_count)||0),0) };
}

// EXPERIMENTAL (added 2026-08-25, 2-week trial) — see VIEW_SNAPSHOTS_DATA's declaration for the
// full removal note. One scouting run/day means one snapshot per video per day, so summing
// same-day rows is a safe daily total with no extra dedup needed. Returns oldest-first.
function brandPlatformTrend(brandId, brandName, platform){
  if(!VIEW_SNAPSHOTS_DATA) return [];
  // fallback brands (not yet in this device's DATA.brands) have no local id to match snapshots'
  // brand_id against directly — resolve it the same way brandComparisonRows() already does,
  // off any already-loaded tracked_videos row for that brand name.
  const resolvedId = brandId || TRACKED_CONTENT_DATA?.find(r => r.brands?.name === brandName)?.brand_id;
  if(!resolvedId) return [];
  const byDay = {};
  VIEW_SNAPSHOTS_DATA.forEach(s => {
    if(s.brand_id !== resolvedId || s.platform !== platform) return;
    const day = s.checked_at.slice(0,10);
    byDay[day] = (byDay[day]||0) + (Number(s.view_count)||0);
  });
  return Object.keys(byDay).sort().map(day => byDay[day]);
}
// A word-sized trend line — no axes, no labels, just shape. Reuses the main earnings chart's
// smoothPath() so it's the same curve style, just tiny. Returns '' (renders nothing) with fewer
// than 2 points, which is expected for the first day or so after this feature is added — there's
// nothing dishonest-looking about a flat/missing line at that point, so no placeholder needed.
function sparklineSvg(values, color, w=48, h=16){
  if(values.length < 2) return '';
  const max = Math.max(...values), min = Math.min(...values);
  const range = max - min || 1;
  const stepX = w / (values.length - 1);
  const pts = values.map((v,i) => ({ x: i*stepX, y: h - ((v-min)/range) * (h-2) - 1 }));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block; flex-shrink:0;" aria-hidden="true">
    <path d="${smoothPath(pts)}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// Tracked, still-pending deliverables ranked by whichever platform's eligibility window runs
// out soonest — turns the "Pending $X" stat tile from a number into an actual worklist. A
// grouped (crossposted) deliverable is only really "safe" once every platform in it is either
// past its window or excluded, so this looks at each platform's own eligible_until rather than
// the deliverable's aggregate status, and surfaces the tightest one.
// Only genuinely "soon" — a video with weeks of runway left isn't at risk of anything, so
// "soonest of everything" isn't the right bar. 7 days matches the danger/warn color bands below
// (<=2 red, <=5 amber) — this is what actually gates whether a row shows up here at all, not just
// how it's sorted. Nothing within a week → the empty state, which is the honest answer, not
// padding the list out with something that just happens to be the least-far-away.
const SOON_CUTOFF_DAYS = 7;
function expiringSoonDeliverables(limit=8){
  if(!TRACKED_CONTENT_DATA) return [];
  const cutoff = Date.now() + SOON_CUTOFF_DAYS * 86400000;
  return getDeliverables()
    .filter(dv => !dv.excluded && dv.status==='tracking')
    .map(dv => {
      const trackingRows = dv.rows.filter(r => !r.excluded && r.status==='tracking' && r.eligible_until);
      if(trackingRows.length===0) return null;
      const soonest = trackingRows.reduce((a,b)=> new Date(a.eligible_until) < new Date(b.eligible_until) ? a : b);
      const req = soonest.view_requirement_override != null ? Number(soonest.view_requirement_override) : Number(dv.brand?.view_requirement)||0;
      return { ...dv, eligibleUntil: soonest.eligible_until, repRow: soonest, viewCount: Number(soonest.view_count)||0, req };
    })
    .filter(Boolean)
    .filter(dv => new Date(dv.eligibleUntil).getTime() <= cutoff)
    .sort((a,b) => new Date(a.eligibleUntil) - new Date(b.eligibleUntil))
    .slice(0, limit);
}
function renderExpiringSoonTable(){
  const items = expiringSoonDeliverables();
  if(items.length===0) return `<div class="table-wrap"><div class="empty" style="padding:24px 10px;">Nothing at risk right now — every tracking video has plenty of runway.</div></div>`;
  const now = new Date();
  return `<div class="table-wrap" style="overflow-x:auto;"><table>
    <thead><tr><th></th><th>Brand</th><th>Title</th><th style="text-align:right;">Progress</th><th style="text-align:right;">Time left</th><th></th></tr></thead>
    <tbody>
      ${items.map(dv => {
        const daysLeft = Math.ceil((new Date(dv.eligibleUntil) - now) / 86400000);
        const pct = dv.req>0 ? Math.min(100, dv.viewCount/dv.req*100) : 0;
        const cls = daysLeft<=2 ? 'tag-danger' : daysLeft<=5 ? 'tag-warn' : 'tag-neutral';
        const label = daysLeft<0 ? 'Overdue' : daysLeft===0 ? 'Today' : `${daysLeft}d left`;
        return `<tr>
          <td>${dv.thumbnail ? `<img src="${dv.thumbnail}" alt="" style="width:36px; height:36px; object-fit:cover; border-radius:5px; display:block;" />` : `<div style="width:36px; height:36px; border-radius:5px; background:var(--surface);"></div>`}</td>
          <td style="white-space:nowrap;">${escapeHtml(dv.brandName)}</td>
          <td style="max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(dv.repRow.title||'')}">${escapeHtml(dv.repRow.title || 'Untitled')}</td>
          <td style="text-align:right;">
            <div style="display:inline-flex; align-items:center; gap:8px;">
              <span class="mono" style="font-size:11px; color:var(--text-dim); white-space:nowrap;">${dv.viewCount.toLocaleString()}/${dv.req.toLocaleString()}</span>
              <div class="brand-bar-track" style="width:56px;"><div class="brand-bar-fill" style="width:${pct.toFixed(0)}%; background:${pct>=100?'var(--fx-green)':'var(--accent)'};"></div></div>
            </div>
          </td>
          <td style="text-align:right;"><span class="tag ${cls}">${label}</span></td>
          <td>${dv.repRow.url ? `<a href="${dv.repRow.url}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Open</a>` : ''}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

const PLATFORM_DISPLAY_NAME = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook' };
// Platform name stays in the flat neutral pill (see .tag-tiktok etc.) — the view count moved

function platformPill(row){

// Long hashtag-heavy captions blow up a row's height if shown in full by default — truncate to
// a fixed length with a "more/less" toggle per deliverable (state kept in TC_EXPANDED).
// 24-hour clock, no AM/PM ambiguity — matters here because matching crossposts often comes
// down to "these are 3 minutes apart", which AM/PM makes annoying to eyeball.
function fmtTime24(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  return `${fmtDate(iso.slice(0,10))} · ${fmtTime24(iso)}`;
}
// Groups a brand's still-unmerged videos into "this is probably one crosspost" clusters by how
// close together they were actually posted (not discovered — see fmtDateTime above) — real data
// shows Robbe crossposts within minutes, so a few hours is a generous, still-safe window given
// he posts 9-13 videos/day (unrelated posts land hours apart, not minutes). This only *suggests*
// a grouping for the Compare view's "Link these" shortcut — nothing merges without going through
// the same review-and-confirm modal as a manual selection.
const COMPARE_CLUSTER_WINDOW_MS = 3 * 60 * 60 * 1000;
function clusterForCompare(brandName){
  if(!TRACKED_CONTENT_DATA) return [];
  const rows = TRACKED_CONTENT_DATA.filter(r => !r.group_id && !r.excluded && (r.brands?.name || 'Unassigned (automated)') === brandName && r.posted_at);
  const sorted = [...rows].sort((a,b) => new Date(a.posted_at) - new Date(b.posted_at));
  const clusters = [];
  sorted.forEach(r => {
    const last = clusters[clusters.length - 1];
    if(last && !last.byPlatform[r.platform] && (new Date(r.posted_at) - new Date(last.anchorTime)) <= COMPARE_CLUSTER_WINDOW_MS){
      last.byPlatform[r.platform] = r;
      last.rows.push(r);
    } else {
      clusters.push({ anchorTime: r.posted_at, byPlatform: { [r.platform]: r }, rows: [r] });
    }
  });
  return clusters;
}
// Every brand's clusters at once, each tagged with which brand it came from — this is what
// the Compare view shows by default (nothing picked in the brand dropdown), since "which
// brands have unmerged crossposts worth checking" is exactly the thing you'd otherwise have to
// click through every brand one at a time to discover. The dropdown narrows this down to one
// brand; it was never required to see anything here to begin with.
function clusterForCompareAll(){
  if(!TRACKED_CONTENT_DATA) return [];
  const names = [...new Set(
    TRACKED_CONTENT_DATA.filter(r => !r.group_id && !r.excluded && r.posted_at).map(r => r.brands?.name || 'Unassigned (automated)')
  )];
  return names.flatMap(name => clusterForCompare(name).map(c => ({ ...c, brandName: name })));
}
function renderCompareView(brandName, searchQ){
  let clusters = brandName ? clusterForCompare(brandName).map(c => ({...c, brandName})) : clusterForCompareAll();
  if(searchQ) clusters = clusters.filter(c => c.rows.some(r => (r.title||'').toLowerCase().includes(searchQ.toLowerCase())));
  if(clusters.length===0){
    return `<div class="table-wrap"><div class="empty">${brandName ? `Nothing unmerged for ${escapeHtml(brandName)} right now — everything's already linked or there's no overlap yet.` : `Nothing unmerged right now, across any brand — everything's already linked or there's no overlap yet.`}</div></div>`;
  }
  // only re-sorted (newest-first) for the all-brands view, which interleaves multiple brands'
  // otherwise-independent cluster lists and needs a consistent global order to be scannable —
  // the single-brand view's existing oldest-first order is untouched
  if(!brandName) clusters = [...clusters].sort((a,b) => new Date(b.anchorTime) - new Date(a.anchorTime));
  const platforms = [...new Set(clusters.flatMap(c=>Object.keys(c.byPlatform)))].sort();
  return `<div class="table-wrap" style="overflow-x:auto;"><table>
    <thead><tr>${brandName?'':'<th>Brand</th>'}<th>Posted</th>${platforms.map(p=>`<th>${p.toUpperCase()}</th>`).join('')}<th></th></tr></thead>
    <tbody>
      ${clusters.map(c => `<tr>
        ${brandName?'':`<td style="white-space:nowrap;">${escapeHtml(c.brandName)}</td>`}
        <td class="mono" style="white-space:nowrap;">${fmtDateTime(c.anchorTime)}</td>
        ${platforms.map(p => {
          const r = c.byPlatform[p];
          if(!r) return `<td><span style="color:var(--text-faint)">—</span></td>`;
          const req = r.view_requirement_override != null ? Number(r.view_requirement_override) : (r.brands ? Number(r.brands.view_requirement) : null);
          return `<td>
            <div style="display:flex; gap:8px; align-items:center;">
              ${r.thumbnail_url ? `<img src="${r.thumbnail_url}" alt="" style="width:32px; height:32px; object-fit:cover; border-radius:5px; flex-shrink:0;" />` : `<div style="width:32px; height:32px; border-radius:5px; background:var(--surface); flex-shrink:0;"></div>`}
              <div style="min-width:0;">
                <div class="mono" style="font-size:12px;">${(r.view_count||0).toLocaleString()}${req?` / ${req.toLocaleString()}`:''}</div>
                <div class="hint">${fmtTime24(r.posted_at)}${r.url ? ` · <a href="${r.url}" target="_blank" rel="noopener">open</a>` : ''}</div>
              </div>
            </div>
          </td>`;
        }).join('')}
        <td>${c.rows.length>=2 ? `<button class="btn btn-primary btn-sm" data-link-cluster="${c.rows.map(r=>r.id).join(',')}" type="button">Link these</button>` : `<span class="hint">only 1 platform</span>`}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function renderTitleCell(dv){
  // A character-count threshold isn't reliable here — emoji/hashtag-heavy captions pack onto
  // lines poorly and can still wrap to 3 lines well under any safe length cutoff. So every
  // title unconditionally gets a hard 2-line clamp (guarantees the row height regardless of
  // content), and a post-render pass (see clampTrackedTitles()) measures which ones actually
  // got cut off and only then reveals a "Show more" toggle for that specific row — never a
  // dead button that expands nothing.
  const full = dv.title || 'Untitled';
  const suffix = dv.grouped ? ` <span class="hint">(${dv.rows.length} platforms merged)</span>` : '';
  const expanded = TC_EXPANDED.has(dv.key);
  const toggleBtn = `<button type="button" data-toggle-title="${dv.key}" style="display:none; background:none; border:none; padding:0; color:var(--accent); font-size:11px; cursor:pointer; text-decoration:underline; margin-top:2px;">${expanded?'Show less':'Show more'}</button>`;
  if(expanded) return `${escapeHtml(full)}${suffix}<div>${toggleBtn}</div>`;
  return `<div class="tc-title-clamp" data-clamp-key="${dv.key}" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3;">${escapeHtml(full)}</div>${suffix}<div>${toggleBtn}</div>`;
}
// After the Tracked Content table paints, measure which clamped titles actually got cut off
// (scrollHeight > clientHeight) and only then reveal that row's "Show more" toggle — a title
// that fits in 2 lines never shows a button that would expand to reveal nothing new.
function clampTrackedTitles(){
  document.querySelectorAll('.tc-title-clamp').forEach(el => {
    if(el.scrollHeight > el.clientHeight + 1){
      const btn = el.parentElement.querySelector(`[data-toggle-title="${el.dataset.clampKey}"]`);
      if(btn) btn.style.display = 'inline-block';
    }
  });
}
// Finds which deliverable (possibly a merged group) a specific tracked_videos row id belongs to
// — an alert only ever knows a single row's id (see syncAlertsLog's hit/stale entries), but
// Tracked Content's table renders one row per *deliverable*, keyed by dv.key (group_id for a
// merged crosspost, the row's own id otherwise).
function findDeliverableKeyForRowId(rowId){
  const dv = getDeliverables().find(d => d.rows.some(r => r.id === rowId));
  return dv ? dv.key : null;
}
// Scrolls the deliverable flagged by HIGHLIGHT_DV_KEY into view and briefly flashes it, then
// forgets the key so it only plays once on the landing render — not on every render after (e.g.
// sorting the table, or a later automatic refresh). Mutates the DOM directly rather than going
// through render() again for the same reason the mobile nav drawer does: a class added post-paint
// can actually transition, where anything baked into innerHTML on the render that creates the
// node cannot.
function applyRowHighlight(){
  const key = HIGHLIGHT_DV_KEY;
  HIGHLIGHT_DV_KEY = null;
  const row = document.querySelector(`tr[data-dv-key="${CSS.escape(String(key))}"]`);
  if(!row) return;
  row.scrollIntoView({ block:'center', behavior:'smooth' });
  requestAnimationFrame(() => {
    row.classList.add('row-flash');
    setTimeout(() => row.classList.remove('row-flash'), 2200);
  });
}

function renderTrackedContent(){
  const head = `
    <div class="page-head">
      <div><h2>Tracked Content</h2><div class="sub">Discovered and tracked automatically from each brand's connected account — nothing here is entered by hand. Select 2+ from the same brand to merge a crossposted video into one deliverable.</div></div>
      <div class="head-actions">
        <div class="seg" style="display:inline-flex; border:1px solid var(--border-soft); border-radius:8px; overflow:hidden;">
          <button class="btn btn-sm ${TC_VIEW_MODE==='table'?'btn-primary':'btn-ghost'}" id="tcViewTable" type="button" style="border-radius:0;">Table</button>
          <button class="btn btn-sm ${TC_VIEW_MODE==='compare'?'btn-primary':'btn-ghost'}" id="tcViewCompare" type="button" style="border-radius:0;">Compare platforms</button>
        </div>
        ${MERGE_SELECTED.size>=2 ? `<button class="btn btn-primary" id="openMergeReview" type="button">Merge ${MERGE_SELECTED.size} selected</button>` : ''}
        <button class="btn btn-ghost" id="refreshTrackedContent" type="button" ${TRACKED_CONTENT_LOADING?'disabled':''}>${TRACKED_CONTENT_LOADING?'Refreshing…':'↻ Refresh'}</button>
      </div>
    </div>`;

  if(TRACKED_CONTENT_ERROR){
    return head + `<div class="table-wrap"><div class="empty"><b>Couldn't load tracked content</b>${escapeHtml(TRACKED_CONTENT_ERROR)}</div></div>`;
  }
  if(!TRACKED_CONTENT_DATA){
    return head + `<div class="table-wrap"><div class="empty">Loading…</div></div>`;
  }

  const allDeliverables = getDeliverables();
  const brandNames = [...new Set(TRACKED_CONTENT_DATA.map(r=>r.brands?.name).filter(Boolean))].sort();
  const platformsPresent = [...new Set(TRACKED_CONTENT_DATA.map(r=>r.platform).filter(Boolean))].sort();

  const deliverables = allDeliverables.filter(dv => {
    if(TC_FILTER.brand && dv.brandName !== TC_FILTER.brand) return false;
    if(TC_FILTER.platform && !dv.rows.some(r=>r.platform===TC_FILTER.platform)) return false;
    if(TC_FILTER.status){
      if(TC_FILTER.status==='excluded' && !dv.excluded) return false;
      if(TC_FILTER.status!=='excluded' && (dv.excluded || dv.status!==TC_FILTER.status)) return false;
    }
    if(TC_FILTER.q && !(dv.title||'').toLowerCase().includes(TC_FILTER.q.toLowerCase())) return false;
    return true;
  });
  // newest posted first, not newest discovered — a whole backlog scouted in one run all shares
  // the same discovered_at, so that order is meaningless; postedAt is when it actually went out
  deliverables.sort((a,b) => (b.postedAt||'').localeCompare(a.postedAt||''));

  const isCompare = TC_VIEW_MODE === 'compare';
  const filterBar = `
    <div class="filter-bar">
      <select id="tcBrand"><option value="">All brands</option>${brandNames.map(n=>`<option value="${escapeHtml(n)}" ${TC_FILTER.brand===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>
      ${!isCompare ? `
      <select id="tcPlatform"><option value="">All platforms</option>${platformsPresent.map(p=>`<option value="${p}" ${TC_FILTER.platform===p?'selected':''}>${p.toUpperCase()}</option>`).join('')}</select>
      <select id="tcStatus">
        <option value="" ${!TC_FILTER.status?'selected':''}>All statuses</option>
        <option value="hit" ${TC_FILTER.status==='hit'?'selected':''}>Hit</option>
        <option value="tracking" ${TC_FILTER.status==='tracking'?'selected':''}>Tracking</option>
        <option value="expired" ${TC_FILTER.status==='expired'?'selected':''}>Expired</option>
        <option value="missing" ${TC_FILTER.status==='missing'?'selected':''}>Missing</option>
        <option value="excluded" ${TC_FILTER.status==='excluded'?'selected':''}>Excluded</option>
      </select>` : ''}
      <input type="text" id="tcSearch" placeholder="Search title…" value="${escapeHtml(TC_FILTER.q)}" />
      ${(TC_FILTER.brand||TC_FILTER.platform||TC_FILTER.status||TC_FILTER.q) ? `<button type="button" class="btn btn-ghost btn-sm" id="tcClearFilters">Clear filters</button>` : ''}
    </div>`;

  if(isCompare){
    return head + filterBar + `<div style="margin-top:16px;">` + renderCompareView(TC_FILTER.brand, TC_FILTER.q) + `</div>`;
  }

  const counted = deliverables.filter(d=>!d.excluded);
  const hit = counted.filter(d=>d.status==='hit');
  const tracking = counted.filter(d=>d.status==='tracking');
  const expired = counted.filter(d=>d.status==='expired');
  const missing = counted.filter(d=>d.status==='missing');
  const excludedCount = deliverables.length - counted.length;
  const totalEarned = hit.reduce((s,d)=> s + d.payAmount, 0);
  const totalPending = tracking.reduce((s,d)=> s + d.payAmount, 0);

  return head + filterBar + `
    <div class="grid grid-cards" style="margin:16px 0 20px;">
      <div class="card"><div class="label">Earned — automatic</div><div class="big mono fx-green">${money(totalEarned)}</div><div class="foot">${hit.length} deliverable${hit.length===1?'':'s'} hit its requirement</div></div>
      <div class="card"><div class="label">Pending</div><div class="big mono" style="color:var(--text-dim)">${money(totalPending)}</div><div class="foot">${tracking.length} still tracking</div></div>

    <div class="table-wrap" style="overflow-x:auto;"><table>
      <thead><tr><th></th><th></th><th>Brand</th><th style="min-width:150px;">Platform(s) &amp; views</th><th>Title</th><th>Status</th><th>Payout</th><th>Posted</th><th></th></tr></thead>
      <tbody>

          return `<tr data-dv-key="${escapeHtml(String(dv.key))}" ${dv.excluded?'style="opacity:.5;"':''}>
            <td><input type="checkbox" class="checkbox" data-merge-check-ids="${allIds.join(',')}" ${allSelected?'checked':''} title="${dv.grouped ? 'Select this already-merged deliverable to add another platform to it' : 'Select to merge with another platform'}" /></td>
            <td>${dv.thumbnail ? `<img src="${dv.thumbnail}" alt="" style="width:40px; height:40px; object-fit:cover; border-radius:6px; display:block;" />` : `<div style="width:40px; height:40px; border-radius:6px; background:var(--surface);"></div>`}</td>
            <td>${dv.brand ? escapeHtml(dv.brand.name) : '<span style="color:var(--text-faint)">—</span>'}</td>
            <td>${dv.rows.map(platformPill).join('')}</td>
            <td style="max-width:260px;">${renderTitleCell(dv)}</td>
            <td>${dv.excluded ? '<span class="tag tag-neutral">Excluded</span>' : dv.status==='hit' ? '<span class="tag tag-good">Hit ✓</span>' : dv.status==='expired' ? '<span class="tag tag-neutral">Expired</span>' : dv.status==='missing' ? '<span class="tag tag-danger" title="No longer showing up on the platform — deleted, archived, or made private before it hit its requirement">Missing</span>' : '<span class="tag tag-warn">Tracking</span>'}</td>
            <td class="mono">${dv.status==='hit' && !dv.excluded ? money(dv.payAmount) : `<span style="color:var(--text-faint)">${money(dv.payAmount)}${dv.excluded?'':' pending'}</span>`}</td>
            <td class="mono">${dv.postedAt ? fmtDate(dv.postedAt.slice(0,10)) : '—'}</td>
            <td style="white-space:nowrap;">
              ${!dv.grouped && rep.url ? `<a href="${rep.url}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">View</a>` : ''}
              <button class="btn btn-ghost btn-sm" data-edit-tracked-video="${rep.id}" type="button">Edit</button>
              ${dv.grouped ? `<button class="btn btn-ghost btn-sm" data-ungroup="${dv.key}" type="button">Ungroup</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`}
  `;
}
