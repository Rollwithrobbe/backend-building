/* ---------------- content analytics ----------------
   Views, hit rate, near-miss/breakout detection, and a hashtag ranking are all real — built off
   the same getDeliverables()/TRACKED_CONTENT_DATA everything else reads. Likes/comments/shares/
   engagement rate are NOT real yet (none of the three scout jobs capture them — see the "soon"
   dots) and show as "—", not a fabricated number. Trending/breakout and the per-video growth
   curve depend on the EXPERIMENTAL view_snapshots table having 2+ days of history for a video —
   gracefully absent (not broken) until then, same as the brand-breakdown sparkline already is. */
let CA_STATE = { range:'30', nearMiss:false, trending:false, brand:'all', dateGroup:'overall', sort:'top', tableExpanded:false };
const CA_RANGES = [ {id:'7',label:'7d'}, {id:'30',label:'30d'}, {id:'90',label:'90d'}, {id:'9999',label:'All time'} ];

// Flat solid-fill glyphs (no stroke/outline, no gradient shading) replacing 🔥/🎯 — those render
// as full-color glossy OS emoji, not a clean flat icon. iconTarget uses currentColor (it's meant
// to blend into whatever it sits in); iconFlame is hardcoded fire-orange instead — a flame that
// inherited each context's own muted color (chip gray, tag-good green, section-title gray) never
// actually read as fire, which was the whole point of it over a plain 🔥.
function iconFlame(size){
  size = size || 12;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="#FF6B35" style="flex-shrink:0; vertical-align:-2px;"><path d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.176 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248zM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.545 3.75 3.75 0 0 1 3.255 3.717z"/></svg>`;
}
function iconTarget(size){
  size = size || 12;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0; vertical-align:-2px;"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>`;
}
// Real platform brand colors/gradients — deliberately different scope from .tag-tiktok's flat
// neutral gray (that's for a label everywhere else in the app; this chart is the one place
// telling three overlapping lines apart at a glance is worth spending brand color on).
const CA_PLATFORM_COLOR = { tiktok:'#FE2C55', instagram:'#E1306C', youtube:'#FF0000' };
const CA_PLATFORM_GRADIENT = {
  tiktok: ['#25F4EE', '#FE2C55'],
  instagram: ['#833AB4', '#E1306C', '#F77737', '#FCAF45'],
  youtube: ['#FF0000', '#FF0000'],
};
function caPlatformPillHtml(plat){
  return `<span class="plat-pill plat-pill-${plat}"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">${plat==='tiktok'?'<path d="M16.6 3c.4 2.2 1.9 3.9 4.4 4.2v3.1c-1.6 0-3.1-.5-4.4-1.4v6.4a5.3 5.3 0 1 1-5.3-5.3c.3 0 .6 0 .9.1v3.2a2.1 2.1 0 1 0 1.5 2V3h2.9z"/>':plat==='instagram'?'<path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9z"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>':'<path d="M6 4l14 8-14 8V4z"/>'}</svg>${PLATFORM_DISPLAY_NAME[plat]||plat}</span>`;
}

// ---- data derivation ----
// Same two-pass resolution brandComparisonRows() uses: a real DATA.brands match first (gets a
// local id + the color already picked for that brand), a consistent fallback color per brand
// NAME otherwise (never re-derived per row, so the same unlinked brand always gets the same
// color within one render).
function caAllDeliverables(){
  if(!TRACKED_CONTENT_DATA) return [];
  const bySupabaseId = new Map(DATA.brands.filter(b=>b.supabaseBrandId).map(b=>[b.supabaseBrandId, b]));
  const fallbackColors = new Map();
  let fallbackIdx = 0;
  return getDeliverables().filter(dv => !dv.excluded).map(dv => {
    const rep = dv.rows[0];
    const local = bySupabaseId.get(rep.brand_id);
    let brandLocalId, brandColor;
    if(local){ brandLocalId = local.id; brandColor = local.color; }
    else {
      brandLocalId = 'name:'+dv.brandName;
      if(!fallbackColors.has(dv.brandName)) fallbackColors.set(dv.brandName, BRAND_TABLE_FALLBACK_COLORS[fallbackIdx++ % BRAND_TABLE_FALLBACK_COLORS.length]);
      brandColor = fallbackColors.get(dv.brandName);
    }
    return { ...dv, brandLocalId, brandColor, views: dv.rows.reduce((s,r)=>s+(Number(r.view_count)||0),0), tags: caExtractTags(dv.title) };
  });
}
function caExtractTags(title){
  if(!title) return [];
  const matches = title.match(/#[a-z0-9_]+/gi) || [];
  return [...new Set(matches.map(t => t.slice(1).toLowerCase()))];
}
function caRowRequirement(row){
  return row.view_requirement_override != null ? Number(row.view_requirement_override) : Number(row.brands?.view_requirement || 0);
}
// "how close to hitting" — the best (highest) views/requirement ratio among this deliverable's
// still-tracking rows. Real hit status is decided per-row, per-platform (see getDeliverables()),
// not by summing views across platforms against one bar — this mirrors that same logic rather
// than inventing a combined-total threshold the actual tracking system doesn't use.
function caBestRatio(dv){
  const tracking = dv.rows.filter(r => !r.excluded && r.status==='tracking');
  if(tracking.length===0) return null;
  const ratios = tracking.map(r => { const req = caRowRequirement(r); return req > 0 ? (Number(r.view_count)||0)/req : 0; });
  return Math.max(...ratios);
}
function caIsNearMiss(dv){
  if(dv.status !== 'tracking') return false;
  const ratio = caBestRatio(dv);
  return ratio != null && ratio >= 0.8 && ratio < 1;
}
// Views gained since this specific video's last snapshot before its most recent one — real,
// from the daily view_snapshots history, but only ever as precise as "since last check", not a
// literal 48h window (checks run roughly daily, not on a fixed clock). null with fewer than 2
// snapshots yet, which is expected for most videos until the table has more history behind it.
function caVideoVelocity(trackedVideoId){
  if(!VIEW_SNAPSHOTS_DATA) return null;
  const rows = VIEW_SNAPSHOTS_DATA.filter(s => s.tracked_video_id === trackedVideoId).sort((a,b)=>a.checked_at.localeCompare(b.checked_at));
  if(rows.length < 2) return null;
  return Math.max(0, (Number(rows[rows.length-1].view_count)||0) - (Number(rows[rows.length-2].view_count)||0));
}
function caDeliverableVelocity(dv){
  const vals = dv.rows.map(r => caVideoVelocity(r.id)).filter(v => v != null);
  return vals.length ? Math.max(...vals) : null;
}
// Per-brand average velocity across whatever videos currently have enough snapshot history —
// the baseline a single video's own velocity gets compared against to flag a real breakout,
// same "relative to this brand's own normal pace" idea as the brand-comparison efficiency work.
function caBrandVelocityMap(allDv){
  const byBrand = new Map();
  allDv.forEach(dv => {
    const v = caDeliverableVelocity(dv);
    if(v == null) return;
    if(!byBrand.has(dv.brandLocalId)) byBrand.set(dv.brandLocalId, []);
    byBrand.get(dv.brandLocalId).push(v);
  });
  const avgMap = new Map();
  byBrand.forEach((vals, brandLocalId) => avgMap.set(brandLocalId, vals.reduce((a,b)=>a+b,0)/vals.length));
  return avgMap;
}
function caBreakoutRatio(dv, velocityByBrand){
  const v = caDeliverableVelocity(dv);
  const avg = velocityByBrand.get(dv.brandLocalId);
  if(v == null || !avg) return null;
  return v / avg;
}
function caIsTrending(dv, velocityByBrand){
  const ratio = caBreakoutRatio(dv, velocityByBrand);
  return ratio != null && ratio >= 2;
}
// Real daily total across every currently-tracked video on that platform (every brand, not just
// one) — same day-bucketing brandPlatformTrend() already uses for the brand-breakdown sparkline,
// just not scoped to a single brand. Shape, not exact "new views that day" — a snapshot is each
// video's running view_count on the day it was checked, so this is "total reach as measured that
// day," same honest framing view_snapshots already carries everywhere else it's used.
function caPlatformDailySeries(platform){
  if(!VIEW_SNAPSHOTS_DATA) return [];
  const byDay = {};
  VIEW_SNAPSHOTS_DATA.forEach(s => {
    if(s.platform !== platform) return;
    const day = s.checked_at.slice(0,10);
    byDay[day] = (byDay[day]||0) + (Number(s.view_count)||0);
  });
  return Object.keys(byDay).sort().map(day => ({ day, value: byDay[day] }));
}
function caVideoDailySeries(trackedVideoId){
  if(!VIEW_SNAPSHOTS_DATA) return [];
  return VIEW_SNAPSHOTS_DATA.filter(s => s.tracked_video_id === trackedVideoId)
    .sort((a,b)=>a.checked_at.localeCompare(b.checked_at))
    .map(s => ({ day: s.checked_at.slice(0,10), value: Number(s.view_count)||0 }));
}
function caRangeCutoff(){ return CA_STATE.range==='9999' ? 0 : Date.now() - Number(CA_STATE.range)*86400000; }
function caPassesPageFilters(dv, velocityByBrand){
  if(dv.postedAt && new Date(dv.postedAt).getTime() < caRangeCutoff()) return false;
  if(CA_STATE.nearMiss && !caIsNearMiss(dv)) return false;
  if(CA_STATE.trending && !caIsTrending(dv, velocityByBrand)) return false;
  return true;
}
function caPassesTableFilters(dv, velocityByBrand){
  if(!caPassesPageFilters(dv, velocityByBrand)) return false;
  if(CA_STATE.brand !== 'all' && dv.brandLocalId !== CA_STATE.brand) return false;
  if(CA_STATE.dateGroup !== 'overall'){
    const days = CA_STATE.dateGroup === 'weekly' ? 7 : 30;
    if(!dv.postedAt || (Date.now() - new Date(dv.postedAt).getTime())/86400000 > days) return false;
  }
  return true;
}

// ---- rendering ----
function renderContentAnalytics(){
  if(TRACKED_CONTENT_ERROR){
    return `<div class="page-head"><div><h2>Content Analytics</h2></div></div><div class="table-wrap"><div class="empty"><b>Couldn't load</b>${escapeHtml(TRACKED_CONTENT_ERROR)}</div></div>`;
  }
  if(!TRACKED_CONTENT_DATA){
    return `<div class="page-head"><div><h2>Content Analytics</h2></div></div><div class="table-wrap"><div class="empty">Loading…</div></div>`;
  }
  const allDv = caAllDeliverables();
  const velocityByBrand = caBrandVelocityMap(allDv);
  const rows = allDv.filter(dv => caPassesPageFilters(dv, velocityByBrand));

  const totalV = rows.reduce((s,dv)=>s+dv.views,0);
  const hitCount = rows.filter(dv=>dv.status==='hit').length;
  const hitRate = rows.length ? (hitCount/rows.length*100) : 0;
  const byPlat = {};
  rows.forEach(dv => dv.rows.forEach(r => { byPlat[r.platform] = (byPlat[r.platform]||0) + (Number(r.view_count)||0); }));
  const bestPlat = Object.entries(byPlat).sort((a,b)=>b[1]-a[1])[0];

  return `
    <div class="page-head">
      <div><h2>Content Analytics</h2><div class="sub">Every published post, across every platform, in one place.</div></div>
    </div>

    <div class="range-pills">
      ${CA_RANGES.map(r=>`<button class="range-pill ${CA_STATE.range===r.id?'active':''}" data-ca-range="${r.id}">${r.label}</button>`).join('')}
      <span style="flex:1;"></span>
      <button class="ca-chip ${CA_STATE.nearMiss?'active':''}" id="caChipNearMiss">${iconTarget(12)} Near miss</button>
      <button class="ca-chip ${CA_STATE.trending?'active':''}" id="caChipTrending">${iconFlame(12)} Trending</button>
      <button class="clear-filters" id="caClearFilters" style="font-size:11.5px; color:var(--text-faint); background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:2px;">Clear filters</button>
    </div>

    <div class="grid grid-cards" style="margin-bottom:20px;">
      <div class="card"><div class="label">Total views</div><div class="big mono">${(totalV).toLocaleString()}</div><div class="foot">${rows.length} post${rows.length===1?'':'s'} in range</div></div>
      <div class="card"><div class="label">Hit rate</div><div class="big mono">${hitRate.toFixed(0)}%</div><div class="foot">${hitCount} of ${rows.length} crossed requirement</div></div>
      <div class="card"><div class="label">Best platform</div><div class="big">${bestPlat?(PLATFORM_DISPLAY_NAME[bestPlat[0]]||bestPlat[0]):'—'}</div><div class="foot">${bestPlat?bestPlat[1].toLocaleString()+' views in range':'No data in range'}</div></div>
    </div>

    <div class="section-title" style="margin-top:0; display:flex; align-items:center; gap:8px;">${iconFlame(14)}Breaking out right now</div>
    ${caBreakoutRowHtml(rows, velocityByBrand)}

    ${caChartCardHtml()}

    ${caTableSectionHtml(allDv, velocityByBrand)}

    ${caHashtagCardHtml(rows)}
  `;
}

function caBreakoutRowHtml(rows, velocityByBrand){
  const trending = rows.filter(dv => caIsTrending(dv, velocityByBrand))
    .map(dv => ({ dv, ratio: caBreakoutRatio(dv, velocityByBrand) }))
    .sort((a,b)=>b.ratio-a.ratio).slice(0,3);
  if(trending.length===0){
    return `<div class="ca-breakout-row"><div style="font-size:12.5px; color:var(--text-faint); padding:14px 4px;">Nothing breaking out right now — needs at least 2 days of view history on a video, and this only shows a handful of days in so far.</div></div>`;
  }
  return `<div class="ca-breakout-row">${trending.map(({dv,ratio}) => `
    <div class="ca-breakout-card" data-open-ca-video="${escapeHtml(String(dv.key))}">
      <div class="ca-breakout-flame">${iconFlame(22)}</div>
      <div style="min-width:0;">
        <div class="ca-breakout-title">${escapeHtml((dv.title||'Untitled').length>46?dv.title.slice(0,46)+'…':(dv.title||'Untitled'))}</div>
        <div class="ca-breakout-stat">${ratio.toFixed(1)}×</div>
        <div class="ca-breakout-sub">${escapeHtml(dv.brandName)}'s average pace</div>
      </div>
    </div>`).join('')}</div>`;
}

function caChartCardHtml(){
  const platforms = ['tiktok','instagram','youtube'];
  const series = platforms.map(p => ({ platform:p, points: caPlatformDailySeries(p) }));
  // Matches caRenderChart()'s own 2-point minimum to actually draw a line (each platform on its
  // own axis now — see the comment there).
  const shown = series.filter(s => s.points.length >= 2);
  const pending = series.filter(s => s.points.length > 0 && s.points.length < 2);
  const pendingNote = pending.length ? ` Still building history for ${pending.map(s=>PLATFORM_DISPLAY_NAME[s.platform]).join(' and ')} — a couple more days of scouting runs and it'll show up here too.` : '';
  return `<div class="chart-card">
    <div class="chart-head">
      <div class="label" style="margin:0;">Views over time — by platform</div>
      <div class="chart-legend" id="caChartLegend">${platforms.map(p=>`<div class="chart-legend-item">${caPlatformPillHtml(p)}</div>`).join('')}</div>
    </div>
    ${shown.length>0
      ? `<svg id="caChartSvg" viewBox="0 0 980 190" width="100%" height="190" preserveAspectRatio="none" class="chart-enter" style="display:block; overflow:visible; cursor:crosshair;"></svg><div class="hint" style="margin-top:8px;">From view_snapshots — daily totals across every tracked video on that platform, shape not exact new-views-that-day. Hover a point to see which platform is which.${pendingNote}</div>`
      : `<div class="empty" style="padding:34px 10px;">Not enough view history yet — this chart needs a few days of the daily view_snapshots table to have something to draw.</div>`}
  </div>`;
}

function caTableSectionHtml(allDv, velocityByBrand){
  const brandOptions = [...new Map(allDv.map(dv => [dv.brandLocalId, dv])).values()]
    .map(dv => ({ key: dv.brandLocalId, label: dv.brandName }))
    .sort((a,b)=>a.label.localeCompare(b.label));
  const rows = allDv.filter(dv => caPassesTableFilters(dv, velocityByBrand))
    .sort((a,b) => CA_STATE.sort==='top' ? b.views-a.views : a.views-b.views);
  // Weekly/Monthly/Overall can easily turn into hundreds of rows — collapsed to the top 9 by
  // default with a "show more" row standing in for the 10th, same idea as any other
  // load-more list, rather than dumping the whole filtered set on screen at once.
  const CA_PAGE_SIZE = 6;

function caHashtagCardHtml(rows){

    byTag[t].count += 1;

  const parts = Object.entries(byTag).map(([tag,d]) => ({ tag, avg: d.views/d.count, count:d.count })).sort((a,b)=>b.avg-a.avg).slice(0,6);
  return `<div class="chart-card" style="margin-bottom:0;">

    ${parts.length===0 ? `<div style="font-size:12px; color:var(--text-faint); padding:10px 0;">No hashtags found in the titles/captions in range.</div>` : parts.map((p,i) => {
      const maxV = parts[0].avg;
      return `<div class="ca-rank-row">
        <div class="ca-rank-idx">${i+1}</div>

// ---- chart hover: which line is which ----
let CA_CHART_SERIES = null; // {platforms(shown), byPlatform: {tiktok:[{x,y,day,value}], ...}, W,H,pad,topPad,botPad}
// Each platform draws on its OWN index axis, stretched to fill the full chart width, rather than
// all three sharing one calendar-day axis. With view_snapshots this young, platforms rarely have
// the same number of days yet — forcing a shared axis meant a platform with fewer days drew as a
// short stub stranded to one side (looked broken), or got hidden outright once that stub got
// filtered out (looked empty). Own-axis-per-line means every platform with 2+ days shows a full
// line across the whole card, at the cost of the crosshair no longer meaning "the same calendar
// day" for all three at once — worth it for always having something to look at instead of one
// lone line while the others build up history. The tooltip shows each platform's own real date
// next to its value specifically because of that tradeoff.
// Linear interpolation between the two real points either side of frac — without this, moving
// the mouse across only 2-3 real data points makes the number jump in one or two hard steps
// instead of climbing smoothly, and the guide dot snaps between fixed spots instead of gliding
// along the line. exact:true only when frac lands (near enough) on an actual recorded point —
// everything in between is a straight-line estimate between two real days, marked with "~" in
// the tooltip so it never reads as a third real data point that doesn't exist.
function caInterpolate(arr, frac){
  const n = arr.length;
  if(n===1) return { ...arr[0], exact:true };
  const pos = Math.max(0, Math.min(n-1, frac*(n-1)));
  const i0 = Math.min(n-2, Math.floor(pos));
  const i1 = i0+1;
  const t = pos - i0;
  const p0 = arr[i0], p1 = arr[i1];
  return {
    x: p0.x + (p1.x-p0.x)*t,
    y: p0.y + (p1.y-p0.y)*t,
    value: p0.value + (p1.value-p0.value)*t,
    day: t < 0.5 ? p0.day : p1.day,
    exact: t < 0.02 || t > 0.98,
  };
}
function caShowChartTooltip(frac, clientX, clientY){
  if(!CA_CHART_SERIES) return;
  const tip = document.getElementById('chartTooltip');
  if(!tip) return;
  const { platforms, byPlatform } = CA_CHART_SERIES;
  const atCursor = platforms
    .map(p => ({ p, pt: caInterpolate(byPlatform[p], frac) }))
    .sort((a,b) => b.pt.value - a.pt.value); // highest first, not a fixed platform order
  let html = `<div class="ct-total">Views</div>`;
  atCursor.forEach(({p, pt}) => {
    const val = Math.round(pt.value).toLocaleString();
    html += `<div class="ct-row"><span>${caPlatformPillHtml(p)}</span><span class="ct-amt">${escapeHtml(fmtDate(pt.day))} · ${pt.exact?'':'~'}${val}</span></div>`;
  });
  tip.innerHTML = html;
  tip.classList.add('show');
  caPositionChartTooltip(clientX, clientY);
}
// Positions above the cursor and clamped to the chart card's own bounds, not just the viewport —
// the shared positionChartTooltip() only guards viewport edges and defaults to below-right of the
// cursor, which let this tooltip spill out past the bottom of the card into the content below it
// whenever the cursor was in the lower half of the chart.
function caPositionChartTooltip(clientX, clientY){
  const tip = document.getElementById('chartTooltip');
  const card = document.getElementById('caChartSvg')?.closest('.chart-card');
  if(!tip || !card) return;
  const cardRect = card.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  let left = clientX - tipRect.width/2;
  let top = clientY - tipRect.height - 16;
  left = Math.max(cardRect.left+6, Math.min(cardRect.right-tipRect.width-6, left));
  top = Math.max(cardRect.top+6, top);
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function caMoveChartHoverGuide(frac){
  const guide = document.getElementById('caChartHoverGuide');
  if(!guide || !CA_CHART_SERIES) return;
  const { platforms, byPlatform, pad, W } = CA_CHART_SERIES;
  guide.style.transform = `translateX(${(pad + frac*(W-2*pad)).toFixed(1)}px)`;
  platforms.forEach(p => {
    const dot = guide.querySelector(`[data-guide-dot="${p}"]`);
    const pt = caInterpolate(byPlatform[p], frac);
    if(dot && pt){ dot.setAttribute('cy', pt.y.toFixed(1)); dot.setAttribute('cx', pt.x.toFixed(1)); dot.style.display = ''; }
  });
  guide.classList.add('show');
}
function caHideChartHoverGuide(){
  const guide = document.getElementById('caChartHoverGuide');
  if(guide) guide.classList.remove('show');
}
function caRenderChart(){
  const svg = document.getElementById('caChartSvg');
  if(!svg) return;
  const allPlatforms = ['tiktok','instagram','youtube'];
  const W=980, H=190, pad=6, topPad=10, botPad=18;
  const rawByPlatform = {};
  allPlatforms.forEach(p => rawByPlatform[p] = caPlatformDailySeries(p));
  const maxV = Math.max(1, ...allPlatforms.flatMap(p => rawByPlatform[p].map(x=>x.value))) * 1.08;
  // 2+ points needed to draw an actual line — a single day is just a dot with nothing to compare
  // it to, same "not enough yet" threshold sparklineSvg() already uses elsewhere in the app.
  const platforms = allPlatforms.filter(p => rawByPlatform[p].length >= 2);
  const byPlatform = {};
  platforms.forEach(p => {
    const arr = rawByPlatform[p];
    const n = arr.length;
    byPlatform[p] = arr.map((d,i) => ({
      x: pad + (n>1 ? (i/(n-1))*(W-2*pad) : 0),
      y: topPad + (H-topPad-botPad)*(1 - d.value/maxV),
      day: d.day, value: d.value,
    }));
  });
  CA_CHART_SERIES = { platforms, byPlatform, W, H, pad, topPad, botPad };
  if(platforms.length===0) return;

  let html = '<defs>';
  platforms.forEach(p => {
    const stops = CA_PLATFORM_GRADIENT[p];
    html += `<linearGradient id="caLineGrad-${p}" x1="0" y1="0" x2="1" y2="0">${stops.map((c,i)=>`<stop offset="${(i/(stops.length-1)*100).toFixed(0)}%" stop-color="${c}"/>`).join('')}</linearGradient>`;
    html += `<linearGradient id="caAreaGrad-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${CA_PLATFORM_COLOR[p]}" stop-opacity="0.30"/><stop offset="100%" stop-color="${CA_PLATFORM_COLOR[p]}" stop-opacity="0"/></linearGradient>`;
    html += `<filter id="caGlow-${p}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${CA_PLATFORM_COLOR[p]}" flood-opacity="0.5"/></filter>`;
  });
  html += '</defs>';
  platforms.forEach((p, si) => {
    const pts = byPlatform[p];
    const linePath = smoothPath(pts);
    const areaPath = `${linePath} L${pts[pts.length-1].x.toFixed(1)},${(H-botPad).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-botPad).toFixed(1)} Z`;
    html += `<path class="chart-area-path" d="${areaPath}" fill="url(#caAreaGrad-${p})" stroke="none" style="animation-delay:${220+si*90}ms"/>`;
    html += `<path class="chart-line-path" pathLength="1" d="${linePath}" fill="none" stroke="url(#caLineGrad-${p})" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" filter="url(#caGlow-${p})" style="animation-delay:${si*130}ms"/>`;
    const last = pts[pts.length-1];
    html += `<circle r="6" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" fill="${CA_PLATFORM_COLOR[p]}" opacity="0.18"/>`;
    html += `<circle class="chart-pt" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3.4" fill="${CA_PLATFORM_COLOR[p]}" stroke="var(--surface)" stroke-width="1.5" style="animation-delay:${750+si*90}ms"/>`;
  });
  html += `<g class="ca-chart-hover-guide" id="caChartHoverGuide">
    <line x1="0" y1="${topPad}" x2="0" y2="${H-botPad}"/>
    ${platforms.map(p=>`<circle data-guide-dot="${p}" r="4.5" fill="${CA_PLATFORM_COLOR[p]}"/>`).join('')}
  </g>`;
  html += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="pointer-events:all;" data-ca-chart-listener/>`;
  svg.innerHTML = html;
  const listener = svg.querySelector('[data-ca-chart-listener]');
  listener.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const localX = (e.clientX - rect.left) / rect.width * W;
    let frac = (localX - pad) / (W - 2*pad);
    if(!Number.isFinite(frac)) frac = 0; // rect.width can be transiently 0 mid-reflow — never let a hover crash
    frac = Math.max(0, Math.min(1, frac));
    caMoveChartHoverGuide(frac);
    caShowChartTooltip(frac, e.clientX, e.clientY);
  });
  listener.addEventListener('mouseleave', () => { caHideChartHoverGuide(); hideChartTooltip(); });
}

function caVideoCurveSvg(series){
  const color = CA_PLATFORM_COLOR.tiktok;
  const W = 516, H = 110, padT = 8, padB = 8;
  const maxV = Math.max(...series.map(s=>s.value), 1) * 1.08;
  const n = series.length;
  const xy = series.map((s,i) => ({ x: n>1 ? (i/(n-1))*W : 0, y: padT + (1 - s.value/maxV) * (H-padT-padB) }));
  const linePath = smoothPath(xy);
  const areaPath = `${linePath} L${W},${H} L0,${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" class="chart-enter" style="display:block; overflow:visible;">
    <defs><linearGradient id="caVideoGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.32"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path class="chart-area-path" d="${areaPath}" fill="url(#caVideoGrad)" stroke="none"/>
    <path class="chart-line-path" pathLength="1" d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1"/>
    <circle class="chart-pt" cx="${xy[n-1].x.toFixed(1)}" cy="${xy[n-1].y.toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="1.5" style="animation-delay:700ms"/>
  </svg>`;
}

function renderViewReqCell(c, stopProp){
  if(!c.viewRequirement) return '<span style="color:var(--text-faint)">—</span>';
  const attrs = stopProp ? 'onclick="event.stopPropagation()"' : '';
  if(c.viewRequirementMet) return `<button class="btn btn-sm btn-primary" data-toggle-req="${c.id}" ${attrs}>Hit ✓</button>`;
  if(isViewRequirementExpired(c)) return `<span class="tag tag-neutral" title="Window passed (${c.viewRequirementWindowDays} days) without hitting ${Number(c.viewRequirement).toLocaleString()} views — written off, no longer counted as pending.">Expired</span>`;
  return `<button class="btn btn-sm btn-ghost" data-toggle-req="${c.id}" ${attrs}>Need ${Number(c.viewRequirement).toLocaleString()}</button>`;
}
function isContentPublished(c){
  return (c.platforms||[]).some(p => p.active && p.status==='published');
}
function renderContent(){

  const filtered = DATA.content.filter(c => {

      </select>
      <select id="contentDateField">

      </select>
      <select id="contentDatePreset">
        <option value="all" ${CONTENT_FILTER.datePreset==='all'?'selected':''}>All dates</option>
        <option value="today" ${CONTENT_FILTER.datePreset==='today'?'selected':''}>Today</option>
        <option value="yesterday" ${CONTENT_FILTER.datePreset==='yesterday'?'selected':''}>Yesterday</option>
        <option value="thisWeek" ${CONTENT_FILTER.datePreset==='thisWeek'?'selected':''}>This week</option>
        <option value="lastWeek" ${CONTENT_FILTER.datePreset==='lastWeek'?'selected':''}>Last week</option>
        <option value="thisMonth" ${CONTENT_FILTER.datePreset==='thisMonth'?'selected':''}>This month</option>
        <option value="custom" ${CONTENT_FILTER.datePreset==='custom'?'selected':''}>Custom range…</option>
      </select>
      ${CONTENT_FILTER.datePreset==='custom' ? `
        <button type="button" class="date-trigger ${CONTENT_FILTER.customStart?'':'empty'}" data-datepicker="contentfilter:start">${CONTENT_FILTER.customStart?fmtDate(CONTENT_FILTER.customStart):'From'}</button>
        <button type="button" class="date-trigger ${CONTENT_FILTER.customEnd?'':'empty'}" data-datepicker="contentfilter:end">${CONTENT_FILTER.customEnd?fmtDate(CONTENT_FILTER.customEnd):'To'}</button>

    ${sorted.length===0 ? emptyState('Nothing in the pipeline', DATA.brands.length? 'Add a video to start tracking it, or check the Published toggle if you expected something here.' : 'Add a brand first, then log content against it.') : renderContentTable(sorted)}

// Shared date-range helper — used by Content's own date filter below.
function presetDateRange(preset, customStart, customEnd){
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59);
  if(preset==='today') return { start:startOfDay(now), end:endOfDay(now) };
  if(preset==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return { start:startOfDay(y), end:endOfDay(y) }; }
  if(preset==='thisWeek'){ const start=new Date(now); start.setDate(now.getDate()-now.getDay()); return { start:startOfDay(start), end:endOfDay(now) }; }
  if(preset==='lastWeek'){ const thisStart=new Date(now); thisStart.setDate(now.getDate()-now.getDay()); const start=new Date(thisStart); start.setDate(start.getDate()-7); const end=new Date(thisStart); end.setDate(end.getDate()-1); return { start:startOfDay(start), end:endOfDay(end) }; }
  if(preset==='thisMonth'){ const start=new Date(now.getFullYear(), now.getMonth(), 1); return { start:startOfDay(start), end:endOfDay(now) }; }
  if(preset==='custom'){
    return {
      start: customStart ? new Date(customStart+'T00:00:00') : null,
      end: customEnd ? new Date(customEnd+'T23:59:59') : null
    };
  }
  return null; // 'all'
}

function isTaskDoneToday(task){
  return task.daily ? !!(task.dailyDone && task.dailyDone[todayISO()]) : !!task.completed;
}
function sortedTasks(){
  return [...DATA.tasks].sort((a,b) => {
    const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if(p !== 0) return p;
    if(a.daily !== b.daily) return a.daily ? -1 : 1;
    return (a.createdAt||'').localeCompare(b.createdAt||'');
  });
}
function completeTask(taskId, viaTimer){
  const task = DATA.tasks.find(x=>x.id===taskId);
  if(!task) return;
  if(task.daily){ task.dailyDone = task.dailyDone || {}; task.dailyDone[todayISO()] = true; }
  else { task.completed = true; }
  saveData();
  if(viaTimer){
    TIMER_DONE_POPUP = { taskTitle: task.title };
    TIMER_ENTER = true;
    playTimerDoneSound();
    tryBrowserNotification(task.title);
  } else {
    showToast('Marked done');
  }
  render();
  TIMER_ENTER = false;
}
function toggleTaskDone(taskId){
  const task = DATA.tasks.find(x=>x.id===taskId);
  if(!task) return;
  if(task.daily){ task.dailyDone = task.dailyDone || {}; const d = todayISO(); task.dailyDone[d] = !task.dailyDone[d]; }
  else { task.completed = !task.completed; }
  saveData(); render();
}
function startTaskTimer(taskId){
  if(TASK_TIMERS[taskId]) return;
  const task = DATA.tasks.find(t=>t.id===taskId);
  const seconds = Math.max(60, (Number(task && task.timerMinutes) || 10) * 60);
  TASK_TIMERS[taskId] = { remaining: seconds };
  TASK_TIMERS[taskId].intervalId = setInterval(() => {
    const t = TASK_TIMERS[taskId];
    if(!t) return;
    t.remaining--;
    updateTimerDisplay(taskId);
    if(t.remaining <= 0){
      clearInterval(t.intervalId);
      delete TASK_TIMERS[taskId];
      completeTask(taskId, true);
    }
  }, 1000);
  render();
}
function cancelTaskTimer(taskId){
  const t = TASK_TIMERS[taskId];
  if(t){ clearInterval(t.intervalId); delete TASK_TIMERS[taskId]; render(); }
}
function updateTimerDisplay(taskId){
  const el = document.querySelector(`[data-timer-display="${taskId}"]`);
  const t = TASK_TIMERS[taskId];
  if(el && t){
    const m = Math.floor(t.remaining/60), s = t.remaining%60;
    el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
}

}

/* ---------------- AI drawer spring ----------------
   Critically-damped-ish spring (slight bounce, per the Apple Design skill's
   "drawer/sheet" preset) driving a compositor-friendly transform instead of
   a CSS transition. Position/velocity persist across renders (the drawer's
   DOM node gets recreated by every render() call, so we re-acquire it each
   frame rather than caching it) so re-opening/closing mid-flight re-targets
   from the live position and velocity instead of snapping — the core
   interruptibility principle: never animate from the target, only from
   whatever's actually on screen right now.
   AI_DRAWER_X: 0 = fully open, 1 = fully closed (off-screen).
------------------------------------------------------------------ */
let AI_DRAWER_X = 1;
let AI_DRAWER_V = 0;
let AI_DRAWER_RAF = null;
function applyDrawerTransform(x){
  const el = document.querySelector('.ai-drawer');
  if(el) el.style.transform = `translateX(${(x*100).toFixed(3)}%)`;
}
function animateDrawerTo(target){
  cancelAnimationFrame(AI_DRAWER_RAF);
  const reduced = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){
    AI_DRAWER_X = target; AI_DRAWER_V = 0;
    applyDrawerTransform(target);
    return;
  }
  const stiffness = 170, damping = 20.8; // damping ratio ~0.8 — a little bounce, since this is a drawer/sheet
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.032); // clamp so a dropped/backgrounded frame can't fling it
    last = now;
    const force = -stiffness * (AI_DRAWER_X - target) - damping * AI_DRAWER_V;
    AI_DRAWER_V += force * dt;
    AI_DRAWER_X += AI_DRAWER_V * dt;
    applyDrawerTransform(AI_DRAWER_X);
    if(Math.abs(AI_DRAWER_X - target) > 0.001 || Math.abs(AI_DRAWER_V) > 0.001){
      AI_DRAWER_RAF = requestAnimationFrame(frame);
    } else {
      AI_DRAWER_X = target; AI_DRAWER_V = 0;
      applyDrawerTransform(target);
    }
  }
  AI_DRAWER_RAF = requestAnimationFrame(frame);
}
function setAIOpen(open){
  AI_OPEN = open;
  render();
  if(open) scrollAiLog();
  animateDrawerTo(open ? 0 : 1);
}
function toggleAI(){ setAIOpen(!AI_OPEN); }

  if(!question || AI_BUSY) return;
  AI_LOG.push({role:'user', text:question});
  if(!AI_SETTINGS.apiKey && !HAS_ARTIFACT_STORAGE){
    AI_LOG.push({role:'assistant', text: 'This is running standalone (outside a Claude conversation), so the built-in connection isn\'t available here. Add your Anthropic API key in Settings (⚙) to use the assistant.'});
    render();
    scrollAiLog();
    return;
  }
  AI_BUSY = true;
  render();
  scrollAiLog();

  const context = {
    brands: DATA.brands.map(b => ({
      id:b.id, name:b.name, status:b.status,
      brief: b.brief ? {
        status: b.brief.status, cadenceType: b.brief.cadenceType, cadenceCount: b.brief.cadenceCount,
        basePay: b.brief.basePay, cpmBonus: b.brief.cpmBonus, viewRequirement: b.brief.viewRequirement,
        viewRequirementWindowDays: b.brief.viewRequirementWindowDays,
        platforms: b.brief.platforms
      } : null,
      totals: brandTotals(b.id)
    })),
    content: DATA.content.map(c => ({
      id:c.id, title:c.title, brand: brandById(c.brandId)?.name || 'Unknown',
      platforms:(c.platforms||[]).filter(p=>p.active).map(p=>({platform:p.id, status:p.status, postDate:p.postDate, views:p.views})),
      viewRequirement:c.viewRequirement, viewRequirementMet:c.viewRequirementMet, viewRequirementWindowDays:c.viewRequirementWindowDays,
      viewRequirementExpired: isViewRequirementExpired(c),
      scheduledDate: c.scheduledDate,
    })),
    payments: DATA.payments.map(p => ({ brand: brandById(p.brandId)?.name || 'Unknown', amount:p.amount, date:p.date })),
    tasks: DATA.tasks.map(t => ({ id:t.id, title:t.title, brand: t.brandId ? (brandById(t.brandId)?.name || 'Unknown') : null, priority:t.priority, daily:t.daily, requiresTimer:t.requiresTimer, doneToday:isTaskDoneToday(t) })),
    today: todayISO(),
  };

  try{
    // Replay prior turns so Claude actually has conversational memory —
    // the earlier bug sent every question as an isolated one-off request.
    const history = AI_LOG
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(0, -1) // drop the question we just pushed above; it's added fresh below with live context
      .slice(-20)   // cap history length to keep payload size sane
      .map(m => ({ role: m.role, content: m.text }));

    const messages = [
      ...history,
      { role:'user', content: `Dashboard data:\n${JSON.stringify(context)}\n\nQuestion: ${question}` }
    ];

    const usingOwnKey = !!AI_SETTINGS.apiKey;
    const fetchHeaders = usingOwnKey
      ? { "Content-Type": "application/json", "x-api-key": AI_SETTINGS.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }
      : { "Content-Type": "application/json" };
    const modelToUse = usingOwnKey ? AI_SETTINGS.model : "claude-sonnet-4-6"; // no-key path uses the artifact's built-in connection, which is pinned to this model

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: fetchHeaders,
      body: JSON.stringify({
        model: modelToUse,
        max_tokens: 2200,
        system: "You are a concise assistant embedded in a UGC creator's ops dashboard. Answer using ONLY the JSON data provided about their brands, content, payments, and tasks. Earnings come entirely from the separate automated tracker (Tracked Content, fed by each brand's connected platform accounts) \u2014 Content is pure production-status information now (what's being made, its status) and never affects Earned, Outstanding, or Pending. Content only shows in-progress items \u2014 once something is marked Published it drops out of Content entirely; Tracked Content is where it (and its real view counts) shows up from then on. Payments are logged in bulk against a brand (not per video) \u2014 a brand's Outstanding is its automated-tracked total earned minus everything logged for it in payments. Be direct, use short paragraphs or lists, use $ for money. Each brand may include a 'brief' object with defaults it already has on file (basePay, cpmBonus, viewRequirement, platforms, cadence) \u2014 this sets that brand's automated-tracking rate (and its own recurring-quota cadence), not anything on individual content items, which no longer carry pay fields at all. When adding content for a brand that has a brief, use its platforms as the default instead of asking \u2014 content items take a title, platforms, and status only (plus an optional view requirement, kept purely for the user's own reference, not money).\n\nYou can take actions on the user's behalf, and you can batch many actions into a single reply \u2014 this matters because the user may ask for hundreds of videos at once, and they should never have to confirm one at a time for a bulk request like that. End your reply with exactly one fenced block containing a JSON ARRAY of action objects, even if it's only one:\n```action\n[{...}, {...}]\n```\nOnly emit the block when the request is unambiguous \u2014 if you're missing a required detail (which brand, what amount, what title, how many), ask a plain question instead and wait for their answer. Never invent an id; always copy an 'id' field exactly from the data provided. For any delete action, only act after the user has explicitly confirmed in their own words that they want it deleted \u2014 never delete on the first ask.\n\nWhen the user asks you to log a payment, always ask whether a CPM bonus was included in that amount before logging it, unless they already said so unprompted (e.g. \"got $600, $100 of that was a CPM bonus\"). amount is always the total actually received; cpmBonus (optional, default 0) is just the portion of that total that was a bonus, for their own record-keeping \u2014 it does not add on top of amount.\n\nCRITICAL \u2014 never write more than about 15 individual add_content actions by hand in one reply. If a request needs more videos than that, it always fits one of the two batch actions below instead \u2014 use one of them, never enumerate videos one by one for a bulk request. Writing dozens of individual JSON objects risks the response being cut off mid-way, which silently fails the whole thing.\n\n- add_content_batch: many videos that all share the exact same post date (or are all still unposted):\n{\"type\":\"add_content_batch\",\"brandId\":\"<id>\",\"count\":50,\"titlePrefix\":\"PureFi Video\",\"platforms\":[\"tiktok\",\"instagram\",\"youtube\"],\"status\":\"idea\",\"viewRequirement\":null,\"viewRequirementWindowDays\":null}\nThis creates videos titled \"PureFi Video 1\" through \"PureFi Video 50\" (or however many), all otherwise identical.\n\nviewRequirement/viewRequirementWindowDays are optional and purely informational now (not money) \u2014 a personal reference for whether a video hit whatever number the user cares about, on whatever window. Use a brand's brief.viewRequirement/viewRequirementWindowDays as the default when adding content for that brand if it has one.\n\n- add_content_daily_batch: for any cadence-based bulk request \u2014 'N videos a day for M days', 'backfill 37 videos, 2 a day since a date', 'X per week' converted to a daily count, etc. It spreads a fixed number per day across a date range automatically, incrementing the post date each day:\n{\"type\":\"add_content_daily_batch\",\"brandId\":\"<id>\",\"startDate\":\"YYYY-MM-DD\",\"perDay\":2,\"days\":18,\"platforms\":[\"tiktok\",\"instagram\"],\"status\":\"published\",\"viewRequirement\":300,\"viewRequirementMet\":true,\"viewRequirementWindowDays\":30,\"titlePrefix\":\"Amboras Ongoing\"}\nThis creates perDay*days videos total, dated startDate, startDate+1, startDate+2, ... with perDay videos sharing each date. Only sets a post date on items when status is 'published'. Use this for both backfilling known past history and for scheduling a fixed number of upcoming videos at a cadence.\n\nFor a truly open-ended, indefinite cadence ('ongoing forever until I say stop', no end date at all), a fixed batch isn't the right fit \u2014 tell the user you can add a bounded batch now (ask for a count or an end date), and mention they can also set up a recurring brief directly on the brand's edit screen for indefinite daily quotas, since that's built for exactly that case and isn't something you can configure yourself.\n\nIf a request needs a brand that doesn't exist yet AND a batch of content for it in the same reply, chain them: give the add_brand action a \"ref\" (any short label you pick), then use \"brandRef\" instead of \"brandId\" in the actions that follow it in the same array:\n[{\"type\":\"add_brand\",\"ref\":\"b1\",\"name\":\"New Brand\"},{\"type\":\"add_content_batch\",\"brandRef\":\"b1\",\"count\":20,\"titlePrefix\":\"New Brand Video\",\"platforms\":[\"tiktok\"],\"status\":\"idea\"}]\n\nOther action types and their exact shape:\n- Log a payment received for a brand: {\"type\":\"log_payment\",\"brandId\":\"<id>\",\"amount\":120,\"cpmBonus\":0,\"note\":\"optional\"}\n- Add a new brand: {\"type\":\"add_brand\",\"name\":\"Brand name\",\"status\":\"active\",\"notes\":\"optional\",\"ref\":\"optional label\"}\n- Add a single content item: {\"type\":\"add_content\",\"brandId\":\"<id>\",\"title\":\"Video title\",\"platforms\":[\"tiktok\",\"instagram\",\"youtube\"],\"status\":\"idea\",\"postDate\":\"YYYY-MM-DD or omit\",\"viewRequirement\":null,\"viewRequirementWindowDays\":null} (platforms are which of tiktok/instagram/youtube/facebook are active for this deliverable; no pay fields — content no longer carries money, only the brand's own brief does)\n- Change a content item's status: {\"type\":\"set_status\",\"id\":\"<content id>\",\"status\":\"published\"}\n- Mark a content item's view requirement as hit or not: {\"type\":\"set_requirement_met\",\"id\":\"<content id>\",\"met\":true}\n- Add a task: {\"type\":\"add_task\",\"title\":\"Task title\",\"brandId\":\"<id or null>\",\"priority\":\"high\",\"daily\":false,\"requiresTimer\":false,\"timerMinutes\":10} (timerMinutes only matters when requiresTimer is true \u2014 default 10, but a fresh account warm-up often needs 30\u201345)\n- Toggle a task done/undone (for daily tasks this only affects today): {\"type\":\"toggle_task\",\"id\":\"<task id>\"}\n- Delete a content item, brand, or task (only after explicit confirmation): {\"type\":\"delete_content\",\"id\":\"<id>\"} or {\"type\":\"delete_brand\",\"id\":\"<id>\"} or {\"type\":\"delete_task\",\"id\":\"<id>\"}\n\nstatus must be one of: idea, scripting, filming, editing, ready, submitted, revision, approved, scheduled, published. \"scheduled\" means the user has a plan for when it will go out but hasn\u2019t posted it yet \u2014 use it, and set \"scheduledDate\" (YYYY-MM-DD) on the content item, whenever the user is batching/planning ahead rather than posting immediately (e.g. \"I filmed the next 10 for Amboras, starting the 21st\"). scheduledDate is the plan, separate from the real post date which only gets set once something is actually Published \u2014 never set both to the same thing unless it really did go live that day.\n\nIf the data can't answer a question, say so plainly.",
        messages: messages
      })
    });
    const dataRes = await res.json();
    if(dataRes.error){
      const hint = usingOwnKey ? ' Double-check the key and model in AI settings (⚙).' : '';
      AI_LOG.push({role:'assistant', text: `⚠️ ${dataRes.error.message || 'Anthropic API error'}.${hint}`});
      AI_BUSY = false;
      render();
      scrollAiLog();
      return;
    }
    let text = (dataRes.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n') || 'No response received.';
    const actionMatch = text.match(/```action\s*([\s\S]*?)```/);
    if(actionMatch){
      text = text.replace(actionMatch[0], '').trim();
      try{
        const parsed = JSON.parse(actionMatch[1]);
        const messages = executeAIActions(parsed);
        if(messages.length){
          const summary = messages.length > 6
            ? messages.slice(0,3).join('\n') + `\n…and ${messages.length-3} more.`
            : messages.join('\n');
          text = (text ? text + '\n\n' : '') + summary;
        }
      }catch(err){
        console.error('AI action parse failed', err);
        text = (text ? text + '\n\n' : '') + '⚠️ That action could not be applied — nothing was changed. Try asking again, maybe as a smaller request.';
      }
    } else if(text.includes('```action')){
      // the action block was opened but never closed — the response got cut off before finishing.
      // don't dump the raw unfinished JSON on the user; nothing was executed either way.
      text = text.slice(0, text.indexOf('```action')).trim();
      text = (text ? text + '\n\n' : '') + '⚠️ That response got cut off before it finished — nothing was changed. Try asking for a smaller batch, or breaking the request into a couple of smaller messages.';
    }
    AI_LOG.push({role:'assistant', text});
  }catch(e){
    AI_LOG.push({role:'assistant', text:'Something went wrong reaching Claude. Try again in a moment.'});
    console.error(e);
  }
  AI_BUSY = false;
  render();
  scrollAiLog();
}

/* ---------------- AI actions ----------------
   The AI can mutate the dashboard when asked (e.g. "log a $300
   payment for PureFi", "add 200 videos for X"). It signals this with
   a fenced ```action block containing a JSON ARRAY of action objects
   (even a single action is wrapped in an array) — we parse it,
   execute every entry in order against a shared refMap so a brand
   created earlier in the same batch can be referenced by later
   entries, and strip the block from the shown text.
------------------------------------------------------------------ */
function resolveBrandId(action, refMap){
  if(action.brandId && DATA.brands.some(b=>b.id===action.brandId)) return action.brandId;
  if(action.brandRef && refMap && refMap[action.brandRef]) return refMap[action.brandRef];
  return action.brandId || null;
}
function nextTitleIndex(brandId, prefix){
  // scans existing content for "<prefix> <N>" under this brand and returns the next free N —
  // used so repeated/related batch calls (e.g. "23 published, then 7 more idea") never collide
  // on numbering even if the caller doesn't track where the last batch left off
  const escaped = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^' + escaped + ' (\\d+)$');
  let max = 0;
  DATA.content.forEach(c => {
    if(c.brandId !== brandId) return;
    const m = (c.title||'').match(re);
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return max + 1;
}
function aiLogPayment(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const amount = Number(action.amount)||0;
  if(amount<=0) return null;
  const cpmBonus = Number(action.cpmBonus)||0;
  DATA.payments.push({ id:uid('py_'), brandId:brand.id, amount, cpmBonus, date: todayISO(), note: action.note || 'Logged via AI assistant', createdAt: new Date().toISOString() });
  saveData();
  return cpmBonus
    ? `Logged a ${money(amount)} payment for ${brand.name} (includes ${money(cpmBonus)} CPM bonus).`
    : `Logged a ${money(amount)} payment for ${brand.name}.`;
}
function aiAddBrand(action, refMap){
  const name = (action.name||'').trim();
  if(!name) return null;
  const brand = {
    id:uid('br_'), name,
    status: action.status==='paused' ? 'paused' : 'active',
    color: (typeof action.color==='string' && /^#[0-9a-fA-F]{6}$/.test(action.color)) ? action.color : SWATCHES[DATA.brands.length % SWATCHES.length],
    notes: action.notes || ''
  };
  DATA.brands.push(brand);
  if(action.ref && refMap) refMap[action.ref] = brand.id;
  saveData();
  return `Added brand "${brand.name}".`;
}
function aiAddContent(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id); // default to all 3 — never create a video with zero active platforms
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const postDate = action.postDate || (status==='published' ? todayISO() : ''); // published implies it has a post date
  const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate } : p);
  const c = {
    id:uid('ct_'), brandId:brand.id, title:(action.title||'Untitled').trim(),
    basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date().toISOString(),
    viewRequirement: action.viewRequirement || null, viewRequirementMet:false,
    viewRequirementWindowDays: action.viewRequirementWindowDays || null,
    scheduledDate: action.scheduledDate || null,
    platforms
  };
  DATA.content.push(c);
  bumpBriefProgressForContentCreation(brand.id); // a real video was just logged — count it toward today's quota
  saveData();
  return `Added "${c.title}" for ${brand.name}.`;
}
function aiAddContentBatch(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const count = Math.max(1, Math.min(1000, Number(action.count)||0));
  if(count<=0) return null;
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id); // default to all 3 — never create a video with zero active platforms
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const postDate = action.postDate || (status==='published' ? todayISO() : ''); // published implies it has a post date
  const prefix = (action.titlePrefix || `${brand.name} video`).trim();
  const startIndex = action.startIndex ? Math.max(1, Number(action.startIndex)) : nextTitleIndex(brand.id, prefix);
  for(let i=0; i<count; i++){
    const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate } : p);
    DATA.content.push({
      id:uid('ct_'), brandId:brand.id, title:`${prefix} ${startIndex+i}`,
      basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date(Date.now()+i).toISOString(),
      viewRequirement: action.viewRequirement || null, viewRequirementMet:false,
      viewRequirementWindowDays: action.viewRequirementWindowDays || null,
      scheduledDate: action.scheduledDate || null,
      platforms
    });
  }
  saveData();
  return `Added ${count} videos for ${brand.name} ("${prefix} ${startIndex}" through "${prefix} ${startIndex+count-1}").`;
}
function aiAddContentDailyBatch(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const perDay = Math.max(1, Math.min(20, Number(action.perDay)||1));
  const days = Math.max(1, Math.min(365, Number(action.days)||1));
  const total = perDay * days;
  if(total > 2000) return null; // sanity cap
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id);
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const viewRequirement = action.viewRequirement || null;
  const viewRequirementMet = viewRequirement ? !!action.viewRequirementMet : false;
  const viewRequirementWindowDays = action.viewRequirementWindowDays || null;
  const prefix = (action.titlePrefix || `${brand.name} video`).trim();
  const startDate = (typeof action.startDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(action.startDate)) ? action.startDate : todayISO();
  const start = new Date(startDate+'T00:00:00');
  const firstIndex = action.startIndex ? Math.max(1, Number(action.startIndex)) : nextTitleIndex(brand.id, prefix);
  let counter = firstIndex;
  for(let d=0; d<days; d++){
    const dayDate = new Date(start.getFullYear(), start.getMonth(), start.getDate()+d);
    const dateStr = dayDate.toISOString().slice(0,10);
    for(let i=0; i<perDay; i++){
      const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate: status==='published' ? dateStr : '' } : p);
      DATA.content.push({
        id:uid('ct_'), brandId:brand.id, title:`${prefix} ${counter}`,
        basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date(Date.now()+counter).toISOString(),
        viewRequirement, viewRequirementMet, viewRequirementWindowDays,
        scheduledDate: status==='published' ? null : dateStr, // if it's not published yet, this date is the plan, not a real post date
        platforms
      });
      counter++;
    }
  }
  saveData();
  return `Added ${total} videos for ${brand.name}, ${perDay}/day starting ${fmtDate(startDate)} ("${prefix} ${firstIndex}" through "${prefix} ${firstIndex+total-1}").`;
}
function aiSetStatus(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c || !STATUSES.includes(action.status)) return null;
  const hadActive = c.platforms.some(p=>p.active);
  if(!hadActive){
    // nothing was ever marked active on this item — default to all 3 rather than silently no-op'ing
    c.platforms.forEach(p => { p.active = true; });
  }
  c.platforms.forEach(p => {
    if(p.active){
      p.status = action.status;
      // "published" with no post date is invisible to every time-scoped view (week/month/chart) even
      // though it correctly counts toward lifetime totals — backfill today's date so it isn't silently lost.
      if(action.status==='published' && !p.postDate) p.postDate = todayISO();
    }
  });
  saveData();
  return hadActive
    ? `Set "${c.title||'Untitled'}" to ${STATUS_LABEL[action.status]}.`
    : `"${c.title||'Untitled'}" had no platforms active, so I activated all 3 and set it to ${STATUS_LABEL[action.status]}.`;
}
function aiSetRequirementMet(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c) return null;
  c.viewRequirementMet = !!action.met;
  saveData();
  return `Marked view requirement ${action.met ? 'hit':'not hit'} for "${c.title||'Untitled'}".`;
}
function aiAddTask(action, refMap){
  const title = (action.title||'').trim();
  if(!title) return null;
  const priority = PRIORITIES.some(p=>p.id===action.priority) ? action.priority : 'medium';
  const brandId = action.brandId || action.brandRef ? resolveBrandId(action, refMap) : '';
  const t = { id:uid('tk_'), title, brandId: brandId || '', priority, daily: !!action.daily, requiresTimer: !!action.requiresTimer, timerMinutes: Math.max(1, Math.min(240, Number(action.timerMinutes)||10)), completed:false, dailyDone:{}, createdAt: todayISO() };
  DATA.tasks.push(t);
  saveData();
  return `Added task "${t.title}".`;
}
function aiToggleTask(action){
  const t = DATA.tasks.find(x=>x.id===action.id);
  if(!t) return null;
  toggleTaskDone(t.id);
  return `Toggled "${t.title}".`;
}
function aiDeleteContent(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c) return null;
  DATA.content = DATA.content.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted "${c.title||'Untitled'}".`;
}
function aiDeleteBrand(action){
  const b = DATA.brands.find(x=>x.id===action.id);
  if(!b) return null;
  DATA.brands = DATA.brands.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted brand "${b.name}".`;
}
function aiDeleteTask(action){
  const t = DATA.tasks.find(x=>x.id===action.id);
  if(!t) return null;
  DATA.tasks = DATA.tasks.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted task "${t.title}".`;
}
function executeAIAction(action, refMap){
  refMap = refMap || {};
  if(!action || !action.type) return null;
  switch(action.type){
    case 'log_payment': return aiLogPayment(action, refMap);
    case 'add_brand': return aiAddBrand(action, refMap);
    case 'add_content': return aiAddContent(action, refMap);
    case 'add_content_batch': return aiAddContentBatch(action, refMap);
    case 'add_content_daily_batch': return aiAddContentDailyBatch(action, refMap);
    case 'set_status': return aiSetStatus(action);
    case 'set_requirement_met': return aiSetRequirementMet(action);
    case 'add_task': return aiAddTask(action, refMap);
    case 'toggle_task': return aiToggleTask(action);
    case 'delete_content': return aiDeleteContent(action);
    case 'delete_brand': return aiDeleteBrand(action);
    case 'delete_task': return aiDeleteTask(action);
    default: return null;
  }
}
function executeAIActions(actionsInput){
  const actionsArr = (Array.isArray(actionsInput) ? actionsInput : [actionsInput]).slice(0, 50);
  const refMap = {};
  const messages = [];
  actionsArr.forEach(action => {
    try{
      const msg = executeAIAction(action, refMap);
      if(msg) messages.push(msg);
    }catch(err){ console.error('AI action failed', action, err); }
  });
  return messages;
}

function scrollAiLog(){
  const el = document.getElementById('aiLog');
  if(el) el.scrollTop = el.scrollHeight;
}

/* ---------------- date picker (used for post dates & payment dates) ---------------- */
function getDPValue(key){
  const [type, a, b] = key.split(':');
  if(type==='draftplatform'){ const p = MODAL_STATE.draft.platforms.find(x=>x.id===a); return p ? p.postDate : ''; }
  if(type==='livecontent'){ const c = DATA.content.find(x=>x.id===a); const p = c && c.platforms.find(x=>x.id===b); return p ? p.postDate : ''; }
  if(type==='payment'){ const target = a==='draft' ? MODAL_STATE.draft : DATA.payments.find(x=>x.id===a); return target ? target.date : ''; }
  if(type==='contentfilter'){ return a==='start' ? CONTENT_FILTER.customStart : CONTENT_FILTER.customEnd; }
  if(type==='scheduled'){ const target = a==='draft' ? MODAL_STATE.draft : DATA.content.find(x=>x.id===a); return target ? target.scheduledDate : ''; }
  if(type==='trialstart'){ return MODAL_STATE.draft && MODAL_STATE.draft.brief ? MODAL_STATE.draft.brief.trialStartDate : ''; }
  return '';
}
function setDPValue(key, val){
  const [type, a, b] = key.split(':');
  if(type==='draftplatform'){ const p = MODAL_STATE.draft.platforms.find(x=>x.id===a); if(p) p.postDate = val; }
  if(type==='livecontent'){ const c = DATA.content.find(x=>x.id===a); const p = c && c.platforms.find(x=>x.id===b); if(p){ p.postDate = val; saveData(); } }
  if(type==='payment'){ if(a==='draft'){ MODAL_STATE.draft.date = val; } else { const p = DATA.payments.find(x=>x.id===a); if(p){ p.date = val; saveData(); } } }
  if(type==='contentfilter'){ if(a==='start') CONTENT_FILTER.customStart = val; else CONTENT_FILTER.customEnd = val; }
  if(type==='scheduled'){ if(a==='draft'){ MODAL_STATE.draft.scheduledDate = val; } else { const c = DATA.content.find(x=>x.id===a); if(c){ c.scheduledDate = val; saveData(); } } }
  if(type==='trialstart'){ if(!MODAL_STATE.draft.brief) MODAL_STATE.draft.brief = {}; MODAL_STATE.draft.brief.trialStartDate = val; }
}

function renderDatePickerPopover(){

  const todayStr = todayISO();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);

  const top = Math.max(8, Math.min(DP.rect.bottom + 6, window.innerHeight - 300));

/* ---------------- timer-complete popup + chime ---------------- */
function playTimerDoneSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const beep = (freq, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    beep(880, 0, 0.32);
    beep(1180, 0.22, 0.28);
  }catch(e){ /* audio unavailable — visual popup still shows */ }
}
function tryBrowserNotification(taskTitle){
  try{
    if(typeof Notification === 'undefined') return;
    const fire = () => new Notification('Timer complete', { body: `"${taskTitle}" marked done.` });
    if(Notification.permission === 'granted') fire();
    else if(Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p==='granted') fire(); });
  }catch(e){ /* notifications unavailable in this environment — visual popup still shows */ }
}

let MODAL_STATE = { type:null, id:null, draft:null };

// brand's edit modal is currently open — null until loaded, since it lives in the separate
// Supabase brands table (used by the automated scouting jobs) rather than in DATA.brands
// (the manual-pipeline localStorage record). See loadBrandConnections().
let MODAL_BRAND_CONN = null;

// opens for a not-yet-linked brand, so it can offer "link to an existing one" (e.g. PureFi,
// Amboras, Test Brand 2 that already have tracked videos) instead of always creating a new row.
let MODAL_ALL_BACKEND_BRANDS = null;

// animation plays whenever a node is first created, and root.innerHTML is rebuilt on every render(),
// so without this flag the modal would replay its pop-in every time e.g. the date picker opens inside it.

function openModal(type, id=null){
  MODAL_STATE.type = type;
  MODAL_STATE.id = id;
  if(type==='brand'){
    const existing = id ? brandById(id) : null;
    // real UUIDs (not the usual short uid() prefix) so a brand created here can be upserted
    // straight into Supabase's brands.id column — same id space the automated-tracking rows use
    MODAL_STATE.draft = existing ? {...existing} : { id: newUuid(), name:'', status:'active', color: SWATCHES[DATA.brands.length % SWATCHES.length], notes:'' };
    MODAL_BRAND_CONN = null;
    MODAL_ALL_BACKEND_BRANDS = null;
    if(existing && existing.supabaseBrandId) loadBrandConnections(existing.supabaseBrandId);
    else if(existing) loadAllBackendBrands();
  } else if(type==='content'){
    const existing = id ? DATA.content.find(c=>c.id===id) : null;
    MODAL_STATE.draft = existing ? { ...JSON.parse(JSON.stringify(existing)), platforms: normalizePlatforms(existing.platforms) } : {
      id:uid('ct_'), brandId: DATA.brands[0]?.id || '', title:'', basePay:0, cpmBonus:0, createdAt: new Date().toISOString(),
      viewRequirement:null, viewRequirementMet:false, viewRequirementWindowDays:null, scheduledDate:null,
      platforms: normalizePlatforms([])
    };
    if(!existing) applyBriefDefaultsToDraft(MODAL_STATE.draft, MODAL_STATE.draft.brandId);
  } else if(type==='payment'){
    MODAL_STATE.draft = { id:uid('py_'), brandId: DATA.brands[0]?.id || '', amount:0, cpmBonus:0, date: todayISO(), note:'' };
  } else if(type==='task'){
    const existing = id ? DATA.tasks.find(t=>t.id===id) : null;
    MODAL_STATE.draft = existing ? {...existing} : {
      id:uid('tk_'), title:'', brandId:'', priority:'medium', daily:false, requiresTimer:false, timerMinutes:10,
      completed:false, dailyDone:{}, createdAt: todayISO()
    };
  } else if(type==='trackedVideo'){
    const existing = TRACKED_CONTENT_DATA ? TRACKED_CONTENT_DATA.find(r=>r.id===id) : null;
    MODAL_STATE.draft = existing ? { ...existing } : null;
  } else if(type==='mergeReview'){
    MODAL_STATE.draft = { rowIds: Array.from(MERGE_SELECTED) };
  }
  MODAL_ENTER = true;
  render();
  MODAL_ENTER = false;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  MODAL_STATE = { type:null, id:null, draft:null };
  render();
}

/* ---------------- handlers ---------------- */
function bindGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => {
    const target = el.dataset.nav;
    if(MOBILE_NAV_OPEN){
      // let the drawer actually slide shut first — swapping VIEW immediately underneath it
      // (the old behavior) meant the page content changed at the exact same instant the
      // drawer vanished, which read as one big pop instead of two clean, readable motions.
      setMobileNavOpen(false);
      setTimeout(() => goToView(target), 220);
    } else {
      goToView(target);
    }
  }));
  const mobileNavToggle = document.getElementById('mobileNavToggle');
  if(mobileNavToggle) mobileNavToggle.addEventListener('click', () => setMobileNavOpen(!MOBILE_NAV_OPEN));
  const mobileNavScrim = document.getElementById('mobileNavScrim');
  if(mobileNavScrim) mobileNavScrim.addEventListener('click', () => setMobileNavOpen(false));
  const refreshTrackedContent = document.getElementById('refreshTrackedContent');
  if(refreshTrackedContent) refreshTrackedContent.addEventListener('click', () => { TRACKED_CONTENT_DATA = null; loadTrackedContent(); });
  document.querySelectorAll('[data-open-modal]').forEach(el => el.addEventListener('click', () => openModal(el.dataset.openModal)));
  document.querySelectorAll('[data-open-brand-breakdown]').forEach(el => el.addEventListener('click', () => {
    openBrandBreakdown(el.dataset.brandId || null, el.dataset.brandName, el.dataset.brandColor);
  }));
  document.querySelectorAll('[data-open-content]').forEach(el => el.addEventListener('click', () => openModal('content', el.dataset.openContent)));
  document.querySelectorAll('[data-open-brand], [data-edit-brand]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); openModal('brand', el.dataset.openBrand || el.dataset.editBrand); }));
  document.querySelectorAll('[data-toggle-brand-status]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); toggleBrandStatus(el.dataset.toggleBrandStatus); }));
  document.querySelectorAll('[data-select-theme]').forEach(el => el.addEventListener('click', () => setTheme(el.dataset.selectTheme)));
  document.querySelectorAll('[data-del-payment]').forEach(el => el.addEventListener('click', () => { DATA.payments = DATA.payments.filter(p=>p.id!==el.dataset.delPayment); saveData(); render(); }));
  document.querySelectorAll('[data-edit-task]').forEach(el => el.addEventListener('click', () => openModal('task', el.dataset.editTask)));
  document.querySelectorAll('[data-edit-tracked-video]').forEach(el => el.addEventListener('click', () => openModal('trackedVideo', el.dataset.editTrackedVideo)));
  // Checking an already-merged deliverable's box selects every row already in that group as one
  // unit (they're already inseparably one piece of content) — this is what lets you tick an
  // existing merged pair plus a new standalone row and extend the group to a 3rd platform,
  // instead of only ever being able to merge from scratch.
  document.querySelectorAll('[data-merge-check-ids]').forEach(el => el.addEventListener('change', () => {
    const ids = el.dataset.mergeCheckIds.split(',');
    if(el.checked) ids.forEach(id => MERGE_SELECTED.add(id)); else ids.forEach(id => MERGE_SELECTED.delete(id));
    render();
  }));
  const openMergeReview = document.getElementById('openMergeReview');
  if(openMergeReview) openMergeReview.addEventListener('click', () => openModal('mergeReview'));
  document.querySelectorAll('[data-ungroup]').forEach(el => el.addEventListener('click', () => {
    const groupId = el.dataset.ungroup;
    askConfirm('Ungroup this deliverable? Each platform goes back to being tracked and paid separately.', async () => {
      const rowIds = TRACKED_CONTENT_DATA.filter(r=>r.group_id===groupId).map(r=>r.id);
      await fetch(`${SUPABASE_URL}/rest/v1/tracked_videos?id=in.(${rowIds.map(id=>`"${id}"`).join(',')})`, {
        method: 'PATCH',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ group_id: null }),
      });
      TRACKED_CONTENT_DATA.forEach(r => { if(r.group_id===groupId) r.group_id = null; });
      render();
    });
  }));
  document.querySelectorAll('[data-toggle-title]').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.toggleTitle;
    if(TC_EXPANDED.has(key)) TC_EXPANDED.delete(key); else TC_EXPANDED.add(key);
    render();
  }));
  const tcBrand = document.getElementById('tcBrand');
  if(tcBrand) tcBrand.addEventListener('change', () => { TC_FILTER.brand = tcBrand.value; render(); });
  const tcPlatform = document.getElementById('tcPlatform');
  if(tcPlatform) tcPlatform.addEventListener('change', () => { TC_FILTER.platform = tcPlatform.value; render(); });
  const tcStatus = document.getElementById('tcStatus');
  if(tcStatus) tcStatus.addEventListener('change', () => { TC_FILTER.status = tcStatus.value; render(); });
  const tcSearch = document.getElementById('tcSearch');
  if(tcSearch) tcSearch.addEventListener('input', () => { TC_FILTER.q = tcSearch.value; render(); tcSearch.focus(); tcSearch.setSelectionRange(tcSearch.value.length, tcSearch.value.length); });
  const tcClearFilters = document.getElementById('tcClearFilters');
  if(tcClearFilters) tcClearFilters.addEventListener('click', () => { TC_FILTER = { brand:'', platform:'', status:'', q:'' }; render(); });
  const tcViewTable = document.getElementById('tcViewTable');
  if(tcViewTable) tcViewTable.addEventListener('click', () => { TC_VIEW_MODE = 'table'; render(); });
  const tcViewCompare = document.getElementById('tcViewCompare');
  if(tcViewCompare) tcViewCompare.addEventListener('click', () => { TC_VIEW_MODE = 'compare'; TC_FILTER.platform=''; TC_FILTER.status=''; render(); });
  document.querySelectorAll('[data-link-cluster]').forEach(el => el.addEventListener('click', () => {
    MERGE_SELECTED = new Set(el.dataset.linkCluster.split(','));
    openModal('mergeReview');
  }));

  // dashboard range + chart type
  document.querySelectorAll('[data-range]').forEach(el => el.addEventListener('click', () => { DASH_RANGE = el.dataset.range; renderWithChartEnter(); }));
  document.querySelectorAll('[data-sort-brand]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.sortBrand;
    if(BRAND_TABLE_SORT.key === k) BRAND_TABLE_SORT.dir = BRAND_TABLE_SORT.dir==='asc' ? 'desc' : 'asc';
    else BRAND_TABLE_SORT = { key:k, dir: k==='name' ? 'asc' : 'desc' };
    if(BRAND_ROW_ORDER){ BRAND_ROW_ORDER = null; localStorage.removeItem('rwr-brand-order'); } // clicking a column exits the custom drag order
    render();
  }));
  const brandCmpHead = document.getElementById('brandCmpHead');
  if(brandCmpHead) brandCmpHead.addEventListener('click', (e) => {
    if(e.target.closest('#btnResetBrandOrder')) return; // handled by its own listener below
    setBrandComparisonCollapsed(!document.getElementById('brandCmpCard').classList.contains('collapsed'));
  });
  const btnResetBrandOrder = document.getElementById('btnResetBrandOrder');
  if(btnResetBrandOrder) btnResetBrandOrder.addEventListener('click', (e) => {
    e.stopPropagation();
    BRAND_ROW_ORDER = null; localStorage.removeItem('rwr-brand-order');
    render();
  });
  bindBrandComparisonDnD();
  document.querySelectorAll('[data-chart-point]').forEach(el => {
    const idx = Number(el.dataset.chartPoint);
    el.addEventListener('mouseenter', (e) => { showChartTooltip(idx, e.clientX, e.clientY); moveChartHoverGuide(el); });
    el.addEventListener('mousemove', (e) => positionChartTooltip(e.clientX, e.clientY));
    el.addEventListener('mouseleave', () => { hideChartTooltip(); hideChartHoverGuide(); });
  });

  // content analytics
  document.querySelectorAll('[data-ca-range]').forEach(el => el.addEventListener('click', () => { CA_STATE.range = el.dataset.caRange; render(); }));
  const caChipNearMiss = document.getElementById('caChipNearMiss');
  if(caChipNearMiss) caChipNearMiss.addEventListener('click', () => { CA_STATE.nearMiss = !CA_STATE.nearMiss; render(); });
  const caChipTrending = document.getElementById('caChipTrending');
  if(caChipTrending) caChipTrending.addEventListener('click', () => { CA_STATE.trending = !CA_STATE.trending; render(); });
  const caClearFilters = document.getElementById('caClearFilters');
  if(caClearFilters) caClearFilters.addEventListener('click', () => { CA_STATE.nearMiss=false; CA_STATE.trending=false; render(); });
  const caBrandFilter = document.getElementById('caBrandFilter');
  if(caBrandFilter) caBrandFilter.addEventListener('change', () => { CA_STATE.brand = caBrandFilter.value; render(); });
  document.querySelectorAll('[data-ca-date-group]').forEach(el => el.addEventListener('click', () => { CA_STATE.dateGroup = el.dataset.caDateGroup; render(); }));
  const caSortTop = document.getElementById('caSortTop');
  if(caSortTop) caSortTop.addEventListener('click', () => { CA_STATE.sort='top'; render(); });
  const caSortBottom = document.getElementById('caSortBottom');
  if(caSortBottom) caSortBottom.addEventListener('click', () => { CA_STATE.sort='bottom'; render(); });
  document.querySelectorAll('[data-open-ca-video]').forEach(el => el.addEventListener('click', () => openContentVideoModal(el.dataset.openCaVideo)));
  const caTableExpand = document.getElementById('caTableExpand');
  if(caTableExpand) caTableExpand.addEventListener('click', () => { CA_STATE.tableExpanded = true; render(); });
  const caTableCollapse = document.getElementById('caTableCollapse');
  if(caTableCollapse) caTableCollapse.addEventListener('click', () => { CA_STATE.tableExpanded = false; render(); });
  caRenderChart(); // draws the multi-platform SVG + binds its own hover listener — no-op if #caChartSvg isn't on screen

  // tasks
  document.querySelectorAll('[data-edit-priority]').forEach(el => el.addEventListener('change', () => {
    const t = DATA.tasks.find(x=>x.id===el.dataset.editPriority); if(t){ t.priority = el.value; saveData(); render(); }
  }));
  document.querySelectorAll('[data-toggle-task]').forEach(el => el.addEventListener('click', () => toggleTaskDone(el.dataset.toggleTask)));
  document.querySelectorAll('[data-start-timer]').forEach(el => el.addEventListener('click', () => startTaskTimer(el.dataset.startTimer)));
  document.querySelectorAll('[data-cancel-timer]').forEach(el => el.addEventListener('click', () => cancelTaskTimer(el.dataset.cancelTimer)));

  const brandFilter = document.getElementById('brandFilter');
  if(brandFilter) brandFilter.addEventListener('change', () => { ACTIVE_BRAND_FILTER = brandFilter.value || null; render(); });
  const contentDatePreset = document.getElementById('contentDatePreset');
  if(contentDatePreset) contentDatePreset.addEventListener('change', () => { CONTENT_FILTER.datePreset = contentDatePreset.value; render(); });
  const contentStatusFilter = document.getElementById('contentStatusFilter');
  if(contentStatusFilter) contentStatusFilter.addEventListener('change', () => { CONTENT_FILTER.status = contentStatusFilter.value; render(); });
  const contentDateField = document.getElementById('contentDateField');
  if(contentDateField) contentDateField.addEventListener('change', () => { CONTENT_FILTER.dateField = contentDateField.value; render(); });
  const paymentsBrandFilter = document.getElementById('paymentsBrandFilter');
  if(paymentsBrandFilter) paymentsBrandFilter.addEventListener('change', () => { PAYMENTS_FILTER.brandId = paymentsBrandFilter.value; render(); });

  document.querySelectorAll('[data-edit-status-all]').forEach(el => el.addEventListener('change', () => {
    const cid = el.dataset.editStatusAll;
    const c = DATA.content.find(x=>x.id===cid);
    if(c){
      c.platforms.forEach(p => {
        if(p.active){
          p.status = el.value;
