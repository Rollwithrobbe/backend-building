      const res = await fetch(`${SUPABASE_URL}/rest/v1/tracked_videos?id=in.(${rowIds.map(id=>`"${id}"`).join(',')})`, {
        method: 'PATCH',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ group_id: groupId }),
      });
      if(!res.ok) throw new Error(`Supabase returned ${res.status}`);
      TRACKED_CONTENT_DATA.forEach(r => { if(rowIds.includes(r.id)) r.group_id = groupId; });
      MERGE_SELECTED.clear();
      closeModal();
    }catch(e){
      alert('Could not merge — ' + e.message);
      confirmMerge.disabled = false; confirmMerge.textContent = 'Confirm merge';
    }
  });

  // AI drawer
  // data management
  const btnMigrateCloud = document.getElementById('btnMigrateCloud');
  if(btnMigrateCloud) btnMigrateCloud.addEventListener('click', () => {
    askConfirm('Move your Brands, Content, Tasks, and Payments to the cloud? This uploads everything currently here to Supabase — the same place your tracked-content data already lives — and switches this dashboard to read from there from now on, so it stays in sync across every device. Your local copy stays as a backup either way.', migrateToCloud);
  });
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', exportData);
  const importFile = document.getElementById('importFile');
  const btnImport = document.getElementById('btnImport');
  if(btnImport) btnImport.addEventListener('click', () => importFile.click());
  if(importFile) importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importDataFile(file);
    importFile.value = '';
  });
  const btnDemo = document.getElementById('btnDemo');
  if(btnDemo) btnDemo.addEventListener('click', loadDemoData);
  const btnClear = document.getElementById('btnClear');
  if(btnClear) btnClear.addEventListener('click', clearAllData);
  const btnEnableBackup = document.getElementById('btnEnableBackup');
  if(btnEnableBackup) btnEnableBackup.addEventListener('click', enableAutoBackup);
  const btnBackupReconnect = document.getElementById('btnBackupReconnect');
  if(btnBackupReconnect) btnBackupReconnect.addEventListener('click', reconnectAutoBackup);
  const btnBackupStatus = document.getElementById('btnBackupStatus');
  if(btnBackupStatus) btnBackupStatus.addEventListener('click', () => {
    askConfirm(`Turn off auto-backup to ${BACKUP_FILENAME}? The file itself won't be deleted.`, disableAutoBackup);
  });

  const aiToggleBtn = document.getElementById('aiToggleBtn');
  if(aiToggleBtn) aiToggleBtn.addEventListener('click', toggleAI);
  const aiClose = document.getElementById('aiClose');
  if(aiClose) aiClose.addEventListener('click', () => { setAIOpen(false); });
  const aiSettingsToggle = document.getElementById('aiSettingsToggle');
  if(aiSettingsToggle) aiSettingsToggle.addEventListener('click', () => { AI_SETTINGS_OPEN = !AI_SETTINGS_OPEN; render(); });
  const aiSettingsSave = document.getElementById('aiSettingsSave');
  if(aiSettingsSave) aiSettingsSave.addEventListener('click', () => {
    AI_SETTINGS.apiKey = document.getElementById('f-aiApiKey').value.trim();
    AI_SETTINGS.model = document.getElementById('f-aiModel').value;
    saveAISettings();
    showToast(AI_SETTINGS.apiKey ? 'Saved — now calling Anthropic directly with your key' : 'Saved');
    render();
  });
  const aiSettingsClear = document.getElementById('aiSettingsClear');
  if(aiSettingsClear) aiSettingsClear.addEventListener('click', () => {
    AI_SETTINGS.apiKey = '';
    saveAISettings();
    showToast('Key removed — back to Claude\'s built-in connection');
    render();
  });
  const aiSend = document.getElementById('aiSend');
  const aiInput = document.getElementById('aiInput');
  if(aiSend) aiSend.addEventListener('click', () => { const v = aiInput.value.trim(); aiInput.value=''; sendAI(v); });
  if(aiInput) aiInput.addEventListener('keydown', (e) => { if(e.key==='Enter'){ const v = aiInput.value.trim(); aiInput.value=''; sendAI(v); } });
  document.querySelectorAll('[data-ai-suggest]').forEach(el => el.addEventListener('click', () => sendAI(el.dataset.aiSuggest)));

  scrollAiLog();
}

/* ---------------- Escape closes whatever's on top ---------------- */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(DP){ DP = null; render(); return; }
  if(TIMER_DONE_POPUP){ TIMER_DONE_POPUP = null; render(); return; }
  if(CONFIRM_STATE){ CONFIRM_STATE = null; render(); return; }
  if(MODAL_STATE.type){ closeModal(); return; }
  if(AI_OPEN){ setAIOpen(false); return; }
});

loadData();
</script>
</body>
</html>
