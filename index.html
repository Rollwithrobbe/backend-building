/* ---------------- AI drawer spring ----------------
   Critically-damped-ish spring (slight bounce, per the Apple Design skill's
   "drawer/sheet" preset) driving a compositor-friendly transform instead of
   a CSS transition. Position/velocity persist across renders (the drawer's
   DOM node gets recreated by every render() call, so we re-acquire it each
   frame rather than caching it) so re-opening/closing mid-flight re-targets
   from the live position and velocity instead of snapping — the core
   interruptibility principle: never animate from the target, only from
   whatever's actually on screen right now.
   AI_DRAWER_X: 0 = fully open, 1 = fully closed (off-screen).
------------------------------------------------------------------ */
let AI_DRAWER_X = 1;
let AI_DRAWER_V = 0;
let AI_DRAWER_RAF = null;
function applyDrawerTransform(x){
  const el = document.querySelector('.ai-drawer');
  if(el) el.style.transform = `translateX(${(x*100).toFixed(3)}%)`;
}
function animateDrawerTo(target){
  cancelAnimationFrame(AI_DRAWER_RAF);
  const reduced = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){
    AI_DRAWER_X = target; AI_DRAWER_V = 0;
    applyDrawerTransform(target);
    return;
  }
  const stiffness = 170, damping = 20.8; // damping ratio ~0.8 — a little bounce, since this is a drawer/sheet
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.032); // clamp so a dropped/backgrounded frame can't fling it
    last = now;
    const force = -stiffness * (AI_DRAWER_X - target) - damping * AI_DRAWER_V;
    AI_DRAWER_V += force * dt;
    AI_DRAWER_X += AI_DRAWER_V * dt;
    applyDrawerTransform(AI_DRAWER_X);
    if(Math.abs(AI_DRAWER_X - target) > 0.001 || Math.abs(AI_DRAWER_V) > 0.001){
      AI_DRAWER_RAF = requestAnimationFrame(frame);
    } else {
      AI_DRAWER_X = target; AI_DRAWER_V = 0;
      applyDrawerTransform(target);
    }
  }
  AI_DRAWER_RAF = requestAnimationFrame(frame);
}
function setAIOpen(open){
  AI_OPEN = open;
  render();
  if(open) scrollAiLog();
  animateDrawerTo(open ? 0 : 1);
}
function toggleAI(){ setAIOpen(!AI_OPEN); }

async function sendAI(question){
  if(!question || AI_BUSY) return;
  AI_LOG.push({role:'user', text:question});
  if(!AI_SETTINGS.apiKey && !HAS_ARTIFACT_STORAGE){
    AI_LOG.push({role:'assistant', text: 'This is running standalone (outside a Claude conversation), so the built-in connection isn\'t available here. Add your Anthropic API key in Settings (⚙) to use the assistant.'});
    render();
    scrollAiLog();
    return;
  }
  AI_BUSY = true;
  render();
  scrollAiLog();

  const context = {
    brands: DATA.brands.map(b => ({
      id:b.id, name:b.name, status:b.status,
      brief: b.brief ? {
        status: b.brief.status, cadenceType: b.brief.cadenceType, cadenceCount: b.brief.cadenceCount,
        basePay: b.brief.basePay, cpmBonus: b.brief.cpmBonus, viewRequirement: b.brief.viewRequirement,
        viewRequirementWindowDays: b.brief.viewRequirementWindowDays,
        platforms: b.brief.platforms
      } : null,
      totals: brandTotals(b.id)
    })),
    content: DATA.content.map(c => ({
      id:c.id, title:c.title, brand: brandById(c.brandId)?.name || 'Unknown',
      platforms:(c.platforms||[]).filter(p=>p.active).map(p=>({platform:p.id, status:p.status, postDate:p.postDate, views:p.views})),
      basePay:c.basePay, cpmBonus:c.cpmBonus,
      viewRequirement:c.viewRequirement, viewRequirementMet:c.viewRequirementMet, viewRequirementWindowDays:c.viewRequirementWindowDays,
      viewRequirementExpired: isViewRequirementExpired(c),
      scheduledDate: c.scheduledDate,
    })),
    payments: DATA.payments.map(p => ({ brand: brandById(p.brandId)?.name || 'Unknown', amount:p.amount, date:p.date })),
    tasks: DATA.tasks.map(t => ({ id:t.id, title:t.title, brand: t.brandId ? (brandById(t.brandId)?.name || 'Unknown') : null, priority:t.priority, daily:t.daily, requiresTimer:t.requiresTimer, doneToday:isTaskDoneToday(t) })),
    today: todayISO(),
  };

  try{
    // Replay prior turns so Claude actually has conversational memory —
    // the earlier bug sent every question as an isolated one-off request.
    const history = AI_LOG
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(0, -1) // drop the question we just pushed above; it's added fresh below with live context
      .slice(-20)   // cap history length to keep payload size sane
      .map(m => ({ role: m.role, content: m.text }));

    const messages = [
      ...history,
      { role:'user', content: `Dashboard data:\n${JSON.stringify(context)}\n\nQuestion: ${question}` }
    ];

    const usingOwnKey = !!AI_SETTINGS.apiKey;
    const fetchHeaders = usingOwnKey
      ? { "Content-Type": "application/json", "x-api-key": AI_SETTINGS.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }
      : { "Content-Type": "application/json" };
    const modelToUse = usingOwnKey ? AI_SETTINGS.model : "claude-sonnet-4-6"; // no-key path uses the artifact's built-in connection, which is pinned to this model

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: fetchHeaders,
      body: JSON.stringify({
        model: modelToUse,
        max_tokens: 2200,
        system: "You are a concise assistant embedded in a UGC creator's ops dashboard. Answer using ONLY the JSON data provided about their brands, content, payments, and tasks. Earnings only count once a platform is published and (if set) the view requirement is confirmed hit \u2014 'pending' items haven't cleared that yet. Payments are logged in bulk against a brand (not per video) \u2014 a brand's Outstanding is its total earned minus everything logged for it in payments; paid/outstanding status per video is computed automatically (oldest earned content gets settled first), it is never set directly. Be direct, use short paragraphs or lists, use $ for money. Each brand may include a 'brief' object with defaults it already has on file (basePay, cpmBonus, viewRequirement, platforms, cadence). When adding content for a brand that has a brief, use those defaults automatically instead of asking the user for pay, platform, or view requirement \u2014 only ask if the brand has no brief at all, or if the user's own message says something that conflicts with the brief (e.g. a different rate for this one video).\n\nYou can take actions on the user's behalf, and you can batch many actions into a single reply \u2014 this matters because the user may ask for hundreds of videos at once, and they should never have to confirm one at a time for a bulk request like that. End your reply with exactly one fenced block containing a JSON ARRAY of action objects, even if it's only one:\n```action\n[{...}, {...}]\n```\nOnly emit the block when the request is unambiguous \u2014 if you're missing a required detail (which brand, what amount, what title, how many), ask a plain question instead and wait for their answer. Never invent an id; always copy an 'id' field exactly from the data provided. For any delete action, only act after the user has explicitly confirmed in their own words that they want it deleted \u2014 never delete on the first ask.\n\nWhen the user asks you to log a payment, always ask whether a CPM bonus was included in that amount before logging it, unless they already said so unprompted (e.g. \"got $600, $100 of that was a CPM bonus\"). amount is always the total actually received; cpmBonus (optional, default 0) is just the portion of that total that was a bonus, for their own record-keeping \u2014 it does not add on top of amount.\n\nCRITICAL \u2014 never write more than about 15 individual add_content actions by hand in one reply. If a request needs more videos than that, it always fits one of the two batch actions below instead \u2014 use one of them, never enumerate videos one by one for a bulk request. Writing dozens of individual JSON objects risks the response being cut off mid-way, which silently fails the whole thing.\n\n- add_content_batch: many videos that all share the exact same post date (or are all still unposted):\n{\"type\":\"add_content_batch\",\"brandId\":\"<id>\",\"count\":50,\"titlePrefix\":\"PureFi Video\",\"basePay\":10,\"cpmBonus\":0,\"platforms\":[\"tiktok\",\"instagram\",\"youtube\"],\"status\":\"idea\",\"viewRequirement\":null,\"viewRequirementWindowDays\":null}\nThis creates videos titled \"PureFi Video 1\" through \"PureFi Video 50\" (or however many), all otherwise identical.\n\nviewRequirementWindowDays (optional, null/7/30) means: if the view requirement isn't hit within that many days of the post date, it's written off and stops counting as pending money instead of sitting there forever. Use a brand's brief.viewRequirementWindowDays as the default when adding content for that brand, same as its pay rate and view requirement.\n\n- add_content_daily_batch: for any cadence-based bulk request \u2014 'N videos a day for M days', 'backfill 37 videos, 2 a day since a date', 'X per week' converted to a daily count, etc. It spreads a fixed number per day across a date range automatically, incrementing the post date each day:\n{\"type\":\"add_content_daily_batch\",\"brandId\":\"<id>\",\"startDate\":\"YYYY-MM-DD\",\"perDay\":2,\"days\":18,\"basePay\":20,\"cpmBonus\":0,\"platforms\":[\"tiktok\",\"instagram\"],\"status\":\"published\",\"viewRequirement\":300,\"viewRequirementMet\":true,\"viewRequirementWindowDays\":30,\"titlePrefix\":\"Amboras Ongoing\"}\nThis creates perDay*days videos total, dated startDate, startDate+1, startDate+2, ... with perDay videos sharing each date. Only sets a post date on items when status is 'published'. Use this for both backfilling known past history and for scheduling a fixed number of upcoming videos at a cadence.\n\nFor a truly open-ended, indefinite cadence ('ongoing forever until I say stop', no end date at all), a fixed batch isn't the right fit \u2014 tell the user you can add a bounded batch now (ask for a count or an end date), and mention they can also set up a recurring brief directly on the brand's edit screen for indefinite daily quotas, since that's built for exactly that case and isn't something you can configure yourself.\n\nIf a request needs a brand that doesn't exist yet AND a batch of content for it in the same reply, chain them: give the add_brand action a \"ref\" (any short label you pick), then use \"brandRef\" instead of \"brandId\" in the actions that follow it in the same array:\n[{\"type\":\"add_brand\",\"ref\":\"b1\",\"name\":\"New Brand\"},{\"type\":\"add_content_batch\",\"brandRef\":\"b1\",\"count\":20,\"titlePrefix\":\"New Brand Video\",\"basePay\":15,\"platforms\":[\"tiktok\"],\"status\":\"idea\"}]\n\nOther action types and their exact shape:\n- Log a payment received for a brand: {\"type\":\"log_payment\",\"brandId\":\"<id>\",\"amount\":120,\"cpmBonus\":0,\"note\":\"optional\"}\n- Add a new brand: {\"type\":\"add_brand\",\"name\":\"Brand name\",\"status\":\"active\",\"notes\":\"optional\",\"ref\":\"optional label\"}\n- Add a single content item: {\"type\":\"add_content\",\"brandId\":\"<id>\",\"title\":\"Video title\",\"basePay\":20,\"cpmBonus\":0,\"platforms\":[\"tiktok\",\"instagram\",\"youtube\"],\"status\":\"idea\",\"postDate\":\"YYYY-MM-DD or omit\",\"viewRequirement\":null,\"viewRequirementWindowDays\":null} (platforms are which of tiktok/instagram/youtube/facebook are active for this deliverable)\n- Change a content item's status: {\"type\":\"set_status\",\"id\":\"<content id>\",\"status\":\"published\"}\n- Mark a content item's view requirement as hit or not: {\"type\":\"set_requirement_met\",\"id\":\"<content id>\",\"met\":true}\n- Add a task: {\"type\":\"add_task\",\"title\":\"Task title\",\"brandId\":\"<id or null>\",\"priority\":\"high\",\"daily\":false,\"requiresTimer\":false,\"timerMinutes\":10} (timerMinutes only matters when requiresTimer is true \u2014 default 10, but a fresh account warm-up often needs 30\u201345)\n- Toggle a task done/undone (for daily tasks this only affects today): {\"type\":\"toggle_task\",\"id\":\"<task id>\"}\n- Delete a content item, brand, or task (only after explicit confirmation): {\"type\":\"delete_content\",\"id\":\"<id>\"} or {\"type\":\"delete_brand\",\"id\":\"<id>\"} or {\"type\":\"delete_task\",\"id\":\"<id>\"}\n\nstatus must be one of: idea, scripting, filming, editing, ready, submitted, revision, approved, scheduled, published. \"scheduled\" means the user has a plan for when it will go out but hasn\u2019t posted it yet \u2014 use it, and set \"scheduledDate\" (YYYY-MM-DD) on the content item, whenever the user is batching/planning ahead rather than posting immediately (e.g. \"I filmed the next 10 for Amboras, starting the 21st\"). scheduledDate is the plan, separate from the real post date which only gets set once something is actually Published \u2014 never set both to the same thing unless it really did go live that day.\n\nIf the data can't answer a question, say so plainly.",
        messages: messages
      })
    });
    const dataRes = await res.json();
    if(dataRes.error){
      const hint = usingOwnKey ? ' Double-check the key and model in AI settings (⚙).' : '';
      AI_LOG.push({role:'assistant', text: `⚠️ ${dataRes.error.message || 'Anthropic API error'}.${hint}`});
      AI_BUSY = false;
      render();
      scrollAiLog();
      return;
    }
    let text = (dataRes.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n') || 'No response received.';
    const actionMatch = text.match(/```action\s*([\s\S]*?)```/);
    if(actionMatch){
      text = text.replace(actionMatch[0], '').trim();
      try{
        const parsed = JSON.parse(actionMatch[1]);
        const messages = executeAIActions(parsed);
        if(messages.length){
          const summary = messages.length > 6
            ? messages.slice(0,3).join('\n') + `\n…and ${messages.length-3} more.`
            : messages.join('\n');
          text = (text ? text + '\n\n' : '') + summary;
        }
      }catch(err){
        console.error('AI action parse failed', err);
        text = (text ? text + '\n\n' : '') + '⚠️ That action could not be applied — nothing was changed. Try asking again, maybe as a smaller request.';
      }
    } else if(text.includes('```action')){
      // the action block was opened but never closed — the response got cut off before finishing.
      // don't dump the raw unfinished JSON on the user; nothing was executed either way.
      text = text.slice(0, text.indexOf('```action')).trim();
      text = (text ? text + '\n\n' : '') + '⚠️ That response got cut off before it finished — nothing was changed. Try asking for a smaller batch, or breaking the request into a couple of smaller messages.';
    }
    AI_LOG.push({role:'assistant', text});
  }catch(e){
    AI_LOG.push({role:'assistant', text:'Something went wrong reaching Claude. Try again in a moment.'});
    console.error(e);
  }
  AI_BUSY = false;
  render();
  scrollAiLog();
}

/* ---------------- AI actions ----------------
   The AI can mutate the dashboard when asked (e.g. "log a $300
   payment for PureFi", "add 200 videos for X"). It signals this with
   a fenced ```action block containing a JSON ARRAY of action objects
   (even a single action is wrapped in an array) — we parse it,
   execute every entry in order against a shared refMap so a brand
   created earlier in the same batch can be referenced by later
   entries, and strip the block from the shown text.
------------------------------------------------------------------ */
function resolveBrandId(action, refMap){
  if(action.brandId && DATA.brands.some(b=>b.id===action.brandId)) return action.brandId;
  if(action.brandRef && refMap && refMap[action.brandRef]) return refMap[action.brandRef];
  return action.brandId || null;
}
function nextTitleIndex(brandId, prefix){
  // scans existing content for "<prefix> <N>" under this brand and returns the next free N —
  // used so repeated/related batch calls (e.g. "23 published, then 7 more idea") never collide
  // on numbering even if the caller doesn't track where the last batch left off
  const escaped = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^' + escaped + ' (\\d+)$');
  let max = 0;
  DATA.content.forEach(c => {
    if(c.brandId !== brandId) return;
    const m = (c.title||'').match(re);
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return max + 1;
}
function aiLogPayment(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const amount = Number(action.amount)||0;
  if(amount<=0) return null;
  const cpmBonus = Number(action.cpmBonus)||0;
  DATA.payments.push({ id:uid('py_'), brandId:brand.id, amount, cpmBonus, date: todayISO(), note: action.note || 'Logged via AI assistant', createdAt: new Date().toISOString() });
  saveData();
  return cpmBonus
    ? `Logged a ${money(amount)} payment for ${brand.name} (includes ${money(cpmBonus)} CPM bonus).`
    : `Logged a ${money(amount)} payment for ${brand.name}.`;
}
function aiAddBrand(action, refMap){
  const name = (action.name||'').trim();
  if(!name) return null;
  const brand = {
    id:uid('br_'), name,
    status: action.status==='paused' ? 'paused' : 'active',
    color: (typeof action.color==='string' && /^#[0-9a-fA-F]{6}$/.test(action.color)) ? action.color : SWATCHES[DATA.brands.length % SWATCHES.length],
    notes: action.notes || ''
  };
  DATA.brands.push(brand);
  if(action.ref && refMap) refMap[action.ref] = brand.id;
  saveData();
  return `Added brand "${brand.name}".`;
}
function aiAddContent(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id); // default to all 3 — never create a video with zero active platforms
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const postDate = action.postDate || (status==='published' ? todayISO() : ''); // published implies it has a post date
  const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate } : p);
  const c = {
    id:uid('ct_'), brandId:brand.id, title:(action.title||'Untitled').trim(),
    basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date().toISOString(),
    viewRequirement: action.viewRequirement || null, viewRequirementMet:false,
    viewRequirementWindowDays: action.viewRequirementWindowDays || null,
    scheduledDate: action.scheduledDate || null,
    platforms
  };
  DATA.content.push(c);
  bumpBriefProgressForContentCreation(brand.id); // a real video was just logged — count it toward today's quota
  saveData();
  return `Added "${c.title}" for ${brand.name}.`;
}
function aiAddContentBatch(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const count = Math.max(1, Math.min(1000, Number(action.count)||0));
  if(count<=0) return null;
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id); // default to all 3 — never create a video with zero active platforms
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const postDate = action.postDate || (status==='published' ? todayISO() : ''); // published implies it has a post date
  const prefix = (action.titlePrefix || `${brand.name} video`).trim();
  const startIndex = action.startIndex ? Math.max(1, Number(action.startIndex)) : nextTitleIndex(brand.id, prefix);
  for(let i=0; i<count; i++){
    const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate } : p);
    DATA.content.push({
      id:uid('ct_'), brandId:brand.id, title:`${prefix} ${startIndex+i}`,
      basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date(Date.now()+i).toISOString(),
      viewRequirement: action.viewRequirement || null, viewRequirementMet:false,
      viewRequirementWindowDays: action.viewRequirementWindowDays || null,
      scheduledDate: action.scheduledDate || null,
      platforms
    });
  }
  saveData();
  return `Added ${count} videos for ${brand.name} ("${prefix} ${startIndex}" through "${prefix} ${startIndex+count-1}").`;
}
function aiAddContentDailyBatch(action, refMap){
  const brand = DATA.brands.find(b=>b.id===resolveBrandId(action, refMap));
  if(!brand) return null;
  const perDay = Math.max(1, Math.min(20, Number(action.perDay)||1));
  const days = Math.max(1, Math.min(365, Number(action.days)||1));
  const total = perDay * days;
  if(total > 2000) return null; // sanity cap
  const requested = Array.isArray(action.platforms) ? action.platforms.filter(p => PLATFORMS.some(x=>x.id===p)) : [];
  const activeIds = requested.length ? requested : PLATFORMS.map(p=>p.id);
  const status = STATUSES.includes(action.status) ? action.status : 'idea';
  const viewRequirement = action.viewRequirement || null;
  const viewRequirementMet = viewRequirement ? !!action.viewRequirementMet : false;
  const viewRequirementWindowDays = action.viewRequirementWindowDays || null;
  const prefix = (action.titlePrefix || `${brand.name} video`).trim();
  const startDate = (typeof action.startDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(action.startDate)) ? action.startDate : todayISO();
  const start = new Date(startDate+'T00:00:00');
  const firstIndex = action.startIndex ? Math.max(1, Number(action.startIndex)) : nextTitleIndex(brand.id, prefix);
  let counter = firstIndex;
  for(let d=0; d<days; d++){
    const dayDate = new Date(start.getFullYear(), start.getMonth(), start.getDate()+d);
    const dateStr = dayDate.toISOString().slice(0,10);
    for(let i=0; i<perDay; i++){
      const platforms = normalizePlatforms([]).map(p => activeIds.includes(p.id) ? { ...p, active:true, status, postDate: status==='published' ? dateStr : '' } : p);
      DATA.content.push({
        id:uid('ct_'), brandId:brand.id, title:`${prefix} ${counter}`,
        basePay:Number(action.basePay)||0, cpmBonus:Number(action.cpmBonus)||0, createdAt: new Date(Date.now()+counter).toISOString(),
        viewRequirement, viewRequirementMet, viewRequirementWindowDays,
        scheduledDate: status==='published' ? null : dateStr, // if it's not published yet, this date is the plan, not a real post date
        platforms
      });
      counter++;
    }
  }
  saveData();
  return `Added ${total} videos for ${brand.name}, ${perDay}/day starting ${fmtDate(startDate)} ("${prefix} ${firstIndex}" through "${prefix} ${firstIndex+total-1}").`;
}
function aiSetStatus(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c || !STATUSES.includes(action.status)) return null;
  const hadActive = c.platforms.some(p=>p.active);
  if(!hadActive){
    // nothing was ever marked active on this item — default to all 3 rather than silently no-op'ing
    c.platforms.forEach(p => { p.active = true; });
  }
  c.platforms.forEach(p => {
    if(p.active){
      p.status = action.status;
      // "published" with no post date is invisible to every time-scoped view (week/month/chart) even
      // though it correctly counts toward lifetime totals — backfill today's date so it isn't silently lost.
      if(action.status==='published' && !p.postDate) p.postDate = todayISO();
    }
  });
  saveData();
  return hadActive
    ? `Set "${c.title||'Untitled'}" to ${STATUS_LABEL[action.status]}.`
    : `"${c.title||'Untitled'}" had no platforms active, so I activated all 3 and set it to ${STATUS_LABEL[action.status]}.`;
}
function aiSetRequirementMet(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c) return null;
  c.viewRequirementMet = !!action.met;
  saveData();
  return `Marked view requirement ${action.met ? 'hit':'not hit'} for "${c.title||'Untitled'}".`;
}
function aiAddTask(action, refMap){
  const title = (action.title||'').trim();
  if(!title) return null;
  const priority = PRIORITIES.some(p=>p.id===action.priority) ? action.priority : 'medium';
  const brandId = action.brandId || action.brandRef ? resolveBrandId(action, refMap) : '';
  const t = { id:uid('tk_'), title, brandId: brandId || '', priority, daily: !!action.daily, requiresTimer: !!action.requiresTimer, timerMinutes: Math.max(1, Math.min(240, Number(action.timerMinutes)||10)), completed:false, dailyDone:{}, createdAt: todayISO() };
  DATA.tasks.push(t);
  saveData();
  return `Added task "${t.title}".`;
}
function aiToggleTask(action){
  const t = DATA.tasks.find(x=>x.id===action.id);
  if(!t) return null;
  toggleTaskDone(t.id);
  return `Toggled "${t.title}".`;
}
function aiDeleteContent(action){
  const c = DATA.content.find(x=>x.id===action.id);
  if(!c) return null;
  DATA.content = DATA.content.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted "${c.title||'Untitled'}".`;
}
function aiDeleteBrand(action){
  const b = DATA.brands.find(x=>x.id===action.id);
  if(!b) return null;
  DATA.brands = DATA.brands.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted brand "${b.name}".`;
}
function aiDeleteTask(action){
  const t = DATA.tasks.find(x=>x.id===action.id);
  if(!t) return null;
  DATA.tasks = DATA.tasks.filter(x=>x.id!==action.id);
  saveData();
  return `Deleted task "${t.title}".`;
}
function executeAIAction(action, refMap){
  refMap = refMap || {};
  if(!action || !action.type) return null;
  switch(action.type){
    case 'log_payment': return aiLogPayment(action, refMap);
    case 'add_brand': return aiAddBrand(action, refMap);
    case 'add_content': return aiAddContent(action, refMap);
    case 'add_content_batch': return aiAddContentBatch(action, refMap);
    case 'add_content_daily_batch': return aiAddContentDailyBatch(action, refMap);
    case 'set_status': return aiSetStatus(action);
    case 'set_requirement_met': return aiSetRequirementMet(action);
    case 'add_task': return aiAddTask(action, refMap);
    case 'toggle_task': return aiToggleTask(action);
    case 'delete_content': return aiDeleteContent(action);
    case 'delete_brand': return aiDeleteBrand(action);
    case 'delete_task': return aiDeleteTask(action);
    default: return null;
  }
}
function executeAIActions(actionsInput){
  const actionsArr = (Array.isArray(actionsInput) ? actionsInput : [actionsInput]).slice(0, 50);
  const refMap = {};
  const messages = [];
  actionsArr.forEach(action => {
    try{
      const msg = executeAIAction(action, refMap);
      if(msg) messages.push(msg);
    }catch(err){ console.error('AI action failed', action, err); }
  });
  return messages;
}

/* ---------------- date picker (used for post dates & payment dates) ---------------- */
function getDPValue(key){
  const [type, a, b] = key.split(':');
  if(type==='draftplatform'){ const p = MODAL_STATE.draft.platforms.find(x=>x.id===a); return p ? p.postDate : ''; }
  if(type==='livecontent'){ const c = DATA.content.find(x=>x.id===a); const p = c && c.platforms.find(x=>x.id===b); return p ? p.postDate : ''; }
  if(type==='payment'){ const target = a==='draft' ? MODAL_STATE.draft : DATA.payments.find(x=>x.id===a); return target ? target.date : ''; }
  if(type==='pubfilter'){ return a==='start' ? PUB_FILTER.customStart : PUB_FILTER.customEnd; }
  if(type==='contentfilter'){ return a==='start' ? CONTENT_FILTER.customStart : CONTENT_FILTER.customEnd; }
  if(type==='scheduled'){ const target = a==='draft' ? MODAL_STATE.draft : DATA.content.find(x=>x.id===a); return target ? target.scheduledDate : ''; }
  if(type==='trialstart'){ return MODAL_STATE.draft && MODAL_STATE.draft.brief ? MODAL_STATE.draft.brief.trialStartDate : ''; }
  return '';
}
function setDPValue(key, val){
  const [type, a, b] = key.split(':');
  if(type==='draftplatform'){ const p = MODAL_STATE.draft.platforms.find(x=>x.id===a); if(p) p.postDate = val; }
  if(type==='livecontent'){ const c = DATA.content.find(x=>x.id===a); const p = c && c.platforms.find(x=>x.id===b); if(p){ p.postDate = val; saveData(); } }
  if(type==='payment'){ if(a==='draft'){ MODAL_STATE.draft.date = val; } else { const p = DATA.payments.find(x=>x.id===a); if(p){ p.date = val; saveData(); } } }
  if(type==='pubfilter'){ if(a==='start') PUB_FILTER.customStart = val; else PUB_FILTER.customEnd = val; }
  if(type==='contentfilter'){ if(a==='start') CONTENT_FILTER.customStart = val; else CONTENT_FILTER.customEnd = val; }
  if(type==='scheduled'){ if(a==='draft'){ MODAL_STATE.draft.scheduledDate = val; } else { const c = DATA.content.find(x=>x.id===a); if(c){ c.scheduledDate = val; saveData(); } } }
  if(type==='trialstart'){ if(!MODAL_STATE.draft.brief) MODAL_STATE.draft.brief = {}; MODAL_STATE.draft.brief.trialStartDate = val; }
}

/* ---------------- timer-complete popup + chime ---------------- */
function playTimerDoneSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const beep = (freq, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    beep(880, 0, 0.32);
    beep(1180, 0.22, 0.28);
  }catch(e){ /* audio unavailable — visual popup still shows */ }
}
function tryBrowserNotification(taskTitle){
  try{
    if(typeof Notification === 'undefined') return;
    const fire = () => new Notification('Timer complete', { body: `"${taskTitle}" marked done.` });
    if(Notification.permission === 'granted') fire();
    else if(Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p==='granted') fire(); });
  }catch(e){ /* notifications unavailable in this environment — visual popup still shows */ }
}
function renderTimerDonePopup(){
  if(!TIMER_DONE_POPUP) return '';
  return `<div class="overlay open ${TIMER_ENTER?'overlay-enter':''}" style="z-index:400;" id="timerDoneOverlay">
    <div class="modal timer-done-modal" style="max-width:340px; margin-top:24vh; text-align:center;">

      <div style="color:var(--text-dim); font-size:13px; margin-bottom:20px; line-height:1.5;">"${escapeHtml(TIMER_DONE_POPUP.taskTitle)}" ran its 10 minutes and is marked done.</div>
      <button class="btn btn-primary" id="timerDoneOk" type="button" style="width:100%;">Got it</button>
    </div>
  </div>`;
}

/* ---------------- modals ---------------- */
let MODAL_STATE = { type:null, id:null, draft:null };
let MODAL_ENTER = false; // true only for the single render() call that opens a modal — a fresh CSS
// animation plays whenever a node is first created, and root.innerHTML is rebuilt on every render(),
// so without this flag the modal would replay its pop-in every time e.g. the date picker opens inside it.

function openModal(type, id=null){
  MODAL_STATE.type = type;
  MODAL_STATE.id = id;
  if(type==='brand'){
    const existing = id ? brandById(id) : null;
    MODAL_STATE.draft = existing ? {...existing} : { id:uid('br_'), name:'', status:'active', color: SWATCHES[DATA.brands.length % SWATCHES.length], notes:'' };

    const existing = id ? DATA.content.find(c=>c.id===id) : null;

      viewRequirement:null, viewRequirementMet:false, viewRequirementWindowDays:null, scheduledDate:null,
      platforms: normalizePlatforms([])
    };

  } else if(type==='payment'){
    MODAL_STATE.draft = { id:uid('py_'), brandId: DATA.brands[0]?.id || '', amount:0, cpmBonus:0, date: todayISO(), note:'' };
  } else if(type==='task'){

  render();
  MODAL_ENTER = false;

function renderBrandModal(){
  const d = MODAL_STATE.draft;
  const brief = d.brief;
  return `<div class="modal ${MODAL_ENTER?'modal-enter':''}" style="max-width:520px;">
    <h3>${MODAL_STATE.id ? 'Edit brand' : 'Add brand'}</h3>
    <div class="field"><label>Name</label><input type="text" id="f-name" value="${escapeHtml(d.name)}" placeholder="e.g. PureFi" /></div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f-status"><option value="active" ${d.status==='active'?'selected':''}>Active</option><option value="paused" ${d.status==='paused'?'selected':''}>Paused</option></select>
      </div>
      <div class="field"><label>Color</label>
        <input type="color" id="f-color" value="${d.color}" />
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Deal terms, contact, anything worth remembering">${escapeHtml(d.notes)}</textarea></div>

    <div class="section-title" style="margin-top:18px;">Brief</div>
    <div class="field"><label><input type="checkbox" class="checkbox" id="f-briefEnabled" ${brief?'checked':''}/> This brand has a content brief</label></div>
    <div id="briefFields" style="display:${brief?'block':'none'};">
      <div class="field-row">
        <div class="field"><label>Brief type</label>
          <select id="f-briefKind">
            <option value="recurring" ${!brief || brief.kind!=='trial' ? 'selected' : ''}>Recurring — ongoing until you pause/end it</option>
            <option value="trial" ${brief && brief.kind==='trial' ? 'selected' : ''}>Trial — fixed period, e.g. 30 days</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select id="f-briefStatus">
            <option value="active" ${brief&&brief.status==='active'?'selected':''}>Active</option>
            <option value="paused" ${brief&&brief.status==='paused'?'selected':''}>Paused</option>
            <option value="ended" ${brief&&brief.status==='ended'?'selected':''}>Ended</option>
          </select>
        </div>
      </div>
      <div class="hint" style="margin-top:-6px;">Paused/Ended stops the daily quota but keeps everything below saved — switch back to Active anytime without re-entering it. Only unchecking the box above wipes it.</div>
      <div id="trialFields" style="display:${brief && brief.kind==='trial' ? 'block' : 'none'};">
        <div class="field-row">
          <div class="field"><label>Trial start date</label>
            <button type="button" class="date-trigger ${brief && brief.trialStartDate ? '' : 'empty'}" data-datepicker="trialstart:draft" style="width:100%; text-align:left;">${brief && brief.trialStartDate ? fmtDate(brief.trialStartDate) : 'Set start date'}</button>
          </div>
          <div class="field"><label>Trial length (days)</label><input type="number" id="f-briefTrialDays" value="${brief && brief.trialDurationDays ? brief.trialDurationDays : 30}" min="1" /></div>
        </div>
        ${(() => { const trial = briefTrialInfo(brief); return trial ? `<div class="hint" style="margin-top:-6px;">${trial.expired ? `Trial ended ${fmtDate(trial.endDate)} (${Math.abs(trial.daysRemaining)} days ago).` : `Ends ${fmtDate(trial.endDate)} — ${trial.daysRemaining} day${trial.daysRemaining===1?'':'s'} left.`} Doesn't auto-change anything — upgrade or end it yourself whenever you're ready.</div>` : ''; })()}
        ${MODAL_STATE.id && brief && brief.kind==='trial' ? `<div class="field"><button type="button" class="btn btn-primary btn-sm" id="upgradeToRecurring" style="width:100%;">Upgrade to recurring brief</button></div>` : ''}
      </div>
      <div class="field-row">
        <div class="field"><label>Cadence</label>
          <div style="display:flex; gap:6px;">
            <input type="number" id="f-briefCount" value="${brief?brief.cadenceCount:14}" style="width:70px;" />
            <select id="f-briefType" style="flex:1;">
              <option value="perDay" ${brief&&brief.cadenceType==='perDay'?'selected':''}>per day</option>
              <option value="perWeek" ${!brief||brief.cadenceType==='perWeek'?'selected':''}>per week</option>
              <option value="perMonth" ${brief&&brief.cadenceType==='perMonth'?'selected':''}>per month</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Base pay per video ($)</label><input type="number" id="f-briefBasePay" value="${brief?brief.basePay:20}" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>CPM bonus ($, optional)</label><input type="number" id="f-briefCpmBonus" value="${brief?brief.cpmBonus:0}" /></div>
        <div></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Minimum view requirement (optional — applied to every auto-created video)</label><input type="number" id="f-briefViewReq" value="${brief && brief.viewRequirement ? brief.viewRequirement : ''}" placeholder="e.g. 1000 — leave blank for none" /></div>
        <div class="field"><label>Requirement window</label>
          <select id="f-briefViewReqWindow">
            <option value="" ${!brief || !brief.viewRequirementWindowDays ? 'selected' : ''}>No expiry — track forever</option>
            <option value="7" ${brief && brief.viewRequirementWindowDays==7 ? 'selected' : ''}>7 days</option>
            <option value="30" ${brief && brief.viewRequirementWindowDays==30 ? 'selected' : ''}>30 days</option>
          </select>
        </div>
      </div>
      <div class="hint" style="margin-top:-6px;">If a video misses its view requirement within this window, it drops out of Pending instead of sitting there forever — leave it on "No expiry" for brands that pay out regardless of how long it takes.</div>
      <div class="field"><label>Daily warm-up tasks (off by default — turn these on when you're ready)</label>
        <div style="display:flex; gap:16px; padding:4px 0;">
          <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color:var(--text);"><input type="checkbox" class="checkbox" id="f-briefWarmupTT" ${brief && brief.warmupTikTok ? 'checked' : ''}/> TikTok — 10 min</label>
          <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color:var(--text);"><input type="checkbox" class="checkbox" id="f-briefWarmupIG" ${brief && brief.warmupInstagram ? 'checked' : ''}/> Instagram — 10 min</label>
        </div>
        <div class="hint" style="margin-top:2px;">Turning one of these on adds it as a real recurring daily task (same timer/popup as your other warm-up tasks) — manage or delete it anytime from the Tasks tab.</div>
      </div>
      <div class="field"><label>Default platforms for auto-created videos</label>
        <div style="display:flex; gap:14px; padding:4px 0;">
          ${PLATFORMS.map(p=>`<label style="display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--text);"><input type="checkbox" class="checkbox f-brief-platform" value="${p.id}" ${brief && brief.platforms.includes(p.id) ? 'checked' : (!brief && p.id!=='facebook' ? 'checked' : '')}/> ${p.short}</label>`).join('')}
        </div>
      </div>
      <div class="hint" id="briefQuotaHint">${brief ? `Today's quota with this cadence: ${briefDayQuota(brief, new Date().getDay())} video${briefDayQuota(brief,new Date().getDay())===1?'':'s'}.` : ''}</div>
      <div class="hint">Pressing "+1 Made" on the quota widget creates a video (idea status) for this brand automatically — no manual entry needed for regular deliverables.</div>
    </div>

    <div class="modal-actions">
      <div>${MODAL_STATE.id ? `<button class="btn btn-danger btn-sm" id="deleteBrand" type="button">Delete brand</button>` : ''}</div>
      <div class="right"><button class="btn btn-ghost" id="cancelModal" type="button">Cancel</button><button class="btn btn-primary" id="saveBrand" type="button">Save</button></div>
    </div>
  </div>`;
}

function renderContentModal(){
  const d = MODAL_STATE.draft;
  const selectedBrand = brandById(d.brandId);
  const hasBrief = !MODAL_STATE.id && selectedBrand && selectedBrand.brief;
  return `<div class="modal ${MODAL_ENTER?'modal-enter':''}" style="max-width:640px;">
    <h3>${MODAL_STATE.id ? 'Edit content' : 'Add content'}</h3>
    <div class="field-row">
      <div class="field"><label>Title</label><input type="text" id="f-title" value="${escapeHtml(d.title)}" placeholder="e.g. PureFi — Send Money Hook v2" /></div>
      <div class="field"><label>Brand</label>
        <select id="f-brand">${DATA.brands.length ? DATA.brands.map(b=>`<option value="${b.id}" ${d.brandId===b.id?'selected':''}>${escapeHtml(b.name)}</option>`).join('') : '<option value="">Add a brand first</option>'}</select>
      </div>
    </div>
    ${hasBrief ? `<div class="hint" style="margin-top:-6px;">Rate, view requirement, and platforms below are filled in from ${escapeHtml(selectedBrand.name)}'s brief — edit anything you need to for this one video.</div>` : ''}

    <div class="field"><label>Platforms posted to</label></div>

      const pd = d.platforms.find(x=>x.id===p.id);

        <div class="ph">
          <label><input type="checkbox" class="checkbox" data-p-active="${p.id}" ${pd.active?'checked':''}/> ${p.label}</label>
          <select data-p-status="${p.id}" class="status-select" style="${statusInlineStyle(pd.status)}" onchange="this.style.cssText=statusInlineStyle(this.value)">

          <div><div class="hint" style="margin:0 0 4px;">URL</div><input type="text" data-p-url="${p.id}" value="${escapeHtml(pd.url)}" placeholder="optional" /></div>
          <div><div class="hint" style="margin:0 0 4px;">Views (manual)</div><input type="number" data-p-views="${p.id}" value="${pd.views||''}" placeholder="optional" /></div>

    <div class="field-row" style="margin-top:14px;">

      <div class="field"><label>CPM bonus ($, manual)</label><input type="number" id="f-cpmbonus" value="${d.cpmBonus}" step="0.01" /></div>
    </div>
    <div class="field">
      <label>Scheduled date (optional — your plan; separate from the real post date above, in case posting slips)</label>
      <button type="button" class="date-trigger ${d.scheduledDate?'':'empty'}" data-datepicker="scheduled:draft" style="width:100%; text-align:left;">${d.scheduledDate?fmtDate(d.scheduledDate):'Set scheduled date'}</button>
    </div>
    <div class="field-row">
      <div class="field"><label>View requirement (optional)</label><input type="number" id="f-viewreq" value="${d.viewRequirement||''}" placeholder="e.g. 1000" /></div>
      <div class="field"><label>Requirement window</label>
        <select id="f-viewreqwindow">
          <option value="" ${!d.viewRequirementWindowDays ? 'selected' : ''}>No expiry</option>
          <option value="7" ${d.viewRequirementWindowDays==7 ? 'selected' : ''}>7 days</option>
          <option value="30" ${d.viewRequirementWindowDays==30 ? 'selected' : ''}>30 days</option>
        </select>
      </div>
    </div>
    <div class="field">
      <button type="button" class="btn btn-sm ${d.viewRequirementMet?'btn-primary':'btn-ghost'}" id="f-viewreqmet" style="width:100%;">${d.viewRequirementMet ? 'Requirement hit ✓ (click to undo)' : 'Mark requirement as hit'}</button>

    <div class="hint">Earnings only count once a platform here is set to Published — and, if you set a view requirement, once you've checked the views yourself and clicked "Mark requirement as hit." If you also set a window and it passes unmet, this drops out of Pending instead of sitting there forever. Payments are logged separately on the Payments tab; you don't need to mark individual videos as paid.</div>

    <div class="modal-actions">
      <div>${MODAL_STATE.id ? `<button class="btn btn-danger btn-sm" id="deleteContent" type="button">Delete</button>` : ''}</div>
      <div class="right"><button class="btn btn-ghost" id="cancelModal" type="button">Cancel</button><button class="btn btn-primary" id="saveContent" type="button">Save</button></div>

/* ---------------- handlers ---------------- */
function bindGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { VIEW = el.dataset.nav; ACTIVE_BRAND_FILTER=null; render(); }));
  document.querySelectorAll('[data-open-modal]').forEach(el => el.addEventListener('click', () => openModal(el.dataset.openModal)));
  document.querySelectorAll('[data-goto-brand]').forEach(el => el.addEventListener('click', () => { VIEW='content'; ACTIVE_BRAND_FILTER = el.dataset.gotoBrand; render(); }));
  document.querySelectorAll('[data-open-content]').forEach(el => el.addEventListener('click', () => openModal('content', el.dataset.openContent)));
  document.querySelectorAll('[data-open-brand], [data-edit-brand]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); openModal('brand', el.dataset.openBrand || el.dataset.editBrand); }));
  document.querySelectorAll('[data-del-payment]').forEach(el => el.addEventListener('click', () => { DATA.payments = DATA.payments.filter(p=>p.id!==el.dataset.delPayment); saveData(); render(); }));
  document.querySelectorAll('[data-edit-task]').forEach(el => el.addEventListener('click', () => openModal('task', el.dataset.editTask)));

  // dashboard range + chart type
  document.querySelectorAll('[data-range]').forEach(el => el.addEventListener('click', () => { DASH_RANGE = el.dataset.range; render(); }));
  document.querySelectorAll('[data-chart-point]').forEach(el => {
    const idx = Number(el.dataset.chartPoint);
    el.addEventListener('mouseenter', (e) => showChartTooltip(idx, e.clientX, e.clientY));
    el.addEventListener('mousemove', (e) => positionChartTooltip(e.clientX, e.clientY));
    el.addEventListener('mouseleave', hideChartTooltip);
  });

  // tasks
  document.querySelectorAll('[data-edit-priority]').forEach(el => el.addEventListener('change', () => {
    const t = DATA.tasks.find(x=>x.id===el.dataset.editPriority); if(t){ t.priority = el.value; saveData(); render(); }
  }));
  document.querySelectorAll('[data-toggle-task]').forEach(el => el.addEventListener('click', () => toggleTaskDone(el.dataset.toggleTask)));
  document.querySelectorAll('[data-start-timer]').forEach(el => el.addEventListener('click', () => startTaskTimer(el.dataset.startTimer)));
  document.querySelectorAll('[data-cancel-timer]').forEach(el => el.addEventListener('click', () => cancelTaskTimer(el.dataset.cancelTimer)));

  const brandFilter = document.getElementById('brandFilter');
  if(brandFilter) brandFilter.addEventListener('change', () => { ACTIVE_BRAND_FILTER = brandFilter.value || null; render(); });
  const contentDatePreset = document.getElementById('contentDatePreset');
  if(contentDatePreset) contentDatePreset.addEventListener('change', () => { CONTENT_FILTER.datePreset = contentDatePreset.value; render(); });
  const contentStatusFilter = document.getElementById('contentStatusFilter');
  if(contentStatusFilter) contentStatusFilter.addEventListener('change', () => { CONTENT_FILTER.status = contentStatusFilter.value; render(); });
  const contentDateField = document.getElementById('contentDateField');
  if(contentDateField) contentDateField.addEventListener('change', () => { CONTENT_FILTER.dateField = contentDateField.value; render(); });
  const paymentsBrandFilter = document.getElementById('paymentsBrandFilter');
  if(paymentsBrandFilter) paymentsBrandFilter.addEventListener('change', () => { PAYMENTS_FILTER.brandId = paymentsBrandFilter.value; render(); });

  // published tab filters + inline edits
  const pubBrand = document.getElementById('pubBrand');
  if(pubBrand) pubBrand.addEventListener('change', () => { PUB_FILTER.brandId = pubBrand.value; render(); });
  const pubPlatform = document.getElementById('pubPlatform');
  if(pubPlatform) pubPlatform.addEventListener('change', () => { PUB_FILTER.platform = pubPlatform.value; render(); });
  const pubViewReq = document.getElementById('pubViewReq');
  if(pubViewReq) pubViewReq.addEventListener('change', () => { PUB_FILTER.viewReq = pubViewReq.value; render(); });
  const pubDatePreset = document.getElementById('pubDatePreset');
  if(pubDatePreset) pubDatePreset.addEventListener('change', () => { PUB_FILTER.datePreset = pubDatePreset.value; render(); });
  const pubSearch = document.getElementById('pubSearch');
  if(pubSearch) pubSearch.addEventListener('input', () => { PUB_FILTER.q = pubSearch.value; render(); pubSearch.focus(); pubSearch.setSelectionRange(pubSearch.value.length, pubSearch.value.length); });

  document.querySelectorAll('[data-edit-title]').forEach(el => el.addEventListener('change', () => {
    const c = DATA.content.find(x=>x.id===el.dataset.editTitle); if(c){ c.title = el.value; saveData(); render(); }
  }));
  document.querySelectorAll('[data-edit-status-all]').forEach(el => el.addEventListener('change', () => {
    const c = DATA.content.find(x=>x.id===el.dataset.editStatusAll);
    if(c){
      c.platforms.forEach(p => {
        if(p.active){
          p.status = el.value;
          // published with no post date is invisible to Earned in every time range, forever, until
          // someone notices and fixes it by hand — backfill today's date so that can't happen silently
          if(el.value==='published' && !p.postDate) p.postDate = todayISO();
        }
      });
      saveData(); render();
    }
  }));
  document.querySelectorAll('[data-edit-status]').forEach(el => el.addEventListener('change', () => {
    const [cid,pid] = el.dataset.editStatus.split(':');
    const c = DATA.content.find(x=>x.id===cid); const p = c && c.platforms.find(x=>x.id===pid);
    if(p){
      p.status = el.value;
      if(el.value==='published' && !p.postDate) p.postDate = todayISO();
      saveData(); render();
    }
  }));
  document.querySelectorAll('[data-edit-views]').forEach(el => el.addEventListener('change', () => {
    const [cid,pid] = el.dataset.editViews.split(':');
    const c = DATA.content.find(x=>x.id===cid); const p = c && c.platforms.find(x=>x.id===pid);
    if(p){ p.views = el.value; saveData(); render(); }
  }));
  document.querySelectorAll('[data-toggle-req]').forEach(el => el.addEventListener('click', () => {
    const c = DATA.content.find(x=>x.id===el.dataset.toggleReq); if(c){ c.viewRequirementMet = !c.viewRequirementMet; saveData(); render(); }
  }));
  document.querySelectorAll('[data-toggle-platform]').forEach(el => el.addEventListener('click', () => {
    const [cid, pid] = el.dataset.togglePlatform.split(':');
    const c = DATA.content.find(x=>x.id===cid);
    const p = c && c.platforms.find(x=>x.id===pid);
    if(!p) return;
    if(p.active){
      p.active = false;
    } else {
      p.active = true;
      if(p.status !== 'published') p.status = 'published';
      if(!p.postDate) p.postDate = todayISO();
    }
    saveData(); render();
  }));
  document.querySelectorAll('[data-make-brief]').forEach(el => el.addEventListener('click', () => makeBriefVideo(el.dataset.makeBrief)));
  document.querySelectorAll('[data-undo-brief]').forEach(el => el.addEventListener('click', () => undoBriefVideo(el.dataset.undoBrief)));

  // date picker triggers
  document.querySelectorAll('[data-datepicker]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); openDatePicker(el.dataset.datepicker, el); }));
  if(DP){
    const pop = document.getElementById('dpPopover');
    if(pop) pop.addEventListener('click', e => e.stopPropagation());
    const prev = document.querySelector('[data-dp-prev]');
    if(prev) prev.addEventListener('click', () => { DP.month = new Date(DP.month.getFullYear(), DP.month.getMonth()-1, 1); render(); });
    const next = document.querySelector('[data-dp-next]');
    if(next) next.addEventListener('click', () => { DP.month = new Date(DP.month.getFullYear(), DP.month.getMonth()+1, 1); render(); });
    document.querySelectorAll('[data-dp-pick]').forEach(el => el.addEventListener('click', () => { setDPValue(DP.key, el.dataset.dpPick); DP=null; render(); }));
    const clear = document.querySelector('[data-dp-clear]');
    if(clear) clear.addEventListener('click', () => { setDPValue(DP.key, ''); DP=null; render(); });
    const done = document.querySelector('[data-dp-close]');
    if(done) done.addEventListener('click', () => { DP=null; render(); });
    setTimeout(() => document.addEventListener('click', () => { if(DP){ DP=null; render(); } }, { once:true }), 0);
  }

  const cancel = document.getElementById('cancelModal');
  if(cancel) cancel.addEventListener('click', closeModal);
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.addEventListener('click', (e) => { if(e.target===overlay) closeModal(); });

  const confirmYes = document.getElementById('confirmYes');
  if(confirmYes) confirmYes.addEventListener('click', () => { const fn = CONFIRM_STATE.onYes; CONFIRM_STATE=null; fn(); });
  const confirmNo = document.getElementById('confirmNo');
  if(confirmNo) confirmNo.addEventListener('click', () => { CONFIRM_STATE=null; render(); });

  const timerDoneOk = document.getElementById('timerDoneOk');
  if(timerDoneOk) timerDoneOk.addEventListener('click', () => { TIMER_DONE_POPUP=null; render(); });
  const timerDoneOverlay = document.getElementById('timerDoneOverlay');
  if(timerDoneOverlay) timerDoneOverlay.addEventListener('click', (e) => { if(e.target===timerDoneOverlay){ TIMER_DONE_POPUP=null; render(); } });

  const contentBrandSelect = document.getElementById('f-brand');
  if(contentBrandSelect && MODAL_STATE.type==='content' && !MODAL_STATE.id){
    contentBrandSelect.addEventListener('change', () => {
      MODAL_STATE.draft.brandId = contentBrandSelect.value;
      applyBriefDefaultsToDraft(MODAL_STATE.draft, MODAL_STATE.draft.brandId);
      render();
      document.getElementById('overlay').classList.add('open');
    });
  }
  const briefEnabled = document.getElementById('f-briefEnabled');
  if(briefEnabled) briefEnabled.addEventListener('change', () => {
    const fields = document.getElementById('briefFields');
    if(fields) fields.style.display = briefEnabled.checked ? 'block' : 'none';
  });
  const briefKindSelect = document.getElementById('f-briefKind');
  if(briefKindSelect) briefKindSelect.addEventListener('change', () => {
    const trialFields = document.getElementById('trialFields');
    if(trialFields) trialFields.style.display = briefKindSelect.value==='trial' ? 'block' : 'none';
  });
  const upgradeToRecurringBtn = document.getElementById('upgradeToRecurring');
  if(upgradeToRecurringBtn) upgradeToRecurringBtn.addEventListener('click', () => {
    if(MODAL_STATE.draft.brief) MODAL_STATE.draft.brief.kind = 'recurring';
    render();
    document.getElementById('overlay').classList.add('open');
    showToast('Switched to a recurring brief — everything else stayed the same');
  });

  const saveBrand = document.getElementById('saveBrand');
  if(saveBrand) saveBrand.addEventListener('click', () => {
    const d = MODAL_STATE.draft;
    d.name = document.getElementById('f-name').value.trim() || 'Untitled brand';
    d.status = document.getElementById('f-status').value;
    d.color = document.getElementById('f-color').value;
    d.notes = document.getElementById('f-notes').value;
    const briefOn = document.getElementById('f-briefEnabled').checked;
    if(briefOn){
      const platforms = Array.from(document.querySelectorAll('.f-brief-platform:checked')).map(el=>el.value);
      const warmupTikTok = document.getElementById('f-briefWarmupTT').checked;
      const warmupInstagram = document.getElementById('f-briefWarmupIG').checked;
      const kind = document.getElementById('f-briefKind').value === 'trial' ? 'trial' : 'recurring';
      d.brief = {
        kind,
        status: document.getElementById('f-briefStatus').value,
        cadenceType: document.getElementById('f-briefType').value,
        cadenceCount: Number(document.getElementById('f-briefCount').value)||0,
        basePay: Number(document.getElementById('f-briefBasePay').value)||0,
        cpmBonus: Number(document.getElementById('f-briefCpmBonus').value)||0,
        viewRequirement: Number(document.getElementById('f-briefViewReq').value) || null,
        viewRequirementWindowDays: Number(document.getElementById('f-briefViewReqWindow').value) || null,
        trialStartDate: kind==='trial' ? ((d.brief && d.brief.trialStartDate) || todayISO()) : null,
        trialDurationDays: kind==='trial' ? (Number(document.getElementById('f-briefTrialDays').value) || 30) : null,
        platforms,
        progress: (d.brief && d.brief.progress) || {},
        warmupTikTok, warmupInstagram,
        warmupTikTokTaskId: (d.brief && d.brief.warmupTikTokTaskId) || null,
        warmupInstagramTaskId: (d.brief && d.brief.warmupInstagramTaskId) || null,
      };
      // create the recurring task the first time each warm-up toggle is turned on — never duplicate
      // if it already exists, and never auto-delete it if the toggle is turned back off (that's the
      // user's call, managed from the Tasks tab, not something a brief edit should silently do)
      if(warmupTikTok && !DATA.tasks.some(t=>t.id===d.brief.warmupTikTokTaskId)){
        const t = { id:uid('tk_'), title:`Scroll TikTok — warm up (${d.name})`, brandId:d.id, priority:'medium', daily:true, requiresTimer:true, completed:false, dailyDone:{}, createdAt: todayISO() };
        DATA.tasks.push(t);
        d.brief.warmupTikTokTaskId = t.id;
      }
      if(warmupInstagram && !DATA.tasks.some(t=>t.id===d.brief.warmupInstagramTaskId)){
        const t = { id:uid('tk_'), title:`Scroll Instagram — warm up (${d.name})`, brandId:d.id, priority:'medium', daily:true, requiresTimer:true, completed:false, dailyDone:{}, createdAt: todayISO() };
        DATA.tasks.push(t);
        d.brief.warmupInstagramTaskId = t.id;
      }
    } else {
      d.brief = null;
    }
    const idx = DATA.brands.findIndex(b=>b.id===d.id);
    if(idx>=0) DATA.brands[idx]=d; else DATA.brands.push(d);
    saveData(); closeModal();
  });
  const deleteBrand = document.getElementById('deleteBrand');
  if(deleteBrand) deleteBrand.addEventListener('click', () => {
    askConfirm('Delete this brand? Its content and payments stay logged but unlinked.', () => {
      DATA.brands = DATA.brands.filter(b=>b.id!==MODAL_STATE.draft.id);
      saveData(); closeModal();
    });
  });

  const saveContent = document.getElementById('saveContent');
  if(saveContent) saveContent.addEventListener('click', () => {
    const d = MODAL_STATE.draft;
    d.title = document.getElementById('f-title').value.trim();
    d.brandId = document.getElementById('f-brand').value;
    d.basePay = Number(document.getElementById('f-basepay').value)||0;
    d.cpmBonus = Number(document.getElementById('f-cpmbonus').value)||0;
    d.viewRequirement = Number(document.getElementById('f-viewreq').value) || null;
    d.viewRequirementWindowDays = Number(document.getElementById('f-viewreqwindow').value) || null;
    if(!d.viewRequirement) d.viewRequirementMet = false;
    d.platforms.forEach(pd => {
      pd.active = document.querySelector(`[data-p-active="${pd.id}"]`).checked;
      pd.status = document.querySelector(`[data-p-status="${pd.id}"]`).value;
      pd.url = document.querySelector(`[data-p-url="${pd.id}"]`).value;
      pd.views = document.querySelector(`[data-p-views="${pd.id}"]`).value;
      // postDate already lives on the draft via the date picker — but if it's still blank
      // and this platform is being saved as Published, backfill today's date, or this item
      // becomes invisible to Earned in every time range until someone notices and fixes it.
      if(pd.active && pd.status==='published' && !pd.postDate) pd.postDate = todayISO();
    });
    const idx = DATA.content.findIndex(c=>c.id===d.id);
    const isNew = idx < 0;
    if(idx>=0) DATA.content[idx]=d; else DATA.content.push(d);
    if(isNew) bumpBriefProgressForContentCreation(d.brandId); // a real video was just logged — count it toward today's quota
    saveData(); closeModal();
  });
  const viewReqBtn = document.getElementById('f-viewreqmet');
  if(viewReqBtn) viewReqBtn.addEventListener('click', () => { MODAL_STATE.draft.viewRequirementMet = !MODAL_STATE.draft.viewRequirementMet; render(); document.getElementById('overlay').classList.add('open'); });
  const deleteContent = document.getElementById('deleteContent');
  if(deleteContent) deleteContent.addEventListener('click', () => {
    askConfirm('Delete this content entry? This cannot be undone.', () => {
      DATA.content = DATA.content.filter(c=>c.id!==MODAL_STATE.draft.id);
      saveData(); closeModal();
    });
  });

  const savePayment = document.getElementById('savePayment');
  if(savePayment) savePayment.addEventListener('click', () => {
    const d = MODAL_STATE.draft;
    d.brandId = document.getElementById('f-pbrand').value;
    d.amount = Number(document.getElementById('f-pamount').value)||0;
    d.cpmBonus = Number(document.getElementById('f-pcpmbonus').value) || 0;
    d.date = d.date || todayISO();
    d.note = document.getElementById('f-pnote').value;
    d.createdAt = new Date().toISOString();
    DATA.payments.push(d);
    saveData(); closeModal();
  });

  const taskTimerToggle = document.getElementById('f-ttimer');
  if(taskTimerToggle) taskTimerToggle.addEventListener('change', () => {
    const field = document.getElementById('f-ttimerMinutesField');
    if(field) field.style.display = taskTimerToggle.checked ? 'block' : 'none';
  });

  const saveTask = document.getElementById('saveTask');
  if(saveTask) saveTask.addEventListener('click', () => {
    const d = MODAL_STATE.draft;
    d.title = document.getElementById('f-ttitle').value.trim() || 'Untitled task';
    d.brandId = document.getElementById('f-tbrand').value;
    d.priority = document.getElementById('f-tpriority').value;
    d.daily = document.getElementById('f-tdaily').checked;
    d.requiresTimer = document.getElementById('f-ttimer').checked;
    d.timerMinutes = d.requiresTimer ? Math.max(1, Math.min(240, Number(document.getElementById('f-ttimerMinutes').value) || 10)) : (d.timerMinutes || 10);
    const idx = DATA.tasks.findIndex(t=>t.id===d.id);
    if(idx>=0) DATA.tasks[idx]=d; else DATA.tasks.push(d);
    saveData(); closeModal();
  });
  const deleteTask = document.getElementById('deleteTask');
  if(deleteTask) deleteTask.addEventListener('click', () => {
    askConfirm('Delete this task?', () => {
      if(TASK_TIMERS[MODAL_STATE.draft.id]){ clearInterval(TASK_TIMERS[MODAL_STATE.draft.id].intervalId); delete TASK_TIMERS[MODAL_STATE.draft.id]; }
      DATA.tasks = DATA.tasks.filter(t=>t.id!==MODAL_STATE.draft.id);
      saveData(); closeModal();
    });
  });

  // AI drawer
  // data management
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', exportData);
  const importFile = document.getElementById('importFile');
  const btnImport = document.getElementById('btnImport');
  if(btnImport) btnImport.addEventListener('click', () => importFile.click());
  if(importFile) importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importDataFile(file);
    importFile.value = '';
  });
  const btnDemo = document.getElementById('btnDemo');
  if(btnDemo) btnDemo.addEventListener('click', loadDemoData);
  const btnClear = document.getElementById('btnClear');
  if(btnClear) btnClear.addEventListener('click', clearAllData);
  const btnEnableBackup = document.getElementById('btnEnableBackup');
  if(btnEnableBackup) btnEnableBackup.addEventListener('click', enableAutoBackup);
  const btnBackupReconnect = document.getElementById('btnBackupReconnect');
  if(btnBackupReconnect) btnBackupReconnect.addEventListener('click', reconnectAutoBackup);
  const btnBackupStatus = document.getElementById('btnBackupStatus');
  if(btnBackupStatus) btnBackupStatus.addEventListener('click', () => {
    askConfirm(`Turn off auto-backup to ${BACKUP_FILENAME}? The file itself won't be deleted.`, disableAutoBackup);
  });

  const aiToggleBtn = document.getElementById('aiToggleBtn');
  if(aiToggleBtn) aiToggleBtn.addEventListener('click', toggleAI);
  const aiClose = document.getElementById('aiClose');
  if(aiClose) aiClose.addEventListener('click', () => { setAIOpen(false); });
  const aiSettingsToggle = document.getElementById('aiSettingsToggle');
  if(aiSettingsToggle) aiSettingsToggle.addEventListener('click', () => { AI_SETTINGS_OPEN = !AI_SETTINGS_OPEN; render(); });
  const aiSettingsSave = document.getElementById('aiSettingsSave');
  if(aiSettingsSave) aiSettingsSave.addEventListener('click', () => {
    AI_SETTINGS.apiKey = document.getElementById('f-aiApiKey').value.trim();
    AI_SETTINGS.model = document.getElementById('f-aiModel').value;
    saveAISettings();
    showToast(AI_SETTINGS.apiKey ? 'Saved — now calling Anthropic directly with your key' : 'Saved');
    render();
  });
  const aiSettingsClear = document.getElementById('aiSettingsClear');
  if(aiSettingsClear) aiSettingsClear.addEventListener('click', () => {
    AI_SETTINGS.apiKey = '';
    saveAISettings();
    showToast('Key removed — back to Claude\'s built-in connection');
    render();
  });
  const aiSend = document.getElementById('aiSend');
  const aiInput = document.getElementById('aiInput');
  if(aiSend) aiSend.addEventListener('click', () => { const v = aiInput.value.trim(); aiInput.value=''; sendAI(v); });
  if(aiInput) aiInput.addEventListener('keydown', (e) => { if(e.key==='Enter'){ const v = aiInput.value.trim(); aiInput.value=''; sendAI(v); } });
  document.querySelectorAll('[data-ai-suggest]').forEach(el => el.addEventListener('click', () => sendAI(el.dataset.aiSuggest)));

  scrollAiLog();
}

/* ---------------- Escape closes whatever's on top ---------------- */
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(DP){ DP = null; render(); return; }
  if(TIMER_DONE_POPUP){ TIMER_DONE_POPUP = null; render(); return; }
  if(CONFIRM_STATE){ CONFIRM_STATE = null; render(); return; }
  if(MODAL_STATE.type){ closeModal(); return; }
  if(AI_OPEN){ setAIOpen(false); return; }
});

loadData();
</script>
</body>
</html>
